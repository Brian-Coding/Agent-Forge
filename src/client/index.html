<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code GUI</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
      --text-primary: #e6edf3; --text-secondary: #8b949e; --text-muted: #6e7681;
      --accent: #2f81f7; --success: #3fb950; --warning: #d29922; --error: #f85149;
      --border: #30363d;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; line-height: 1.5; }
    #root { height: 100vh; }
    .app { display: flex; height: 100vh; }

    /* Activity Bar (VS Code-style) */
    .activity-bar { width: 48px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 8px; flex-shrink: 0; gap: 4px; }
    .activity-bar-btn { width: 40px; height: 40px; background: none; border: none; color: var(--text-muted); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; }
    .activity-bar-btn:hover { color: var(--text-primary); background: var(--bg-tertiary); }
    .activity-bar-btn.active { color: var(--text-primary); }
    .activity-bar-btn.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--accent); border-radius: 0 2px 2px 0; }
    .activity-bar-spacer { flex: 1; }
    .activity-bar-bottom { margin-bottom: 8px; }

    /* Sidebar Panel */
    .sidebar-panel { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
    .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }
    .sidebar-header-actions { display: flex; gap: 4px; }
    .sidebar-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; border-radius: 4px; font-size: 14px; }
    .sidebar-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .agents-header { padding: 12px 16px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .agent-list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .agent-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; position: relative; }
    .agent-item:hover { background: var(--bg-tertiary); }
    .agent-item.selected { background: var(--accent); }
    .agent-info { flex: 1; min-width: 0; }
    .agent-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .agent-item.selected .agent-status { color: rgba(255,255,255,0.7); }
    .agent-delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; border-radius: 3px; font-size: 12px; opacity: 0; }
    .agent-item:hover .agent-delete-btn { opacity: 1; }
    .agent-delete-btn:hover { background: var(--error); color: white; }

    /* Status dot */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-idle { background: var(--success); }
    .status-working { background: var(--accent); animation: pulse 1.5s infinite; }
    .status-thinking { background: var(--warning); animation: pulse 1.2s infinite; }
    .status-error { background: var(--error); }
    .status-stopped { background: var(--text-muted); opacity: 0.5; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Main content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Top bar */
    .top-bar { height: 48px; padding: 0 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .top-bar-left { display: flex; align-items: center; gap: 8px; }
    .top-bar-right { display: flex; align-items: center; gap: 12px; }
    .grid-controls { display: flex; align-items: center; gap: 8px; }
    .grid-label { font-size: 12px; color: var(--text-secondary); }
    .grid-buttons { display: flex; gap: 2px; }
    .grid-btn { width: 24px; height: 24px; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); border-radius: 4px; cursor: pointer; font-size: 12px; }
    .grid-btn:hover { background: var(--border); }
    .grid-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    /* Broadcast bar */
    .broadcast-bar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .broadcast-bar label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; white-space: nowrap; }
    .broadcast-input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 13px; padding: 4px 8px; outline: none; font-family: 'SF Mono', Monaco, Consolas, monospace; }
    .broadcast-input:focus { border-color: var(--accent); }
    .broadcast-send { background: var(--accent); border: none; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .broadcast-send:hover { opacity: 0.9; }

    /* Terminal grid */
    .terminal-grid { flex: 1; display: grid; gap: 1px; background: var(--border); overflow: hidden; }

    /* Terminal panel */
    .terminal-panel { background: var(--bg-primary); display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { height: 36px; padding: 0 8px 0 12px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .panel-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; min-width: 0; }
    .panel-title-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .panel-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 3px 6px; border-radius: 3px; font-size: 11px; }
    .panel-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .panel-btn-stop { color: var(--error); }
    .panel-btn-stop:hover { background: var(--error); color: white; }

    /* Notification bar in panel */
    .panel-notification { padding: 4px 12px; font-size: 11px; text-align: center; flex-shrink: 0; }
    .panel-notification-done { background: rgba(63, 185, 80, 0.15); color: var(--success); }
    .panel-notification-files { background: rgba(210, 153, 34, 0.15); color: var(--warning); cursor: pointer; }

    /* Panel content — chat area */
    .panel-content { flex: 1; overflow-y: auto; padding: 0; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; line-height: 1.6; }
    .panel-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* Chat turns */
    .chat-turn { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .chat-turn:last-child { border-bottom: none; }
    .chat-turn-role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .chat-turn-content { white-space: pre-wrap; word-wrap: break-word; }
    .chat-turn-user { background: var(--bg-secondary); }
    .chat-turn-user .chat-turn-role { color: var(--accent); }
    .chat-turn-assistant { background: var(--bg-primary); }
    .chat-turn-assistant .chat-turn-role { color: var(--success); }
    .chat-turn-assistant .chat-turn-content { white-space: normal; }
    .chat-turn-system { background: var(--bg-tertiary); }
    .chat-turn-system .chat-turn-role { color: var(--warning); }
    .chat-turn-system .chat-turn-content { color: var(--text-secondary); font-style: italic; }
    .chat-turn-streaming { background: var(--bg-primary); }
    .chat-turn-streaming .chat-turn-role { color: var(--success); }
    .chat-turn-queued { background: var(--bg-secondary); opacity: 0.5; }
    .chat-turn-queued .chat-turn-role { color: var(--text-muted); }

    /* Thinking block */
    .thinking-block { border-left: 3px solid var(--warning); margin: 6px 14px; padding: 8px 12px; background: rgba(210, 153, 34, 0.06); border-radius: 0 6px 6px 0; }
    .thinking-header { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; color: var(--warning); text-transform: uppercase; letter-spacing: 0.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .thinking-header svg { width: 12px; height: 12px; transition: transform 0.2s; }
    .thinking-header.collapsed svg { transform: rotate(-90deg); }
    .thinking-content { color: var(--text-secondary); font-style: italic; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; margin-top: 6px; max-height: 300px; overflow-y: auto; }
    .thinking-content.hidden { display: none; }

    /* Markdown in assistant messages */
    .chat-turn-assistant .chat-turn-content p { margin: 0 0 8px 0; }
    .chat-turn-assistant .chat-turn-content p:last-child { margin-bottom: 0; }
    .chat-turn-assistant .chat-turn-content pre { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 8px 0; overflow-x: auto; position: relative; }
    .chat-turn-assistant .chat-turn-content code { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; }
    .chat-turn-assistant .chat-turn-content :not(pre) > code { background: var(--bg-tertiary); padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    .chat-turn-assistant .chat-turn-content ul, .chat-turn-assistant .chat-turn-content ol { padding-left: 20px; margin: 4px 0; }
    .chat-turn-assistant .chat-turn-content h1, .chat-turn-assistant .chat-turn-content h2, .chat-turn-assistant .chat-turn-content h3 { margin: 12px 0 4px 0; }
    .chat-turn-assistant .chat-turn-content strong { color: var(--text-primary); }
    .copy-code-btn { position: absolute; top: 6px; right: 6px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .copy-code-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    /* Blinking cursor */
    .cursor { display: inline-block; width: 7px; height: 15px; background: var(--success); animation: blink 1s step-end infinite; vertical-align: text-bottom; margin-left: 2px; }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    /* Scroll anchor */
    .scroll-anchor { height: 1px; }

    /* Panel input */
    .panel-input-container { padding: 8px 12px; background: var(--bg-secondary); border-top: 1px solid var(--border); flex-shrink: 0; }
    .panel-input-wrapper { display: flex; align-items: flex-end; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 0 12px; }
    .panel-input-wrapper:focus-within { border-color: var(--accent); }
    .panel-textarea { flex: 1; background: transparent; border: none; color: var(--text-primary); font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; padding: 8px 0; outline: none; resize: none; min-height: 20px; max-height: 120px; line-height: 1.4; }
    .panel-textarea::placeholder { color: var(--text-muted); }

    /* Buttons */
    .btn { padding: 6px 12px; border-radius: 6px; font-weight: 500; cursor: pointer; border: 1px solid transparent; font-size: 12px; }
    .btn-primary { background: var(--success); color: white; }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border); }
    .btn-danger { background: var(--error); color: white; border-color: var(--error); }
    .btn-danger:hover { opacity: 0.9; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
    .form-input, .form-textarea { width: 100%; padding: 10px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 14px; }
    .form-textarea { min-height: 60px; resize: vertical; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Shared context modal */
    .shared-context-textarea { width: 100%; min-height: 200px; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; resize: vertical; }
    .shared-context-textarea:focus { outline: none; border-color: var(--accent); }

    /* Connection status */
    .connection-error { padding: 8px 16px; background: var(--error); color: white; text-align: center; font-size: 12px; flex-shrink: 0; }

    /* Folder browser */
    .folder-browser { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; max-height: 200px; overflow: hidden; display: flex; flex-direction: column; }
    .folder-path { padding: 6px 10px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folder-list { flex: 1; overflow-y: auto; padding: 2px; }
    .folder-item { padding: 5px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .folder-item:hover { background: var(--bg-tertiary); }
    .folder-actions { display: flex; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); background: var(--bg-tertiary); }
    .browse-btn { padding: 5px 10px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-size: 12px; }
    .browse-btn:hover { background: var(--border); }

    /* Reference paths */
    .ref-paths-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .ref-path-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
    .ref-path-item button { background: none; border: none; color: var(--error); cursor: pointer; font-size: 14px; padding: 0 2px; }

    /* Keyboard shortcut hint */
    .shortcuts-hint { font-size: 10px; color: var(--text-muted); padding: 4px 16px 8px; }
    kbd { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-size: 10px; font-family: inherit; }

    /* Notes panel */
    .notes-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .notes-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .note-item { padding: 8px 10px; border-radius: 6px; margin-bottom: 4px; background: var(--bg-primary); border: 1px solid var(--border); cursor: pointer; }
    .note-item:hover { border-color: var(--accent); }
    .note-item.active { border-color: var(--accent); background: rgba(47, 129, 247, 0.08); }
    .note-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .note-editor { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 6px; overflow: hidden; }
    .note-editor input { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 13px; font-weight: 600; padding: 6px 8px; }
    .note-editor input:focus { outline: none; border-color: var(--accent); }
    .note-editor textarea { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 12px; padding: 8px; resize: none; font-family: 'SF Mono', Monaco, Consolas, monospace; line-height: 1.5; }
    .note-editor textarea:focus { outline: none; border-color: var(--accent); }
    .note-actions { display: flex; gap: 4px; padding: 6px 8px; border-top: 1px solid var(--border); }

    /* Kanban panel */
    .kanban-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .kanban-add { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--border); }
    .kanban-add input { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 12px; padding: 5px 8px; }
    .kanban-add input:focus { outline: none; border-color: var(--accent); }
    .kanban-columns { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .kanban-column { margin-bottom: 12px; }
    .kanban-col-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; cursor: pointer; user-select: none; }
    .kanban-col-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .kanban-col-count { font-size: 10px; background: var(--bg-tertiary); border-radius: 8px; padding: 0 6px; color: var(--text-secondary); }
    .kanban-card { padding: 8px 10px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; font-size: 12px; }
    .kanban-card-title { font-weight: 500; margin-bottom: 2px; }
    .kanban-card-desc { color: var(--text-muted); font-size: 11px; }
    .kanban-card-actions { display: flex; gap: 2px; margin-top: 4px; }
    .kanban-card-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 1px 4px; border-radius: 3px; }
    .kanban-card-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .kanban-card-btn.delete:hover { color: var(--error); }

    /* Emulators panel */
    .emu-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .emu-toolbar { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .emu-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .emu-runtime { margin-bottom: 8px; }
    .emu-runtime-header { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 0; }
    .emu-device { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 3px; font-size: 12px; }
    .emu-device-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .emu-device-state { font-size: 10px; padding: 1px 6px; border-radius: 8px; margin: 0 6px; flex-shrink: 0; }
    .emu-state-booted { background: rgba(63,185,80,0.2); color: var(--success); }
    .emu-state-shutdown { background: var(--bg-tertiary); color: var(--text-muted); }
    .emu-device-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .emu-msg { padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px; }

    /* Auto-scroll button (Feature 4) */
    .auto-scroll-btn { position: sticky; bottom: 8px; align-self: flex-end; z-index: 2; margin: 4px 8px; padding: 4px 10px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; color: var(--text-secondary); cursor: pointer; font-size: 11px; opacity: 0.85; white-space: nowrap; }
    .auto-scroll-btn:hover { background: var(--accent); color: white; border-color: var(--accent); opacity: 1; }

    /* Verbose status elapsed (Feature 5) */
    .status-elapsed { font-size: 10px; color: var(--text-muted); margin-left: 2px; }
    .status-stuck { color: var(--warning); font-weight: 600; }

    /* Tool filter toggle (Feature 7) */
    .tool-filter-btn { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
    .tool-filter-btn.active { background: var(--accent); color: white; }
    .tool-hidden-count { font-size: 10px; color: var(--text-muted); padding: 2px 14px; font-style: italic; }

    /* Minimized panels (Feature 2) */
    .panel-minimized { height: 36px; flex-shrink: 0; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; cursor: pointer; }
    .panel-minimized:hover { background: var(--bg-tertiary); }
    .panel-minimized-name { font-size: 12px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-unread-badge { background: var(--accent); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; min-width: 16px; text-align: center; }
    .panel-minimize-btn { font-size: 14px; padding: 2px 4px; }

    /* Default emulator star (Feature 9) */

    /* Image upload (Feature 3) */

    /* Copy message button (Feature 7) */
    .chat-turn { position: relative; }
    .copy-msg-btn { position: absolute; top: 6px; right: 6px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; opacity: 0; transition: opacity 0.15s; z-index: 1; }
    .chat-turn:hover .copy-msg-btn { opacity: 1; }

    /* Search chat history (Feature 1) */
    .panel-search-bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .panel-search-input { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 12px; padding: 3px 8px; outline: none; font-family: 'SF Mono', Monaco, Consolas, monospace; }

    /* Cost dashboard (Feature 3) */

    /* Broadcast toggle (Feature 10) */
    .broadcast-toggle { display: flex; align-items: center; gap: 6px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .broadcast-toggle:hover { border-color: var(--accent); color: var(--text-primary); }

    .broadcast-chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
    .broadcast-chip.unselected { background: var(--bg-secondary); color: var(--text-muted); }
    .broadcast-chip:hover { opacity: 0.85; }
    .broadcast-chip-count { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

    /* Agent edit button */
    .agent-edit-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; border-radius: 3px; font-size: 12px; opacity: 0; }
    .agent-item:hover .agent-edit-btn { opacity: 1; }
    .agent-edit-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

    /* Workspace sidebar */
    .workspace-list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .workspace-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; position: relative; border: 1px solid transparent; }
    .workspace-item:hover { background: var(--bg-tertiary); }
    .workspace-item.active { background: rgba(47, 129, 247, 0.12); border-color: var(--accent); }
    .workspace-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .workspace-meta { font-size: 11px; color: var(--text-muted); }
    .workspace-delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; border-radius: 3px; font-size: 12px; opacity: 0; }

    .workspace-agent-chip { display: flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 11px; color: var(--text-secondary); border-radius: 4px; }
    .workspace-agent-chip:hover { background: var(--bg-tertiary); }

    .slot-add-btn { background: var(--bg-tertiary); border: 2px dashed var(--border); border-radius: 12px; color: var(--text-muted); cursor: pointer; padding: 16px 24px; font-size: 14px; font-weight: 500; transition: all 0.15s; }
    .slot-add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(47, 129, 247, 0.08); }

    /* Scrollbars */
    .panel-content::-webkit-scrollbar, .notes-list::-webkit-scrollbar, .kanban-columns::-webkit-scrollbar, .emu-list::-webkit-scrollbar, .agent-list::-webkit-scrollbar, .docs-list::-webkit-scrollbar { width: 6px; }
    .panel-content::-webkit-scrollbar-track, .notes-list::-webkit-scrollbar-track, .kanban-columns::-webkit-scrollbar-track, .emu-list::-webkit-scrollbar-track, .agent-list::-webkit-scrollbar-track, .docs-list::-webkit-scrollbar-track { background: transparent; }
    .panel-content::-webkit-scrollbar-thumb, .notes-list::-webkit-scrollbar-thumb, .kanban-columns::-webkit-scrollbar-thumb, .emu-list::-webkit-scrollbar-thumb, .agent-list::-webkit-scrollbar-thumb, .docs-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

<body>
  <div id="root"></div>
  <script>
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const e = React.createElement;

    // Configure marked for markdown rendering
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch {}
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
    });

    // SVG icon helper
    function Icon({ d, size }) {
      size = size || 18;
      return e('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
        Array.isArray(d) ? d.map((p, i) => e('path', { key: i, d: p })) : e('path', { d })
      );
    }

    // Icon paths (Lucide-style)
    const ICONS = {
      agents: ['M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8', 'M23 21v-2a4 4 0 0 0-3-3.87', 'M16 3.13a4 4 0 0 1 0 7.75'],
      notes: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6', 'M16 13H8', 'M16 17H8', 'M10 9H8'],
      emulators: ['M12 18h.01', 'M7 21h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2z'],
      kanban: ['M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18'],
      settings: ['M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', 'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'],
      chevron: 'M6 9l6 6 6-6',
      documents: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6', 'M16 13H8', 'M16 17H8'],
      image: ['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', 'M17 8l-5-5-5 5', 'M12 3v12'],
    };

    // ======================== HOOKS ========================

    // Hook: elapsed time since a status started (Feature 5)
    function useElapsed(status, statusStartTime) {
      const [elapsed, setElapsed] = useState('');
      useEffect(() => {
        if (!statusStartTime || (status !== 'working' && status !== 'thinking')) {
          setElapsed('');
          return;
        }
        const tick = () => {
          const diff = Math.floor((Date.now() - statusStartTime) / 1000);
          if (diff < 60) setElapsed(diff + 's');
          else {
            const m = Math.floor(diff / 60);
            const s = diff % 60;
            setElapsed(m + 'm ' + (s < 10 ? '0' : '') + s + 's');
          }
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, [status, statusStartTime]);
      const isStuck = statusStartTime && status === 'working' && (Date.now() - statusStartTime) > 600000;
      return { elapsed, isStuck };
    }

    function useWebSocket() {
      const [connected, setConnected] = useState(false);
      const [agents, setAgents] = useState([]);
      const [messages, setMessages] = useState({});
      const [liveOutput, setLiveOutput] = useState({});
      const [queued, setQueued] = useState({});
      const [sharedContext, setSharedContext] = useState('');
      const [fileChanges, setFileChanges] = useState({});
      const [thinkingOutput, setThinkingOutput] = useState({});
      const [notes, setNotes] = useState([]);
      const [kanbanItems, setKanbanItems] = useState([]);
      const [kanbanBoards, setKanbanBoards] = useState([]);
      const [documents, setDocuments] = useState([]);
      const [settings, setSettings] = useState({});
      const [workspaces, setWorkspaces] = useState([]);
      const [statusStartTimes, setStatusStartTimes] = useState({});
      const [tokenUsage, setTokenUsage] = useState({});
      const wsRef = useRef(null);
      const agentsRef = useRef([]);
      const queueRef = useRef({});

      agentsRef.current = agents;
      queueRef.current = queued;

      const sendRaw = useCallback((msg) => {
        if (wsRef.current?.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify(msg));
        }
      }, []);

      const drainQueue = useCallback((agentId) => {
        const q = queueRef.current[agentId];
        if (q && q.length > 0) {
          const next = q[0];
          setQueued(prev => {
            const updated = [...(prev[agentId] || [])];
            updated.shift();
            return { ...prev, [agentId]: updated };
          });
          sendRaw({ type: 'send_message', agentId, content: next });
        }
      }, [sendRaw]);

      useEffect(() => {
        function connect() {
          const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const ws = new WebSocket(protocol + '//' + location.host);
          ws.onopen = () => setConnected(true);
          ws.onclose = () => { setConnected(false); setTimeout(connect, 2000); };
          ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            switch (msg.type) {
              case 'agents_list':
                setAgents(msg.agents);
                msg.agents.forEach(a => sendRaw({ type: 'get_history', agentId: a.id }));
                sendRaw({ type: 'get_shared_context' });
                break;
              case 'agent_created':
                setAgents(prev => [...prev, msg.agent]);
                break;
              case 'agent_updated':
                setAgents(prev => {
                  const old = prev.find(a => a.id === msg.agent.id);
                  if (old && old.status !== msg.agent.status) {
                    setStatusStartTimes(st => ({ ...st, [msg.agent.id]: Date.now() }));
                  }
                  return prev.map(a => a.id === msg.agent.id ? msg.agent : a);
                });
                if (msg.agent.status === 'idle') {
                  drainQueue(msg.agent.id);
                  setThinkingOutput(prev => { const n = {...prev}; delete n[msg.agent.id]; return n; });
                }
                break;
              case 'agent_removed':
                setAgents(prev => prev.filter(a => a.id !== msg.agentId));
                setMessages(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                setLiveOutput(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                setThinkingOutput(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                break;
              case 'message':
                setMessages(prev => ({
                  ...prev,
                  [msg.message.agentId]: [...(prev[msg.message.agentId] || []), msg.message]
                }));
                if (msg.message.role === 'assistant') {
                  setLiveOutput(prev => ({ ...prev, [msg.message.agentId]: '' }));
                }
                break;
              case 'history':
                setMessages(prev => ({ ...prev, [msg.agentId]: msg.messages }));
                break;
              case 'history_cleared':
                setMessages(prev => ({ ...prev, [msg.agentId]: [] }));
                setLiveOutput(prev => ({ ...prev, [msg.agentId]: '' }));
                setThinkingOutput(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                break;
              case 'output':
                setLiveOutput(prev => ({
                  ...prev,
                  [msg.agentId]: (prev[msg.agentId] || '') + msg.content
                }));
                break;
              case 'thinking_output':
                setThinkingOutput(prev => ({
                  ...prev,
                  [msg.agentId]: (prev[msg.agentId] || '') + msg.content
                }));
                break;
              case 'shared_context':
                setSharedContext(msg.content);
                break;
              case 'file_changed':
                setFileChanges(prev => ({ ...prev, [msg.agentId]: msg.files }));
                break;
              // Notes
              case 'notes_list':
                setNotes(msg.notes);
                break;
              case 'note_created':
                setNotes(prev => [...prev, msg.note]);
                break;
              case 'note_updated':
                setNotes(prev => prev.map(n => n.id === msg.note.id ? msg.note : n));
                break;
              case 'note_deleted':
                setNotes(prev => prev.filter(n => n.id !== msg.id));
                break;
              // Kanban
              case 'kanban_list':
                setKanbanItems(msg.items);
                break;
              case 'kanban_item_created':
                setKanbanItems(prev => [...prev, msg.item]);
                break;
              case 'kanban_item_updated':
                setKanbanItems(prev => prev.map(i => i.id === msg.item.id ? msg.item : i));
                break;
              case 'kanban_item_deleted':
                setKanbanItems(prev => prev.filter(i => i.id !== msg.id));
                break;
              // Kanban Boards
              case 'kanban_boards_list':
                setKanbanBoards(msg.boards);
                break;
              case 'kanban_board_created':
                setKanbanBoards(prev => [...prev, msg.board]);
                break;
              case 'kanban_board_deleted':
                setKanbanBoards(prev => prev.filter(b => b.id !== msg.id));
                break;
              // Documents
              case 'documents_list':
                setDocuments(msg.documents);
                break;
              case 'document_created':
                setDocuments(prev => [...prev, msg.document]);
                break;
              case 'document_updated':
                setDocuments(prev => prev.map(d => d.id === msg.document.id ? msg.document : d));
                break;
              case 'document_deleted':
                setDocuments(prev => prev.filter(d => d.id !== msg.id));
                break;
              // Settings
              case 'settings':
                setSettings(msg.settings);
                break;
              // Token usage
              case 'token_usage':
                setTokenUsage(prev => ({ ...prev, [msg.agentId]: { contextTokens: msg.contextTokens, contextLimit: msg.contextLimit, totalInputTokens: msg.totalInputTokens, totalOutputTokens: msg.totalOutputTokens, totalCostUsd: msg.totalCostUsd, numTurns: msg.numTurns } }));
                break;
              // Workspaces
              case 'workspaces_list':
                setWorkspaces(msg.workspaces);
                break;
              case 'workspace_created':
                setWorkspaces(prev => [...prev, msg.workspace]);
                break;
              case 'workspace_updated':
                setWorkspaces(prev => prev.map(w => w.id === msg.workspace.id ? msg.workspace : w));
                break;
              case 'workspace_deleted':
                setWorkspaces(prev => prev.filter(w => w.id !== msg.id));
                break;
            }
          };
          wsRef.current = ws;
        }
        connect();
        return () => wsRef.current?.close();
      }, [drainQueue, sendRaw]);

      return {
        connected, agents, messages, liveOutput, queued, sharedContext, fileChanges, thinkingOutput, notes, kanbanItems, kanbanBoards, documents, settings, workspaces, statusStartTimes, tokenUsage,
        createAgent: (name, cwd, referencePaths, systemPrompt, workspaceId) => {
          sendRaw({ type: 'create_agent', name, cwd, referencePaths, systemPrompt, workspaceId });
        },
        sendMessage: (agentId, content) => {
          const agent = agentsRef.current.find(a => a.id === agentId);
          if (agent && (agent.status === 'working' || agent.status === 'thinking')) {
            setQueued(prev => ({ ...prev, [agentId]: [...(prev[agentId] || []), content] }));
          } else {
            sendRaw({ type: 'send_message', agentId, content });
          }
        },

        killAgent: (agentId) => sendRaw({ type: 'kill_agent', agentId }),
        removeAgent: (agentId) => sendRaw({ type: 'remove_agent', agentId }),
        clearHistory: (agentId) => sendRaw({ type: 'clear_history', agentId }),
        broadcastMessage: (agentIds, content) => sendRaw({ type: 'broadcast_message', agentIds, content }),
        updateSharedContext: (content) => sendRaw({ type: 'update_shared_context', content }),
        clearFileChanges: (agentId) => setFileChanges(prev => ({ ...prev, [agentId]: [] })),
        // Notes
        createNote: (title, content, agentId) => sendRaw({ type: 'create_note', title, content, agentId }),
        updateNote: (id, updates) => sendRaw({ type: 'update_note', id, ...updates }),
        deleteNote: (id) => sendRaw({ type: 'delete_note', id }),
        // Kanban
        createKanbanItem: (title, description, column, boardId) => sendRaw({ type: 'create_kanban_item', title, description, column, boardId }),
        updateKanbanItem: (id, updates) => sendRaw({ type: 'update_kanban_item', id, ...updates }),
        deleteKanbanItem: (id) => sendRaw({ type: 'delete_kanban_item', id }),
        // Kanban Boards
        createKanbanBoard: (name, projectPath) => sendRaw({ type: 'create_kanban_board', name, projectPath }),
        deleteKanbanBoard: (id) => sendRaw({ type: 'delete_kanban_board', id }),
        // Documents
        createDocument: (title, content, agentId) => sendRaw({ type: 'create_document', title, content, agentId }),
        updateDocument: (id, updates) => sendRaw({ type: 'update_document', id, ...updates }),
        deleteDocument: (id) => sendRaw({ type: 'delete_document', id }),
        // Settings
        updateSettings: (settings) => sendRaw({ type: 'update_settings', settings }),
        // Image
        sendImage: (agentId, imageData, mimeType, prompt) => sendRaw({ type: 'send_image', agentId, imageData, mimeType, prompt }),
        // Update agent
        updateAgent: (id, updates) => sendRaw({ type: 'update_agent', id, ...updates }),
        // Workspaces
        createWorkspace: (name) => sendRaw({ type: 'create_workspace', name }),

        deleteWorkspace: (id) => sendRaw({ type: 'delete_workspace', id }),

    }

    // ======================== COMPONENTS ========================

    // Tool message filter (Feature 7)
    function filterToolMessages(text, show) {
      if (show) return text;
      return text.replace(/\n?\[Using tool: [^\]]+\]\n?/g, '');
    }
    function countToolMessages(text) {
      const matches = text.match(/\[Using tool: [^\]]+\]/g);
      return matches ? matches.length : 0;
    }

    // Highlight search query in HTML string (outside of tags)
    function highlightInHtml(html, query) {
      if (!query) return html;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // Replace text outside of HTML tags
      return html.replace(/>([^<]+)</g, (match, text) => {
        const highlighted = text.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark class="search-highlight">$1</mark>');
        return '>' + highlighted + '<';
      });
    }

    // Markdown renderer for assistant messages
    function MarkdownContent({ content, searchQuery }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.querySelectorAll('pre').forEach(pre => {
            if (pre.querySelector('.copy-code-btn')) return;
            const btn = document.createElement('button');
            btn.className = 'copy-code-btn';
            btn.textContent = 'Copy';
            btn.onclick = () => {
              const code = pre.querySelector('code');
              navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
              btn.textContent = 'Copied!';
              setTimeout(() => btn.textContent = 'Copy', 1500);
            };
            pre.style.position = 'relative';
            pre.appendChild(btn);
          });
        }
      }, [content, searchQuery]);
      const html = useMemo(() => {
        try {
          let parsed = marked.parse(content);
          if (searchQuery) parsed = highlightInHtml(parsed, searchQuery);
          return parsed;
        } catch { return content; }
      }, [content, searchQuery]);
      return e('div', { ref, className: 'chat-turn-content', dangerouslySetInnerHTML: { __html: html } });
    }

    // Highlight search text in plain text content
    function highlightText(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const parts = text.split(new RegExp('(' + escaped + ')', 'gi'));
      return parts.map((part, i) =>
        part.toLowerCase() === query.toLowerCase()
          ? e('mark', { key: i, className: 'search-highlight' }, part)
          : part
      );
    }

    // Chat Turn
    function ChatTurn({ role, content, isStreaming, imageData, imageMimeType, showToolMessages, searchQuery, showRetry, onRetry }) {
      const [copied, setCopied] = useState(false);
      const roleLabels = { user: 'You', assistant: 'Claude', system: 'System' };
      const turnClass = isStreaming ? 'chat-turn chat-turn-streaming' : 'chat-turn chat-turn-' + role;
      const displayContent = (role === 'assistant' || isStreaming) ? filterToolMessages(content, showToolMessages) : content;
      const hiddenCount = (role === 'assistant' || isStreaming) && !showToolMessages ? countToolMessages(content) : 0;

      const handleCopy = () => {
        navigator.clipboard.writeText(content);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };

      return e('div', { className: turnClass },
        e('button', { className: 'copy-msg-btn', onClick: handleCopy }, copied ? 'Copied!' : 'Copy'),
        e('div', { className: 'chat-turn-role' }, roleLabels[role] || role),
        imageData && e('img', { className: 'chat-image', src: 'data:' + (imageMimeType || 'image/png') + ';base64,' + imageData, alt: 'Uploaded image', onClick: () => window.open('data:' + (imageMimeType || 'image/png') + ';base64,' + imageData) }),
        role === 'assistant' && !isStreaming
          ? e(React.Fragment, null,
              e(MarkdownContent, { content: displayContent, searchQuery }),
              hiddenCount > 0 && e('div', { className: 'tool-hidden-count' }, hiddenCount + ' tool call' + (hiddenCount > 1 ? 's' : '') + ' hidden')
            )
          : e('div', { className: 'chat-turn-content' },
              searchQuery && !isStreaming ? highlightText(displayContent, searchQuery) : displayContent,
              isStreaming && e('span', { className: 'cursor' }),
              isStreaming && hiddenCount > 0 && e('div', { className: 'tool-hidden-count' }, hiddenCount + ' tool call' + (hiddenCount > 1 ? 's' : '') + ' hidden')
            ),
        showRetry && onRetry && e('button', { className: 'retry-btn', onClick: onRetry }, '\u21BB Retry')
      );
    }

    // Terminal Panel
    function TerminalPanel({ agent, messages, liveOutput, queuedMessages, fileChanges, thinkingOutput, statusStartTime, tokenUsage, onSendMessage, onSendImage, onStop, onClearHistory, onClearFileChanges, onMinimize, onMaximize, isMaximized, onFocus, isFocused }) {
      const [input, setInput] = useState('');
      const [inputHistory, setInputHistory] = useState([]);
      const [historyIdx, setHistoryIdx] = useState(-1);
      const [notification, setNotification] = useState(null);
      const [autoScrollEnabled, setAutoScrollEnabled] = useState(true);
      const [showToolMessages, setShowToolMessages] = useState(false);
      const [dragging, setDragging] = useState(false);
      const [pendingImage, setPendingImage] = useState(null);
      // Search state (Feature 1)
      const [searchVisible, setSearchVisible] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchMatchIndex, setSearchMatchIndex] = useState(0);
      const contentRef = useRef(null);
      const inputRef = useRef(null);
      const anchorRef = useRef(null);
      const prevStatus = useRef(agent?.status);
      const fileInputRef = useRef(null);
      const searchInputRef = useRef(null);

      // Elapsed time for status (Feature 5)
      const { elapsed, isStuck } = useElapsed(agent?.status, statusStartTime);

      // Auto-scroll: track whether user has scrolled up (Feature 4)
      useEffect(() => {
        const el = contentRef.current;
        if (!el) return;
        let ticking = false;
        const onScroll = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 50;
            setAutoScrollEnabled(atBottom);
            ticking = false;
          });
        };
        el.addEventListener('scroll', onScroll, { passive: true });
        return () => el.removeEventListener('scroll', onScroll);
      }, []);

      // Auto-scroll when new content arrives (only if enabled)
      useEffect(() => {
        if (autoScrollEnabled && contentRef.current) {
          contentRef.current.scrollTop = contentRef.current.scrollHeight;
        }
      }, [messages, liveOutput, queuedMessages, thinkingOutput, autoScrollEnabled]);

      // Notification when agent finishes
      useEffect(() => {
        if (agent && prevStatus.current === 'working' && agent.status === 'idle') {
          setNotification('done');
          const t = setTimeout(() => setNotification(null), 4000);
          return () => clearTimeout(t);
        }
        prevStatus.current = agent?.status;
      }, [agent?.status]);

      // Focus input on window focus and visibility change (Feature 8)
      useEffect(() => {
        const focusInput = () => { if (inputRef.current) inputRef.current.focus(); };
        window.addEventListener('focus', focusInput);
        const onVis = () => { if (!document.hidden) focusInput(); };
        document.addEventListener('visibilitychange', onVis);
        return () => { window.removeEventListener('focus', focusInput); document.removeEventListener('visibilitychange', onVis); };
      }, []);

      const handleSubmit = () => {
        if (!agent) return;
        const text = input.trim();
        // If there's a pending image, send it (with or without text)
        if (pendingImage) {
          onSendImage(agent.id, pendingImage.data, pendingImage.mimeType, text || undefined);
          setPendingImage(null);
          if (text) setInputHistory(prev => [...prev, text]);
          setHistoryIdx(-1);
          setInput('');
        } else if (text) {
          onSendMessage(text);
          setInputHistory(prev => [...prev, text]);
          setHistoryIdx(-1);
          setInput('');
        } else {
          return;
        }
        // Force auto-scroll on after sending
        setAutoScrollEnabled(true);
        requestAnimationFrame(() => {
          if (contentRef.current) contentRef.current.scrollTop = contentRef.current.scrollHeight;
          inputRef.current?.focus();
        });
      };

      const handleKeyDown = (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) {
          ev.preventDefault();
          handleSubmit();
        }
        if (ev.key === 'ArrowUp' && !input) {
          ev.preventDefault();
          if (inputHistory.length > 0) {
            const newIdx = historyIdx === -1 ? inputHistory.length - 1 : Math.max(0, historyIdx - 1);
            setHistoryIdx(newIdx);
            setInput(inputHistory[newIdx]);
          }
        }
        if (ev.key === 'ArrowDown' && historyIdx >= 0) {
          ev.preventDefault();
          if (historyIdx >= inputHistory.length - 1) {
            setHistoryIdx(-1);
            setInput('');
          } else {
            setHistoryIdx(historyIdx + 1);
            setInput(inputHistory[historyIdx + 1]);
          }
        }
      };

      // Auto-resize textarea
      useEffect(() => {
        if (inputRef.current) {
          inputRef.current.style.height = 'auto';
          inputRef.current.style.height = Math.min(inputRef.current.scrollHeight, 120) + 'px';
        }
      }, [input]);

      // Image handling (Feature 3) — stage image, send on Enter
      const handleImageUpload = useCallback((file) => {
        if (!file || !file.type.startsWith('image/') || !agent) return;
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1];
          setPendingImage({ data: base64, mimeType: file.type, name: file.name });
          inputRef.current?.focus();
        };
        reader.readAsDataURL(file);
      }, [agent]);

      const handleDrop = useCallback((ev) => {
        ev.preventDefault();
        setDragging(false);
        const files = ev.dataTransfer?.files;
        if (files && files.length > 0) handleImageUpload(files[0]);
      }, [handleImageUpload]);

      const handlePaste = useCallback((ev) => {
        const items = ev.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            ev.preventDefault();
            handleImageUpload(item.getAsFile());
            return;
          }
        }
      }, [handleImageUpload]);

      // Search matches (Feature 1)
      const searchMatches = useMemo(() => {
        if (!searchQuery || !messages) return [];
        const matches = [];
        const q = searchQuery.toLowerCase();
        (messages || []).forEach((m, i) => {
          if (m.content && m.content.toLowerCase().includes(q)) {
            matches.push(i);
          }
        });
        return matches;
      }, [messages, searchQuery]);

      // Compute last user message index for retry (Feature 9)
      const lastUserMsgIndex = useMemo(() => {
        const msgs = messages || [];
        for (let i = msgs.length - 1; i >= 0; i--) {
          if (msgs[i].role === 'user') return i;
        }
        return -1;
      }, [messages]);

      // Click in content area focuses input (Feature 8)
      const handleContentClick = useCallback((ev) => {
        if (window.getSelection()?.toString()) return; // Don't steal focus during text selection
        inputRef.current?.focus();
      }, []);

      if (!agent) {
        return e('div', { className: 'terminal-panel' }, e('div', { className: 'panel-content panel-empty' }, 'No agent assigned'));
      }

      const isWorking = agent.status === 'working' || agent.status === 'thinking';
      const msgs = messages || [];
      const queued = queuedMessages || [];
      const files = fileChanges || [];
      const thinking = thinkingOutput || '';

      // Status text for header (Feature 5)
      const statusText = isWorking && elapsed ? (agent.status === 'thinking' ? 'Thinking' : 'Working') + '... ' + elapsed + (isStuck ? ' (may be stuck)' : '') : '';

      return e('div', {
        className: 'terminal-panel' + (isFocused ? ' focused' : ''),
        style: { position: 'relative' },
        onMouseDown: () => onFocus && onFocus(agent.id),
        onKeyDown: (ev) => {
          // Ctrl+F opens search
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'f') {
            ev.preventDefault();
            ev.stopPropagation();
            setSearchVisible(true);
            setTimeout(() => searchInputRef.current?.focus(), 50);
          }
        },
      },
        // Header
        e('div', { className: 'panel-header', onDoubleClick: () => onMaximize && onMaximize(agent.id) },
          e('div', { className: 'panel-title' },
            e('span', { className: 'status-dot status-' + agent.status }),
            e('span', { className: 'panel-title-name' }, agent.name),
            statusText && e('span', { className: 'status-elapsed' + (isStuck ? ' status-stuck' : '') }, statusText)
          ),

    // ======================== SIDEBAR PANELS ========================

    // Agents Sidebar - with verbose status (Feature 5)
    function AgentStatusText({ agent, statusStartTimes }) {
      const { elapsed, isStuck } = useElapsed(agent.status, statusStartTimes[agent.id]);
      if (agent.status === 'thinking') return e('span', { className: isStuck ? 'status-stuck' : '' }, 'Thinking...' + (elapsed ? ' ' + elapsed : ''));
      if (agent.status === 'working') return e('span', { className: isStuck ? 'status-stuck' : '' }, 'Working...' + (elapsed ? ' ' + elapsed : '') + (isStuck ? ' (may be stuck)' : ''));
      if (agent.status === 'idle' && statusStartTimes[agent.id]) {
        const ago = Math.floor((Date.now() - statusStartTimes[agent.id]) / 1000);
        if (ago < 300) return e('span', null, 'Idle ' + (ago < 60 ? ago + 's' : Math.floor(ago/60) + 'm') + ' ago');
      }
      return e('span', null, agent.cwd.split('/').pop());
    }

    // Workspaces Sidebar
    function WorkspacesSidebar({ workspaces, agents, activeWorkspaceId, onSelectWorkspace, onCreateWorkspace, onDeleteWorkspace, onRenameWorkspace, onNewAgent, onEditAgent, onRemoveAgent, statusStartTimes }) {

      const startRename = (ws) => { setRenamingId(ws.id); setRenameValue(ws.name); };
      const commitRename = () => {
        if (renamingId && renameValue.trim()) {
          onRenameWorkspace(renamingId, renameValue.trim());
        }
        setRenamingId(null);
      };

      return e(React.Fragment, null,
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Workspaces'),
          e('div', { className: 'sidebar-header-actions' },
            e('button', { className: 'sidebar-btn', onClick: () => setShowNewModal(true), title: 'New Workspace' }, '+')

            : workspaces.map(ws => {

                return e(React.Fragment, { key: ws.id },
                  e('div', {

                    onClick: () => onSelectWorkspace(ws.id),
                  },
                    e('div', { style: { flex: 1, minWidth: 0 } },
                      renamingId === ws.id
                        ? e('input', {

                            value: renameValue,
                            onChange: (ev) => setRenameValue(ev.target.value),
                            onKeyDown: (ev) => { if (ev.key === 'Enter') commitRename(); if (ev.key === 'Escape') setRenamingId(null); },

                          })
                        : e('div', { className: 'workspace-name', onDoubleClick: (ev) => { ev.stopPropagation(); startRename(ws); } }, ws.name),

                        onEditAgent && e('button', {
                          className: 'agent-edit-btn',
                          style: { opacity: 0.7 },
                          onClick: (ev) => { ev.stopPropagation(); onEditAgent(agent); },
                          title: 'Edit agent'
                        }, '\u270E'),
                        e('button', {

                          style: { opacity: 0.7 },

                          title: 'Delete agent'
                        }, '\u00D7')
                      )
                    )
                  )
                );
              })
        ),
        e('div', { style: { padding: '8px' } },
          e('button', { className: 'btn btn-primary', style: { width: '100%' }, onClick: () => setShowNewModal(true) }, '+ New Workspace')
        ),
        e('div', { className: 'shortcuts-hint' },
          e('span', null, e(React.Fragment, null, e('kbd', null, 'Ctrl+N'), ' new agent ', e('kbd', null, 'Esc'), ' stop ', e('kbd', null, 'Ctrl+B'), ' broadcast'))

    // Notes Panel
    function NotesPanel({ notes, agents, onCreateNote, onUpdateNote, onDeleteNote }) {
      const [activeNoteId, setActiveNoteId] = useState(null);
      const [editTitle, setEditTitle] = useState('');
      const [editContent, setEditContent] = useState('');
      const [creating, setCreating] = useState(false);

      const activeNote = notes.find(n => n.id === activeNoteId);

      useEffect(() => {
        if (activeNote) {
          setEditTitle(activeNote.title);
          setEditContent(activeNote.content);
        }
      }, [activeNoteId]);

      const handleCreate = () => {
        setCreating(true);
        setActiveNoteId(null);
        setEditTitle('');
        setEditContent('');
      };

      const handleSaveNew = () => {
        if (editTitle.trim()) {
          onCreateNote(editTitle.trim(), editContent);
          setCreating(false);
        }
      };

      const handleSaveEdit = () => {
        if (activeNote && editTitle.trim()) {
          onUpdateNote(activeNote.id, { title: editTitle.trim(), content: editContent });
        }
      };

      const handleDelete = (id) => {
        if (confirm('Delete this note?')) {
          onDeleteNote(id);
          if (activeNoteId === id) setActiveNoteId(null);
        }
      };

      // List view (no active note, not creating)
      if (!activeNote && !creating) {
        return e('div', { className: 'notes-panel' },
          e('div', { className: 'sidebar-header' },
            e('span', null, 'Notes'),
            e('div', { className: 'sidebar-header-actions' },
              e('button', { className: 'sidebar-btn', onClick: handleCreate, title: 'New note' }, '+')
            )
          ),
          e('div', { className: 'notes-list' },
            notes.length === 0
              ? e('div', { style: { padding: 12, color: 'var(--text-muted)', fontSize: 12, textAlign: 'center' } }, 'No notes yet. Notes are injected into agent prompts.')
              : notes.map(note =>
                  e('div', { key: note.id, className: 'note-item', onClick: () => setActiveNoteId(note.id) },
                    e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                      e('div', { className: 'note-title' }, note.title),
                      e('button', { className: 'agent-delete-btn', style: { opacity: 1, fontSize: 11 }, onClick: (ev) => { ev.stopPropagation(); handleDelete(note.id); } }, '\u00D7')
                    ),
                    e('div', { className: 'note-preview' }, note.content || '(empty)')
                  )
                )
          )
        );
      }

      // Editor view
      return e('div', { className: 'notes-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, creating ? 'New Note' : 'Edit Note'),
          e('div', { className: 'sidebar-header-actions' },
            e('button', { className: 'sidebar-btn', onClick: () => { setActiveNoteId(null); setCreating(false); }, title: 'Back' }, '\u2190')
          )
        ),
        e('div', { className: 'note-editor' },
          e('input', { value: editTitle, onChange: (ev) => setEditTitle(ev.target.value), placeholder: 'Note title...', autoFocus: true }),
          e('textarea', { value: editContent, onChange: (ev) => setEditContent(ev.target.value), placeholder: 'Note content...' })
        ),
        e('div', { className: 'note-actions' },
          e('button', { className: 'btn btn-secondary btn-sm', onClick: () => { setActiveNoteId(null); setCreating(false); } }, 'Cancel'),
          e('div', { style: { flex: 1 } }),
          creating
            ? e('button', { className: 'btn btn-primary btn-sm', onClick: handleSaveNew, disabled: !editTitle.trim() }, 'Create')
            : e('button', { className: 'btn btn-primary btn-sm', onClick: handleSaveEdit, disabled: !editTitle.trim() }, 'Save')
        )
      );
    }

    // Kanban Panel — with per-project boards (Feature 6)

      const [newTitle, setNewTitle] = useState('');

        { key: 'backlog', label: 'Backlog' },
        { key: 'in_progress', label: 'In Progress' },
        { key: 'done', label: 'Done' },

      const columnOrder = { backlog: 'in_progress', in_progress: 'done' };
      const columnBack = { in_progress: 'backlog', done: 'in_progress' };

      const filteredItems = selectedBoard ? items.filter(i => i.boardId === selectedBoard) : items;

      const handleAdd = () => {
        if (newTitle.trim()) {
          onCreateItem(newTitle.trim(), '', 'backlog', selectedBoard || undefined);
          setNewTitle('');
        }
      };

      const handleNewBoard = () => {
        if (newBoardName.trim()) {
          onCreateBoard(newBoardName.trim());
          setNewBoardName('');
          setShowNewBoard(false);

      return e('div', { className: 'kanban-panel' },
        e('div', { className: 'sidebar-header' }, e('span', null, 'Kanban')),

          ),

                e('input', { value: newBoardName, onChange: (ev) => setNewBoardName(ev.target.value), onKeyDown: (ev) => { if (ev.key === 'Enter') handleNewBoard(); if (ev.key === 'Escape') setShowNewBoard(false); }, placeholder: 'Board name...', autoFocus: true, style: { fontSize: 11, padding: '2px 6px', width: 80, background: 'var(--bg-tertiary)', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text-primary)' } }),

              e('div', { className: 'kanban-col-header' },
                e('div', { className: 'kanban-col-title' },
                  col.label,
                  e('span', { className: 'kanban-col-count' }, colItems.length)

              ),
              colItems.map(item =>
                e('div', { key: item.id, className: 'kanban-card' },

                  item.description && e('div', { className: 'kanban-card-desc' }, item.description),
