    // Workspaces Sidebar
    // Sidebar bottom ports widget
    function SidebarPorts() {
      const [ports, setPorts] = useState([]);
      const [killing, setKilling] = useState(null);

      const loadPorts = useCallback(() => {
        fetch('/api/ports').then(r => r.json()).then(data => setPorts(data.ports || [])).catch(() => {});
      }, []);

      useEffect(() => {
        loadPorts();
        const id = setInterval(loadPorts, 10000);
        return () => clearInterval(id);
      }, [loadPorts]);

      const killPort = (pid) => {
        setKilling(pid);
        fetch('/api/ports/kill', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pid }) })
          .then(() => { setTimeout(loadPorts, 500); setKilling(null); })
          .catch(() => setKilling(null));
      };

      // Filter to only dev-relevant ports
      const devPorts = ports.filter(p => {
        const cmd = p.command.toLowerCase();
        // Known dev runtimes and tools
        if (['node', 'bun', 'deno', 'python', 'python3', 'ruby', 'java', 'go', 'cargo', 'php', 'nginx', 'docker', 'postgres', 'redis', 'mongod', 'mysqld'].some(r => cmd.includes(r))) return true;
        // Likely dev if on common dev ports
        if (p.port >= 3000 && p.port <= 9999) return true;
        return false;
      });

      if (devPorts.length === 0) return null;

      return e('div', { style: { marginTop: 'auto', borderTop: '1px solid var(--border)', flexShrink: 0 } },
        e('div', { style: { padding: '6px 12px', fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.5px' } }, 'Active Ports'),
        e('div', { style: { padding: '0 8px 6px' } },
          devPorts.map((p, i) =>
            e('div', { key: p.port + '-' + p.pid + '-' + i, style: { display: 'flex', alignItems: 'center', gap: 6, padding: '3px 4px', borderRadius: 4, fontSize: 11 } },
              e('span', { className: 'status-dot status-idle', style: { width: 6, height: 6 } }),
              e('span', { style: { fontWeight: 600, color: 'var(--accent)', minWidth: 36 } }, ':' + p.port),
              e('span', { style: { flex: 1, color: 'var(--text-secondary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, p.command),
              e('button', {
                style: { background: 'none', border: 'none', color: killing === p.pid ? 'var(--text-muted)' : 'var(--error)', cursor: 'pointer', padding: '0 2px', fontSize: 11, opacity: 0.7 },
                onClick: () => { if (confirm('Kill ' + p.command + ' on port ' + p.port + '?')) killPort(p.pid); },
                title: 'Kill process (PID ' + p.pid + ')',
              }, '\u00D7')
            )
          )
        )
      );
    }

      const [showNewModal, setShowNewModal] = useState(false);

      const startRename = (ws) => { setRenamingId(ws.id); setRenameValue(ws.name); };

        if (renamingId && renameValue.trim()) {

      return e(React.Fragment, null,
        e('div', { className: 'sidebar-header' },

                const wsAgents = agents.filter(a => a.workspaceId === ws.id && !a.hideFromGrid);

                return e(React.Fragment, { key: ws.id },
                  e('div', {

                    e('div', { style: { flex: 1, minWidth: 0 } },
                      renamingId === ws.id
                        ? e('input', {
                            className: 'workspace-name',

                            value: renameValue,
                            onChange: (ev) => setRenameValue(ev.target.value),
                            onKeyDown: (ev) => { if (ev.key === 'Enter') commitRename(); if (ev.key === 'Escape') setRenamingId(null); },
                            onBlur: commitRename,
                            onClick: (ev) => ev.stopPropagation(),

                    const allShots = atlasIsRunning ? (qaLiveShots && qaLiveShots[ws.id]) || [] : [];
                    // Filter shots since the agent's most recent run start (current 'working' streak)
                    const runStartedAt = atlasIsRunning ? statusStartTimes[atlasAgent.id] : 0;
                    const runShots = allShots.filter(s => !runStartedAt || s.timestamp >= runStartedAt);

                    const fmtElapsed = (ms) => {
                      if (ms < 60000) return Math.round(ms / 1000) + 's';

                          e('span', { className: 'workspace-atlas-label' }, '🗺️ Atlas: ' + runShots.length + ' shots · ' + fmtElapsed(elapsedMs)),

                        )
                      );
                    }
                    // State B vs A: idle with prior atlas vs no atlas yet
                    if (ws.atlasLastScanAt && atlasAgent) {
                      // State B — atlas exists, idle. Show freshness + Re-scan + View.
                      const ageMs = Date.now() - ws.atlasLastScanAt;
                      const ageBucket = ageMs < 24 * 60 * 60 * 1000 ? 'fresh'
                        : ageMs < 7 * 24 * 60 * 60 * 1000 ? 'aging'
                        : 'stale';
                      const fmtAgo = (ms) => {
                        if (ms < 60_000) return 'just now';
                        if (ms < 60 * 60_000) return Math.round(ms / 60_000) + 'm ago';
                        if (ms < 24 * 60 * 60_000) return Math.round(ms / (60 * 60_000)) + 'h ago';

                      };
                      return e('div', { className: 'workspace-atlas workspace-atlas-idle workspace-atlas-' + ageBucket, onClick: (ev) => ev.stopPropagation() },
                        e('div', { className: 'workspace-atlas-status' },
                          e('span', { className: 'workspace-atlas-label' },
                            '🗺️ Atlas · ',
                            e('span', { className: 'workspace-atlas-age' }, fmtAgo(ageMs)),
                            ageBucket === 'stale' && e('span', { className: 'workspace-atlas-stale-hint', title: 'Atlas is older than 7 days; re-scan recommended' }, ' · stale')
                          )
                        ),
                        e('div', { className: 'workspace-atlas-actions' },
                          e('button', {
                            className: 'workspace-atlas-action-btn',
                            disabled: !ws.testUrl,
                            onClick: (ev) => { ev.stopPropagation(); if (confirm('Re-scan the UI Atlas? The current atlas + screenshots will be archived to docs/ui-atlas/.history/<date>/, then a fresh scan will start.')) onRescanAtlas(ws.id); },
                            title: !ws.testUrl ? 'Set a Test URL first' : 'Archive current atlas and run a fresh scan',
                          }, 'Re-scan'),
                          e('button', {
                            className: 'workspace-atlas-action-btn',
                            onClick: (ev) => { ev.stopPropagation(); if (onOpenAtlasViewer) onOpenAtlasViewer(ws.id); },
                            title: 'Open the atlas viewer',
                          }, 'View')
                        )
                      );
                    }
                    // State A — no atlas yet
                    return e('div', { className: 'workspace-atlas', onClick: (ev) => ev.stopPropagation() },
                      e('button', {
                        className: 'workspace-atlas-btn',
                        disabled: !ws.testUrl,
                        title: !ws.testUrl
                          ? 'Set a Test URL first — the Atlas Agent walks the live app at that URL'
                          : 'Build the UI Atlas for this workspace. You will be prompted for the project repo path.',
                        onClick: () => {
                          if (!ws.testUrl) return;
                          const firstAgent = wsAgents[0];
                          const defaultCwd = ws.atlasProjectCwd || (firstAgent ? firstAgent.cwd : '');
                          const cwd = window.prompt(
                            'Path to the project repo for the Atlas Agent to read code from:\n\n(The agent will read source files in this directory and write the atlas to docs/ui-atlas/atlas.md inside it. The atlas will start building automatically once you confirm.)',
                            defaultCwd
                          );
                          if (cwd && cwd.trim()) onProvisionAtlas(ws.id, cwd.trim());
                        },
                      }, '🗺️ Build UI Atlas')
                    );
                  })(),
                  isActive && wsAgents.length > 0 && e('div', { className: 'workspace-agents' },
                    wsAgents.map(agent =>
                      e('div', { key: agent.id, className: 'workspace-agent-chip' },
                        e('span', { className: 'status-dot status-' + agent.status }),
                        e('span', { style: { flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, agent.name),
                        e('span', { style: { fontSize: 10, color: 'var(--text-muted)', flexShrink: 0 } }, e(AgentStatusText, { agent, statusStartTimes })),
                        onEditAgent && e('button', {
                          className: 'agent-edit-btn',
                          style: { opacity: 0.7 },
                          onClick: (ev) => { ev.stopPropagation(); onEditAgent(agent); },
                          title: 'Edit agent'
                        }, '\u270E'),
                        e('button', {
                          className: 'agent-delete-btn',
                          style: { opacity: 0.7 },
                          onClick: (ev) => { ev.stopPropagation(); if (confirm('Delete agent "' + agent.name + '"?')) onRemoveAgent(agent.id); },
                          title: 'Delete agent'
                        }, '\u00D7')
                      )
                    )
                  )
                );
              })
        ),
        e('div', { style: { padding: '8px' } },
          e('button', { className: 'btn btn-primary', style: { width: '100%' }, onClick: () => setShowNewModal(true) }, '+ New Workspace')
        ),
        e('div', { className: 'shortcuts-hint' },
          e('span', null, e(React.Fragment, null, e('kbd', null, 'Ctrl+N'), ' new agent ', e('kbd', null, 'Esc'), ' stop turn'))
        ),
        showNewModal && e(NewWorkspaceModal, { isOpen: true, onClose: () => setShowNewModal(false), onCreate: onCreateWorkspace })
      );
    }

    // New Workspace Modal
    function NewWorkspaceModal({ isOpen, onClose, onCreate }) {
      const [name, setName] = useState('');

    // Notes Panel
    // Slug-ify heading text the same way Github / common-mark anchor schemes do —
    // lowercase, alphanumerics + dashes only. Used to wire TOC links to anchors.
    function atlasSlug(text) {
      return String(text || '').toLowerCase().trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // Parse atlas.md text for the coverage header + TOC. Pulls YAML frontmatter
    // counts (total_surfaces, total_entities, last_full_scan), counts "Last
    // verified" entries by freshness bucket, and extracts h2/h3 headings.
    function parseAtlasOverview(text) {
      const out = {
        totalSurfaces: null, totalEntities: null, lastFullScan: null,
        verifiedToday: 0, verified7d: 0, verifiedOlder: 0, verifiedUnknown: 0,
        headings: [],
      };
      if (!text) return out;
      const fmMatch = text.match(/^---\n([\s\S]*?)\n---/);
      if (fmMatch) {
        const fm = fmMatch[1];
        const ts = fm.match(/^total_surfaces:\s*(\d+)/m); if (ts) out.totalSurfaces = parseInt(ts[1], 10);
        const te = fm.match(/^total_entities:\s*(\d+)/m); if (te) out.totalEntities = parseInt(te[1], 10);
        const ls = fm.match(/^last_full_scan:\s*(\S+)/m); if (ls) out.lastFullScan = ls[1];
      }
      const now = Date.now();
      const oneDay = 24 * 60 * 60 * 1000;
      const verifyRe = /^[ \t-]*Last verified:\s*([^\n]+)$/gim;
      let vm;
      while ((vm = verifyRe.exec(text))) {
        const raw = (vm[1] || '').trim();
        if (!raw || raw === '?') { out.verifiedUnknown++; continue; }
        const dateMatch = raw.match(/(\d{4}-\d{2}-\d{2})/);
        if (!dateMatch) { out.verifiedUnknown++; continue; }
        const ageMs = now - new Date(dateMatch[1] + 'T00:00:00').getTime();
        if (ageMs < oneDay * 1.5) out.verifiedToday++;
        else if (ageMs < 7 * oneDay) out.verified7d++;
        else out.verifiedOlder++;
      }
      // Skip headings inside frontmatter and code fences.
      const body = fmMatch ? text.slice(fmMatch[0].length) : text;
      const lines = body.split('\n');
      let inFence = false;
      const seen = new Map();
      for (const line of lines) {
        if (/^```/.test(line)) { inFence = !inFence; continue; }
        if (inFence) continue;
        const m = line.match(/^(##|###)\s+(.+?)\s*$/);
        if (!m) continue;
        const level = m[1].length;
        const headingText = m[2].replace(/`/g, '').replace(/^\d+\.\s*/, '');
        let slug = atlasSlug(headingText);
        if (!slug) continue;
        const n = (seen.get(slug) || 0) + 1;
        seen.set(slug, n);
        if (n > 1) slug = slug + '-' + n;
        out.headings.push({ level, text: headingText, slug });
      }
      return out;
    }

    function AtlasPanel({ activeWorkspace, agents, messages, statusStartTimes, qaLiveShots, onRescanAtlas, onProvisionAtlas }) {
      const [content, setContent] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [query, setQuery] = useState('');
      const [tocOpen, setTocOpen] = useState(true);
      const bodyRef = useRef(null);

      const wsId = activeWorkspace?.id;
      const wsHasAtlas = !!(activeWorkspace?.atlasLastScanAt && activeWorkspace?.atlasProjectCwd);
      const atlasAgent = activeWorkspace?.atlasAgentId
        ? agents.find(a => a.id === activeWorkspace.atlasAgentId)
        : null;
      const atlasIsRunning = atlasAgent && (atlasAgent.status === 'working' || atlasAgent.status === 'thinking');

      // Fetch atlas.md whenever the workspace changes or a scan completes.
      useEffect(() => {
        if (!wsId || !wsHasAtlas) { setContent(''); setError(null); return; }
        let cancelled = false;
        setLoading(true);
        setError(null);
        fetch('/api/atlas/file?workspaceId=' + encodeURIComponent(wsId) + '&relPath=atlas.md')
          .then(r => { if (!r.ok) throw new Error('Failed to load atlas.md (' + r.status + ')'); return r.text(); })
          .then(text => { if (!cancelled) setContent(text); })
          .catch(e => { if (!cancelled) setError(e.message || String(e)); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [wsId, activeWorkspace?.atlasLastScanAt]);

      // Rewrite `shots/foo.png` (in inline-code) to ![shots/foo.png](URL) so markdown
      // renders them as images via the /api/atlas/file endpoint.
      const rewritten = useMemo(() => {
        if (!content || !wsId) return content;
        return content.replace(/`(shots\/[^`]+\.png)`/g, (_, p) => {
          const url = '/api/atlas/file?workspaceId=' + encodeURIComponent(wsId) + '&relPath=' + encodeURIComponent(p);
          return '![' + p + '](' + url + ')';
        });
      }, [content, wsId]);

      const overview = useMemo(() => parseAtlasOverview(rewritten), [rewritten]);

      // Inject HTML anchor tags before each ##/### heading so TOC links land
      // precisely. We do this on the markdown text (not the parsed HTML)
      // because marked passes inline HTML through unchanged.
      const anchored = useMemo(() => {
        if (!rewritten) return rewritten;
        const slugCount = new Map();
        const lines = rewritten.split('\n');
        let inFence = false;
        const out = [];
        for (const line of lines) {
          if (/^```/.test(line)) { inFence = !inFence; out.push(line); continue; }
          if (!inFence) {
            const m = line.match(/^(##|###)\s+(.+?)\s*$/);
            if (m) {
              const headingText = m[2].replace(/`/g, '').replace(/^\d+\.\s*/, '');
              let slug = atlasSlug(headingText);
              if (slug) {
                const n = (slugCount.get(slug) || 0) + 1;
                slugCount.set(slug, n);
                if (n > 1) slug = slug + '-' + n;
                out.push('<a id="' + slug + '" class="atlas-anchor"></a>');
              }
            }
          }
          out.push(line);
        }
        return out.join('\n');
      }, [rewritten]);

      const filtered = useMemo(() => {
        if (!query.trim()) return anchored;
        // Simple filter: keep only sections (h2/h3 + body) that contain the query.
        const q = query.toLowerCase();
        const sections = anchored.split(/\n(?=##? )/);
        return sections.filter(s => s.toLowerCase().includes(q)).join('\n\n');
      }, [anchored, query]);

      const scrollToSlug = useCallback((slug) => {
        const root = bodyRef.current;
        if (!root) return;
        const el = root.querySelector('#' + CSS.escape(slug));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, []);

      const fmtAgo = (ms) => {
        if (ms < 60_000) return 'just now';
        if (ms < 60 * 60_000) return Math.round(ms / 60_000) + 'm ago';
        if (ms < 24 * 60 * 60_000) return Math.round(ms / (60 * 60_000)) + 'h ago';
        return Math.round(ms / (24 * 60 * 60_000)) + 'd ago';
      };

      if (!activeWorkspace) {
        return e('div', { className: 'atlas-panel' },
          e('div', { className: 'atlas-empty' }, 'No active workspace.')
        );
      }

      if (atlasIsRunning) {
        const liveCount = (qaLiveShots && qaLiveShots[wsId]) ? qaLiveShots[wsId].length : 0;
        const runStartedAt = statusStartTimes[atlasAgent.id];
        const elapsedMs = runStartedAt ? Date.now() - runStartedAt : 0;
        // Show the agent's recent activity so the user can see what it's doing
        // even though the agent is hidden from the grid/chip list.
        const atlasMsgs = (messages && messages[atlasAgent.id]) || [];
        const recentMsgs = atlasMsgs.slice(-8); // last few turns
        return e('div', { className: 'atlas-panel' },
          e('div', { className: 'atlas-header' },
            e('div', { className: 'atlas-title' }, '🗺️ UI Atlas'),
            e('div', { className: 'atlas-status atlas-status-running' },
              'Scanning... ' + liveCount + ' shots · ' + Math.floor(elapsedMs / 60000) + 'm elapsed'
            )
          ),
          e('div', { className: 'atlas-running-body' },
            e('div', { className: 'atlas-running-explainer' },
              'The agent is working through its passes (project structure → code reading → browser walkthrough → state construction → reconciliation → self-verification → write atlas). The first ~10 minutes are typically code reading with no browser activity. Screenshots accumulate during the walkthrough phase.'
            ),
            recentMsgs.length > 0 && e('div', { className: 'atlas-activity-feed' },
              e('div', { className: 'atlas-activity-heading' }, 'Recent activity'),
              recentMsgs.map((m, i) => {
                // Strip [Using tool: Bash] noise + truncate.
                const text = (m.content || '').replace(/\n?\[Using tool: [^\]]+\]\n?/g, '').trim();
                const preview = text.length > 280 ? text.slice(0, 280) + '...' : text;
                return e('div', { key: m.id || i, className: 'atlas-activity-msg atlas-activity-' + m.role },
                  e('div', { className: 'atlas-activity-role' }, m.role === 'user' ? '→ Trigger' : 'Atlas'),
                  e('div', { className: 'atlas-activity-text' }, preview || '(no text content)')
                );
              })
            )
          )
        );
      }

      if (!wsHasAtlas) {
        return e('div', { className: 'atlas-panel' },
          e('div', { className: 'atlas-header' },
            e('div', { className: 'atlas-title' }, '🗺️ UI Atlas'),
            e('div', { className: 'atlas-status' }, 'Not built yet')
          ),
          e('div', { className: 'atlas-empty' },
            e('div', null, 'No UI Atlas exists for this workspace.'),
            e('div', { style: { marginTop: 8, fontSize: 11, color: 'var(--text-muted)' } },
              activeWorkspace.testUrl
                ? 'Use the "Build UI Atlas" button on the workspace tab to start.'
                : 'Set a Test URL on this workspace first, then build an atlas.'
            )
          )
        );
      }

      const ageMs = Date.now() - (activeWorkspace.atlasLastScanAt || 0);
      const ageBucket = ageMs < 24 * 60 * 60_000 ? 'fresh'
        : ageMs < 7 * 24 * 60 * 60_000 ? 'aging'
        : 'stale';

      const totalVerified = overview.verifiedToday + overview.verified7d + overview.verifiedOlder;
      const totalCounted = totalVerified + overview.verifiedUnknown;
      const qaTouchedCount = activeWorkspace.qaSurfaceVerifications
        ? Object.keys(activeWorkspace.qaSurfaceVerifications).length
        : 0;

      const coverageBits = [];
      if (overview.totalSurfaces != null) coverageBits.push(overview.totalSurfaces + ' surfaces');
      if (overview.totalEntities != null) coverageBits.push(overview.totalEntities + ' entities');
      if (totalCounted > 0) {
        coverageBits.push(totalVerified + '/' + totalCounted + ' verified');
      }
      if (qaTouchedCount > 0) coverageBits.push(qaTouchedCount + ' QA-touched');

      // Limit TOC to top-level sections (h2). h3 entries (per-entity, per-surface)
      // would balloon the list — search handles that case.
      const tocItems = overview.headings.filter(h => h.level === 2);

      return e('div', { className: 'atlas-panel' },
        e('div', { className: 'atlas-header' },
          e('div', { className: 'atlas-title' }, '🗺️ UI Atlas — ' + activeWorkspace.name),
          e('div', { className: 'atlas-status atlas-status-' + ageBucket },
            'Last scan ' + fmtAgo(ageMs) + (ageBucket === 'stale' ? ' · stale' : '')
          ),
          e('button', {
            className: 'atlas-rescan-btn',
            onClick: () => { if (confirm('Re-scan the UI Atlas? Current atlas + screenshots are archived to docs/ui-atlas/.history/<date>/, then a fresh scan starts.')) onRescanAtlas(wsId); },
            title: 'Archive current atlas and run a fresh scan',
          }, 'Re-scan')
        ),
        coverageBits.length > 0 && e('div', { className: 'atlas-coverage-strip' },
          coverageBits.map((b, i) => e('span', { key: i, className: 'atlas-coverage-pill' }, b))
        ),
        e('div', { className: 'atlas-search-row' },
          e('input', {
            type: 'text',
            className: 'atlas-search',
            placeholder: 'Search atlas (e.g. "fleet", "modal", "console")...',
            value: query,
            onChange: (ev) => setQuery(ev.target.value),
          }),
          query && e('button', { className: 'atlas-search-clear', onClick: () => setQuery('') }, '×')
        ),
        tocItems.length > 0 && !query && e('div', { className: 'atlas-toc' + (tocOpen ? '' : ' collapsed') },
          e('div', { className: 'atlas-toc-header', onClick: () => setTocOpen(o => !o) },
            e('span', { className: 'atlas-toc-chevron' }, tocOpen ? '▾' : '▸'),
            e('span', null, 'Contents (' + tocItems.length + ')')
          ),
          tocOpen && e('div', { className: 'atlas-toc-list' },
            tocItems.map(h => e('button', {
              key: h.slug,
              className: 'atlas-toc-link',
              onClick: () => scrollToSlug(h.slug),
              title: h.text,
            }, h.text))
          )
        ),
        loading && e('div', { className: 'atlas-empty' }, 'Loading atlas.md...'),
        error && e('div', { className: 'atlas-empty atlas-error' }, 'Error: ' + error),
        !loading && !error && rewritten && e('div', { className: 'atlas-body', ref: bodyRef },
          e(MarkdownContent, { content: filtered || anchored })
        )
      );
    }

    // Slash Commands Panel — list of pre-made prompts. Click to copy.
    function CommandsPanel({ commands }) {
      const [query, setQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [copiedId, setCopiedId] = useState(null);

      const categories = useMemo(() => {
        const set = new Set(commands.map(c => c.category || 'other'));
        return ['all', ...Array.from(set).sort()];
      }, [commands]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return commands.filter(c => {
          if (activeCategory !== 'all' && (c.category || 'other') !== activeCategory) return false;
          if (!q) return true;
          return (
            c.command.toLowerCase().includes(q) ||
            c.name.toLowerCase().includes(q) ||
            (c.description || '').toLowerCase().includes(q)
          );
        });
      }, [commands, query, activeCategory]);

      const copyToClipboard = (cmd) => {
        const text = expandSlashTemplate(cmd.promptTemplate);
        const showCopied = () => {
          setCopiedId(cmd._id);
          setTimeout(() => setCopiedId(prev => prev === cmd._id ? null : prev), 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            try {
              const ta = document.createElement('textarea');
              ta.value = text;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              showCopied();
            } catch (err) {
              console.error('Copy failed:', err);
            }
          });
        }
      };

      return e('div', { className: 'commands-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Slash Commands'),
          e('span', { className: 'commands-count' }, filtered.length + '/' + commands.length)
        ),
        e('div', { className: 'commands-search-row' },
          e('input', {
            className: 'commands-search',
            value: query,
            onChange: (ev) => setQuery(ev.target.value),
            placeholder: 'Search commands...',
          })
        ),
        e('div', { className: 'commands-categories' },
          categories.map(cat =>
            e('button', {
              key: cat,
              className: 'commands-cat-chip' + (activeCategory === cat ? ' active' : ''),

          )

                  key: cmd._id,

                  onClick: () => copyToClipboard(cmd),
                  title: 'Click to copy the prompt',
                },
                  e('div', { className: 'command-item-row' },

                    e('span', { className: 'command-name' }, cmd.name),

    // Emulators Panel — with default simulator setting (Feature 9)
    function EmulatorsPanel({ settings, onUpdateSettings }) {
      const [devices, setDevices] = useState({});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [actionMsg, setActionMsg] = useState(null);

      const loadDevices = useCallback(() => {
        setLoading(true);
        setError(null);
        fetch('/api/simulators').then(r => r.json()).then(data => {
          if (data.error) {
            setError(data.error);
            setDevices({});
          } else {
            setDevices(data.devices || {});
          }
          setLoading(false);
        }).catch(err => {
          setError('Failed to fetch simulators');
          setLoading(false);
        });
      }, []);

      useEffect(() => { loadDevices(); }, [loadDevices]);

      const simAction = (endpoint, udid) => {
        setActionMsg('Working...');
        fetch('/api/simulators/' + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ udid })
        }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? 'Done' : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 2000);
          loadDevices();
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      const cleanDerived = () => {
        if (!confirm('Delete all Xcode Derived Data? This is safe but builds will need to recompile.')) return;
        setActionMsg('Cleaning...');
        fetch('/api/simulators/clean-derived-data', { method: 'POST' }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? 'Cleaned!' : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 3000);
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      // Group and filter out empty runtimes
      const runtimes = Object.entries(devices)
        .filter(([_, devs]) => devs.length > 0)
        .sort(([a], [b]) => a.localeCompare(b));

      return e('div', { className: 'emu-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Emulators'),
          e('div', { className: 'sidebar-header-actions' },
            e('button', { className: 'sidebar-btn', onClick: loadDevices, title: 'Refresh' }, '\u21BB')
          )
        ),
        e('div', { className: 'emu-toolbar' },
          e('button', { className: 'btn btn-danger btn-sm', onClick: cleanDerived }, 'Clean Derived Data'),
          actionMsg && e('span', { style: { fontSize: 11, color: 'var(--text-secondary)' } }, actionMsg)
        ),
        e('div', { className: 'emu-list' },
          loading && e('div', { className: 'emu-msg' }, 'Loading simulators...'),
          error && e('div', { className: 'emu-msg' }, error),
          !loading && !error && runtimes.length === 0 && e('div', { className: 'emu-msg' }, 'No simulators found. Is Xcode installed?'),
          runtimes.map(([runtime, devs]) =>
            e('div', { key: runtime, className: 'emu-runtime' },
              e('div', { className: 'emu-runtime-header' }, runtime.replace('com.apple.CoreSimulator.SimRuntime.', '').replace(/-/g, ' ')),
              devs.map(dev =>
                e('div', { key: dev.udid, className: 'emu-device' },
                  e('button', { className: 'emu-default-btn' + (settings?.defaultSimulatorUdid === dev.udid ? ' is-default' : ''), onClick: () => onUpdateSettings({ defaultSimulatorUdid: dev.udid, defaultSimulatorName: dev.name }), title: settings?.defaultSimulatorUdid === dev.udid ? 'Current default' : 'Set as default' }, settings?.defaultSimulatorUdid === dev.udid ? '\u2605' : '\u2606'),
                  e('span', { className: 'emu-device-name' }, dev.name),
                  e('span', { className: 'emu-device-state ' + (dev.state === 'Booted' ? 'emu-state-booted' : 'emu-state-shutdown') }, dev.state),
                  e('div', { className: 'emu-device-actions' },
                    dev.state !== 'Booted'
                      ? e('button', { className: 'btn btn-sm btn-secondary', onClick: () => simAction('boot', dev.udid) }, 'Boot')
                      : e('button', { className: 'btn btn-sm btn-secondary', onClick: () => simAction('shutdown', dev.udid) }, 'Stop'),
                    e('button', { className: 'btn btn-sm btn-secondary', onClick: () => { if (confirm('Erase all data on ' + dev.name + '?')) simAction('erase', dev.udid); } }, 'Erase')
                  )
                )
              )
            )
          )
        )
      );
    }

    // Plans Panel (Feature 1)
    // Token usage panel — dense cross-provider usage dashboard. The server
    // (usage.service) computes the full report (time windows × agent/model
    // breakdowns × daily rows); the client only filters and renders.
    // Tokens-only by design (cost numbers are unreliable since only Claude
    // reports them). Series colors live in --chart-claude/--chart-codex and
    // were validated for CVD separation + contrast on the dark surface.
    const TOKEN_WINDOWS = [
      { key: 'today',   label: 'Today' },
      { key: 'days7',   label: '7d' },
      { key: 'days30',  label: '30d' },
      { key: 'month',   label: 'Month' },
      { key: 'allTime', label: 'All' },
    ];
    const TOKEN_VIEWS = [
      { key: 'overview', label: 'Overview' },
      { key: 'agents',   label: 'Agents' },
      { key: 'models',   label: 'Models' },
      { key: 'daily',    label: 'Daily' },
    ];
    const PROVIDER_META = {
      claude: { name: 'Claude', icon: '✦', color: 'var(--chart-claude)' },
      codex:  { name: 'Codex',  icon: '⚙', color: 'var(--chart-codex)' },
    };

    function tokensRelTime(ts) {
      if (!ts) return 'never';
      const m = Math.round((Date.now() - ts) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.round(h / 24) + 'd ago';
    }

    function TokensPanel({ report }) {
      const [windowKey, setWindowKey] = useState('today');
      const [view, setView] = useState('overview');

      if (!report || !report.windows) {
        return e('div', { className: 'tokens-panel' },
          e('div', { className: 'tokens-header' }, e('span', null, 'Token usage')),
          e('div', { className: 'tokens-empty' }, 'No usage data yet. Send a turn and this panel will populate.')
        );
      }

      const win = report.windows[windowKey] || report.windows.today;
      const sum = win.summary;
      const stats = win.stats;
      const fmt = (n) => formatTokens(n || 0);
      const bucketTotal = (b) => (b.inputTokens || 0) + (b.outputTokens || 0);
      const exportUsage = (format) => {
        const a = document.createElement('a');
        a.href = '/api/usage/export?format=' + format;
        a.download = '';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      // --- shared sub-renders ---

      const statTile = (value, label, title) =>
        e('div', { className: 'tokens-stat', key: label, title: title || undefined },
          e('div', { className: 'tokens-stat-value' }, value),
          e('div', { className: 'tokens-stat-label' }, label)
        );

      const shareSection = () => {
        const cTok = bucketTotal(sum.claude);
        const xTok = bucketTotal(sum.codex);
        const total = cTok + xTok;
        const legendRow = (kind, tok, turns) => {
          const meta = PROVIDER_META[kind];
          return e('div', { className: 'tokens-legend-row', key: kind },
            e('span', { className: 'tokens-swatch', style: { background: meta.color } }),
            e('span', { className: 'tokens-legend-name' }, meta.icon + ' ' + meta.name),
            e('span', { className: 'tokens-legend-val' }, tok > 0 ? fmt(tok) + ' · ' + turns + ' turns' : '—'),
            total > 0 && tok > 0 && e('span', { className: 'tokens-legend-pct' }, Math.round((tok / total) * 100) + '%')
          );
        };
        return e('div', null,
          e('div', { className: 'tokens-section-title' }, 'Provider share'),
          total > 0
            ? e('div', { className: 'tokens-share-bar', title: 'Claude ' + fmt(cTok) + ' · Codex ' + fmt(xTok) },
                cTok > 0 && e('div', { className: 'tokens-share-seg', style: { width: (cTok / total) * 100 + '%', background: PROVIDER_META.claude.color } }),
                xTok > 0 && e('div', { className: 'tokens-share-seg', style: { width: (xTok / total) * 100 + '%', background: PROVIDER_META.codex.color } })
              )
            : e('div', { className: 'tokens-empty' }, 'No turns in this window.'),
          legendRow('claude', cTok, sum.claude.turns),
          legendRow('codex', xTok, sum.codex.turns)
        );
      };

      const breakdownTable = (rows, nameHeader) => rows.length === 0
        ? e('div', { className: 'tokens-empty' }, 'Nothing in this window.')
        : e('table', { className: 'tokens-table' },
            e('thead', null, e('tr', null,
              e('th', null, nameHeader),
              e('th', { className: 'num' }, 'Tokens'),
              e('th', { className: 'num' }, 'Turns'),
              e('th', { className: 'num mut' }, 'Last')
            )),
            e('tbody', null, rows.map(r => {
              const cTok = bucketTotal(r.claude);
              const xTok = bucketTotal(r.codex);
              const total = cTok + xTok;
              return e('tr', { key: r.key, title: 'Claude ' + fmt(cTok) + ' in+out · Codex ' + fmt(xTok) + ' in+out' },
                e('td', null,
                  e('div', { className: 'tokens-row-label' }, e('span', { className: 'name' }, r.label)),
                  total > 0 && e('div', { className: 'tokens-mini-share' },
                    cTok > 0 && e('div', { style: { width: (cTok / total) * 100 + '%', background: PROVIDER_META.claude.color } }),
                    xTok > 0 && e('div', { style: { width: (xTok / total) * 100 + '%', background: PROVIDER_META.codex.color } })
                  )
                ),
                e('td', { className: 'num' }, fmt(total)),
                e('td', { className: 'num' }, r.total.turns),
                e('td', { className: 'num mut' }, tokensRelTime(r.lastTimestamp))
              );
            }))
          );

      const dailyView = () => {
        const days = report.daily || [];
        const chartDays = days.slice(-14);
        const maxTok = Math.max(1, ...chartDays.map(d => bucketTotal(d.total)));
        const maxIdx = chartDays.reduce((best, d, i) => bucketTotal(d.total) > bucketTotal(chartDays[best].total) ? i : best, 0);
        const dayLabel = (date) => date.slice(5).replace('-', '/');
        return e('div', null,
          e('div', { className: 'tokens-section-title' }, 'Last 14 days'),
          e('div', { className: 'tokens-chart' },
            chartDays.map((d, i) => {
              const cTok = bucketTotal(d.claude);
              const xTok = bucketTotal(d.total) - cTok;
              const tot = cTok + xTok;
              return e('div', {
                key: d.date,
                className: 'tokens-chart-col',
                title: dayLabel(d.date) + ': ' + fmt(tot) + ' total · Claude ' + fmt(cTok) + ' · Codex ' + fmt(xTok) + ' · ' + d.total.turns + ' turns',
              },
                tot > 0 && i === maxIdx && e('span', { className: 'tokens-chart-maxlabel' }, fmt(tot)),
                xTok > 0 && e('div', { className: 'tokens-chart-seg', style: { height: (xTok / maxTok) * 100 + '%', background: PROVIDER_META.codex.color } }),
                cTok > 0 && e('div', { className: 'tokens-chart-seg', style: { height: (cTok / maxTok) * 100 + '%', background: PROVIDER_META.claude.color } })
              );
            })
          ),
          e('div', { className: 'tokens-chart-axis' },
            e('span', null, chartDays.length ? dayLabel(chartDays[0].date) : ''),
            e('span', null, chartDays.length ? dayLabel(chartDays[chartDays.length - 1].date) : '')
          ),
          e('div', { className: 'tokens-legend-row' },
            e('span', { className: 'tokens-swatch', style: { background: PROVIDER_META.claude.color } }),
            e('span', { className: 'tokens-legend-name' }, '✦ Claude'),
            e('span', { className: 'tokens-swatch', style: { background: PROVIDER_META.codex.color } }),
            e('span', { className: 'tokens-legend-name' }, '⚙ Codex')
          ),
          e('div', { className: 'tokens-section-title', style: { marginTop: 8 } }, 'Daily table (30d)'),
          e('table', { className: 'tokens-table' },
            e('thead', null, e('tr', null,
              e('th', null, 'Date'),
              e('th', { className: 'num' }, 'Tokens'),
              e('th', { className: 'num' }, 'In'),
              e('th', { className: 'num' }, 'Out'),
              e('th', { className: 'num' }, 'Turns')
            )),
            e('tbody', null, days.slice().reverse().filter(d => d.total.turns > 0 || bucketTotal(d.total) > 0).map(d =>
              e('tr', { key: d.date },
                e('td', { className: 'mut' }, dayLabel(d.date)),
                e('td', { className: 'num' }, fmt(bucketTotal(d.total))),
                e('td', { className: 'num' }, fmt(d.total.inputTokens)),
                e('td', { className: 'num' }, fmt(d.total.outputTokens)),
                e('td', { className: 'num' }, d.total.turns)
              )
            ))
          )
        );
      };

      const overview = () => e('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
        e('div', { className: 'tokens-hero' },
          e('div', { className: 'tokens-hero-value' }, fmt(stats.totalTokens)),
          e('div', { className: 'tokens-hero-label' }, 'total tokens · ' + stats.turns + ' turns · ' + (TOKEN_WINDOWS.find(w => w.key === windowKey) || {}).label)
        ),
        e('div', { className: 'tokens-stat-grid' },
          statTile(fmt(sum.total.inputTokens), 'input'),
          statTile(fmt(sum.total.outputTokens), 'output'),
          statTile(fmt(stats.avgInputPerTurn), 'avg in / turn'),
          statTile(fmt(stats.avgOutputPerTurn), 'avg out / turn'),
          statTile(stats.outputInputRatio === null ? '—' : stats.outputInputRatio.toFixed(2), 'out : in ratio'),
          statTile(
            stats.biggestTurn ? fmt(stats.biggestTurn.tokens) : '—',
            'biggest turn',
            stats.biggestTurn ? stats.biggestTurn.agentName + ' · ' + (stats.biggestTurn.model || stats.biggestTurn.provider) + ' · ' + tokensRelTime(stats.biggestTurn.timestamp) : undefined
          )
        ),
        shareSection(),
        (report.recentTurns || []).length > 0 && e('div', null,
          e('div', { className: 'tokens-section-title' }, 'Recent turns'),
          e('div', { className: 'tokens-recent' },
            report.recentTurns.map((t, i) =>
              e('div', { key: t.timestamp + '-' + i, className: 'tokens-recent-row', title: (t.model || t.provider) + ' · ' + fmt(t.inputTokens) + ' in / ' + fmt(t.outputTokens) + ' out' },
                e('span', { className: 'tokens-swatch', style: { background: (PROVIDER_META[t.provider] || PROVIDER_META.claude).color } }),
                e('span', { className: 'tokens-recent-agent' }, t.agentName),
                e('span', { className: 'tokens-recent-tokens' }, fmt(t.inputTokens + t.outputTokens)),
                e('span', { className: 'tokens-recent-time' }, tokensRelTime(t.timestamp))
              )
            )
          )
        )
      );

      return e('div', { className: 'tokens-panel' },
        e('div', { className: 'tokens-header' },
          e('span', null, 'Token usage'),
          e('div', { className: 'tokens-export' },
            e('button', { onClick: () => exportUsage('csv'), title: 'Download the full usage log as CSV' }, 'CSV'),
            e('button', { onClick: () => exportUsage('json'), title: 'Download the full usage log as JSON' }, 'JSON')
          )
        ),
        e('div', { className: 'tokens-chips' },
          TOKEN_WINDOWS.map(w =>
            e('button', { key: w.key, className: 'tokens-chip' + (windowKey === w.key ? ' active' : ''), onClick: () => setWindowKey(w.key) }, w.label)
          )
        ),
        e('div', { className: 'tokens-tabs' },
          TOKEN_VIEWS.map(v =>
            e('button', { key: v.key, className: 'tokens-tab' + (view === v.key ? ' active' : ''), onClick: () => setView(v.key) }, v.label)
          )
        ),
        view === 'overview' && overview(),
        view === 'agents' && breakdownTable(win.byAgent, 'Agent'),
        view === 'models' && breakdownTable(win.byModel, 'Model'),
        view === 'daily' && dailyView()
      );
    }

    // Limits panel — provider rate-limit dashboard. Data sources (server-side
    // limits.service): Claude via the statusline JSON bridge file, Codex via
    // the newest rollout-file rate_limits event. Auto-refreshes every 30 min;
    // the button forces a re-read. Meter color is a status encoding
    // (ok/warning/critical) and is always paired with the numeric %.
    function limitsFmtReset(ts) {
      if (!ts) return null;
      const ms = ts - Date.now();
      if (ms <= 0) return 'resets soon';
      const m = Math.round(ms / 60000);
      if (m < 60) return 'resets in ' + m + 'm';
      const h = Math.floor(m / 60);
      if (h < 48) return 'resets in ' + h + 'h ' + (m % 60) + 'm';
      return 'resets in ' + Math.round(h / 24) + 'd';
    }

    function limitsRelTime(ts) {
      if (!ts) return 'unknown';
      const m = Math.round((Date.now() - ts) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.round(h / 24) + 'd ago';
    }

    function LimitsMeter({ label, window }) {
      const pct = window && typeof window.usedPercent === 'number' ? window.usedPercent : null;
      const level = pct === null ? null : pct >= 85 ? 'crit' : pct >= 60 ? 'warn' : 'ok';
      const reset = window ? limitsFmtReset(window.resetsAt) : null;
      return e('div', { className: 'limits-meter' },
        e('div', { className: 'limits-meter-head' },
          e('span', { className: 'limits-meter-label' }, label),
          e('span', { className: 'limits-meter-pct' }, pct === null ? '—' : Math.round(pct) + '% used')
        ),
        e('div', { className: 'limits-meter-track' },
          pct !== null && e('div', { className: 'limits-meter-fill limits-' + level, style: { width: Math.max(2, Math.min(100, pct)) + '%' } })
        ),
        reset && e('div', { className: 'limits-meter-reset' }, reset)
      );
    }

    function LimitsProviderCard({ snap, icon, title }) {
      const [showRaw, setShowRaw] = useState(false);
      if (!snap) {
        return e('div', { className: 'limits-card' },
          e('div', { className: 'limits-card-head' }, e('span', { className: 'limits-card-title' }, icon + ' ' + title)),
          e('div', { className: 'limits-detail' }, 'Waiting for first read...')
        );
      }
      const statusMeta = {
        available:   { label: 'LIVE',        cls: 'limits-status-ok' },
        stale:       { label: 'STALE',       cls: 'limits-status-warn' },
        unavailable: { label: 'UNAVAILABLE', cls: 'limits-status-mut' },
        error:       { label: 'ERROR',       cls: 'limits-status-err' },
      }[snap.status] || { label: snap.status.toUpperCase(), cls: 'limits-status-mut' };
      const hasData = snap.status === 'available' || snap.status === 'stale';
      return e('div', { className: 'limits-card' },
        e('div', { className: 'limits-card-head' },
          e('span', { className: 'limits-card-title' }, icon + ' ' + title),
          e('span', { className: 'limits-status ' + statusMeta.cls }, statusMeta.label)
        ),
        hasData && e('div', { className: 'limits-meta' },
          snap.model && e('span', null, snap.model),
          snap.planType && e('span', null, 'plan: ' + snap.planType),
          e('span', null, 'data ' + limitsRelTime(snap.updatedAt))
        ),
        hasData && e(LimitsMeter, { label: '5-hour window', window: snap.fiveHour }),
        hasData && e(LimitsMeter, { label: 'Weekly window', window: snap.weekly }),
        hasData && typeof snap.contextUsedPercent === 'number' && e('div', { className: 'limits-meta' },
          e('span', null, 'last session context: ' + Math.round(snap.contextUsedPercent) + '%')
        ),
        snap.detail && e('div', { className: 'limits-detail' }, snap.detail),
        e('button', { className: 'limits-raw-toggle', onClick: () => setShowRaw(v => !v) }, showRaw ? 'hide source' : 'source'),
        showRaw && e('div', { className: 'limits-raw' },
          e('div', null, snap.source),
          e('div', null, 'checked ' + limitsRelTime(snap.checkedAt))
        )
      );
    }

    function LimitsPanel({ limits, onRefresh }) {
      // Re-render every 30s so "resets in"/"next refresh" countdowns stay honest.
      const [, forceTick] = useState(0);
      useEffect(() => {
        const id = setInterval(() => forceTick(t => t + 1), 30000);
        return () => clearInterval(id);
      }, []);

      const nextIn = limits && limits.nextRefreshAt
        ? Math.max(0, Math.round((limits.nextRefreshAt - Date.now()) / 60000))
        : null;

      return e('div', { className: 'limits-panel' },
        e('div', { className: 'limits-header' },
          e('span', null, 'Limits'),
          e('button', { className: 'limits-refresh', onClick: onRefresh, title: 'Re-read both providers now' }, '↻ Refresh')
        ),
        !limits
          ? e('div', { className: 'limits-detail', style: { padding: 12 } }, 'No limits data yet — first read happens at server start.')
          : e(React.Fragment, null,
              e(LimitsProviderCard, { snap: limits.providers.claude, icon: '✦', title: 'Claude' }),
              e(LimitsProviderCard, { snap: limits.providers.codex, icon: '⚙', title: 'Codex' }),
              nextIn !== null && e('div', { className: 'limits-next' }, 'auto-refresh every ' + Math.round((limits.refreshIntervalMs || 1800000) / 60000) + 'm · next in ~' + nextIn + 'm')
            )
      );
    }

    // ======================== MAIN APP ========================

    // Token formatting helper
    function formatTokens(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return Math.round(n / 1000) + 'k';
      return String(n);
    }

    function App() {
      const ws = useWebSocket();
      const { connected, agents, messages, liveOutput, queued, sharedContext, fileChanges, thinkingOutput, agentActivity, settings, workspaces, statusStartTimes, tokenUsage, usageReport, terminals, terminalOutput, errorToasts } = ws;
      const [showModal, setShowModal] = useState(false);
      const [showSharedContext, setShowSharedContext] = useState(false);
      const [sidebarTab, setSidebarTab] = useState('agents');
      const [sidebarWidth, setSidebarWidth] = useState(settings.sidebarWidth || 240);
      const [isResizing, setIsResizing] = useState(false);
      const sidebarResizeRef = useRef(null);
      // Feature 2: Collapsible panels
      const [minimizedAgents, setMinimizedAgents] = useState(new Set());
      const [unreadCounts, setUnreadCounts] = useState({});
      // Feature 2: Escape focused agent
      const [focusedAgentId, setFocusedAgentId] = useState(null);
      // Feature 4: Maximize panel
      const [maximizedAgent, setMaximizedAgent] = useState(null);
      // Feature 6: Edit agent
      const [editingAgent, setEditingAgent] = useState(null);
      // Drag-to-rearrange
      const [draggedAgent, setDraggedAgent] = useState(null);
      const [dragOverSlot, setDragOverSlot] = useState(null);

      // Derive active workspace and grid settings from server-owned workspace
      const activeWorkspace = workspaces.find(w => w.id === settings.activeWorkspaceId) || workspaces[0];
      const columns = activeWorkspace ? activeWorkspace.gridColumns : 2;
      const rows = activeWorkspace ? activeWorkspace.gridRows : 2;
      const totalPanels = columns * rows;

      // Agents for the active workspace
      const workspaceAgents = activeWorkspace ? agents.filter(a => a.workspaceId === activeWorkspace.id && !a.hideFromGrid) : [];
      const workspaceAgentIds = workspaceAgents.map(a => a.id);
      const workspaceAgentIdSet = new Set(workspaceAgentIds);
      const workspaceAgentIdsKey = workspaceAgentIds.join('|');
      const minimizedStorageKey = activeWorkspace ? `agent-forge:minimized-agents:${activeWorkspace.id}` : null;
      const minimizedWorkspaceRef = useRef(null);

      const sameSlots = (a, b) => a.length === b.length && a.every((id, i) => id === b[i]);
      const normalizeGridSlots = (rawIds, excludedIds = minimizedAgents) => {
        const slots = Array.from({ length: totalPanels }, () => '');
        const lockedIds = activeWorkspace ? activeWorkspace.lockedAgentIds || [] : [];
        const seen = new Set();

        (rawIds || []).forEach((id, idx) => {
          if (!id || idx >= totalPanels || !lockedIds.includes(id) || !workspaceAgentIdSet.has(id) || excludedIds.has(id) || seen.has(id)) return;
          slots[idx] = id;
          seen.add(id);
        });

        const candidates = [];
        for (const id of rawIds || []) {
          if (!id || lockedIds.includes(id) || !workspaceAgentIdSet.has(id) || excludedIds.has(id) || seen.has(id)) continue;
          candidates.push(id);
          seen.add(id);
        }
        for (const id of workspaceAgentIds) {
          if (excludedIds.has(id) || seen.has(id)) continue;
          candidates.push(id);
          seen.add(id);
        }

        let nextCandidate = 0;
        for (let i = 0; i < slots.length && nextCandidate < candidates.length; i++) {
          if (!slots[i]) slots[i] = candidates[nextCandidate++];
        }
        return slots;
      };

      // Sync sidebar width from server settings on first load
      const sidebarWidthSynced = useRef(false);
      useEffect(() => {
        if (settings.sidebarWidth && !sidebarWidthSynced.current) {
          setSidebarWidth(settings.sidebarWidth);
          sidebarWidthSynced.current = true;
        }
      }, [settings.sidebarWidth]);

      // Sidebar resize handler
      useEffect(() => {
        if (!isResizing) return;
        const onMouseMove = (ev) => {
          const newWidth = Math.max(180, Math.min(500, ev.clientX - 48)); // 48 = activity bar width
          setSidebarWidth(newWidth);
        };
        const onMouseUp = () => {
          setIsResizing(false);
          // Persist debounced
          clearTimeout(sidebarResizeRef.current);
          sidebarResizeRef.current = setTimeout(() => {
            ws.updateSettings({ sidebarWidth: sidebarWidth });
          }, 300);
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        return () => {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
      }, [isResizing, sidebarWidth, ws]);

      // Fetch home path for folder browser defaults
      useEffect(() => {
        fetch('/api/directories').then(r => r.json()).then(data => {
          if (data.home) window.__HOME_PATH = data.home;
        }).catch(() => {});
      }, []);

      // Persist minimized agents per workspace so refreshes keep the compact bar.
      useEffect(() => {
        if (!activeWorkspace || minimizedWorkspaceRef.current === activeWorkspace.id) return;
        minimizedWorkspaceRef.current = activeWorkspace.id;
        try {
          const raw = localStorage.getItem(`agent-forge:minimized-agents:${activeWorkspace.id}`);
          const ids = raw ? JSON.parse(raw) : [];
          setMinimizedAgents(new Set(Array.isArray(ids) ? ids.filter(id => workspaceAgentIdSet.has(id)) : []));
        } catch {
          setMinimizedAgents(new Set());
        }
      }, [activeWorkspace?.id, workspaceAgentIdsKey]);

      useEffect(() => {
        if (!minimizedStorageKey || minimizedWorkspaceRef.current !== activeWorkspace?.id) return;
        try {
          localStorage.setItem(
            minimizedStorageKey,
            JSON.stringify([...minimizedAgents].filter(id => workspaceAgentIdSet.has(id))),
          );
        } catch {}
      }, [minimizedStorageKey, activeWorkspace?.id, minimizedAgents, workspaceAgentIdsKey]);

      // Track unread messages for minimized agents (Feature 2)
      const prevMessagesRef = useRef({});
      useEffect(() => {
        for (const [agentId, msgs] of Object.entries(messages)) {
          const prevLen = prevMessagesRef.current[agentId] || 0;
          const newLen = (msgs || []).length;
          if (newLen > prevLen && minimizedAgents.has(agentId)) {
            setUnreadCounts(prev => ({ ...prev, [agentId]: (prev[agentId] || 0) + (newLen - prevLen) }));
          }
          prevMessagesRef.current[agentId] = newLen;
        }
      }, [messages, minimizedAgents]);

      // Global keyboard shortcuts
      useEffect(() => {
        const handler = (ev) => {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'n') {
            ev.preventDefault();
            setEditingAgent(null);
            setShowModal(true);
          }
          if (ev.key === 'Escape') {
            // Priority chain: 1) un-maximize, 2) stop focused agent, 3) do nothing
            if (maximizedAgent) {
              setMaximizedAgent(null);
            } else if (focusedAgentId) {
              const focused = agents.find(a => a.id === focusedAgentId);
              if (focused && (focused.status === 'working' || focused.status === 'thinking')) {
                ws.stopAgent(focusedAgentId);
              }
            }
          }
          // Ctrl+M / Cmd+M toggles maximize on focused agent
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'm') {
            ev.preventDefault();
            if (maximizedAgent) {
              setMaximizedAgent(null);
            } else if (focusedAgentId) {
              setMaximizedAgent(focusedAgentId);
            }
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [agents, ws, focusedAgentId, maximizedAgent]);

      // Keep workspace slots canonical: exactly one agent per visible slot,
      // no duplicates, no minimized/stale IDs, and no overflow beyond grid capacity.
      const displayAgents = activeWorkspace ? normalizeGridSlots(activeWorkspace.selectedAgentIds || []) : [];
      useEffect(() => {
        if (!activeWorkspace) return;
        if (!sameSlots(activeWorkspace.selectedAgentIds || [], displayAgents)) {
          ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: displayAgents });
        }
      }, [activeWorkspace?.id, activeWorkspace?.selectedAgentIds, columns, rows, agents.length, minimizedAgents]);

      // Split into minimized and non-minimized (skip empty placeholders for minimized bar)
      const minimizedDisplayAgents = workspaceAgentIds.filter(id => minimizedAgents.has(id));

      const handleMinimize = (agentId) => {
        setMinimizedAgents(prev => { const next = new Set(prev); next.add(agentId); return next; });
        if (activeWorkspace) {
          const excluded = new Set(minimizedAgents);
          excluded.add(agentId);
          ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: normalizeGridSlots(activeWorkspace.selectedAgentIds || [], excluded) });
        }
      };
      const handleRestore = (agentId) => {
        setMinimizedAgents(prev => { const next = new Set(prev); next.delete(agentId); return next; });
        setUnreadCounts(prev => { const n = { ...prev }; delete n[agentId]; return n; });
        if (activeWorkspace) {
          const excluded = new Set(minimizedAgents);
          excluded.delete(agentId);
          const current = (activeWorkspace.selectedAgentIds || []).filter(id => id && id !== agentId);
          const appended = [...current.slice(0, Math.max(0, totalPanels - 1)), agentId];
          ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: normalizeGridSlots(appended, excluded) });
        }
      };
      // Feature 4: Toggle maximize
      const handleToggleMaximize = (agentId) => {
        setMaximizedAgent(prev => prev === agentId ? null : agentId);
      };

      // Drag-to-rearrange handlers
      const handleDragStart = (agentId, ev) => {
        setDraggedAgent(agentId);
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', agentId);
      };
      const handleDragEnd = () => {
        setDraggedAgent(null);
        setDragOverSlot(null);
      };
      const handleDragOver = (slotIndex, ev) => {
        if (!draggedAgent) return;
        const lockedIds = activeWorkspace ? activeWorkspace.lockedAgentIds || [] : [];
        const nonMinimized = displayAgents;
        const targetAgentId = nonMinimized[slotIndex];
        if (targetAgentId && targetAgentId !== '' && lockedIds.includes(targetAgentId)) return;
        ev.preventDefault();
        ev.dataTransfer.dropEffect = 'move';
        setDragOverSlot(slotIndex);
      };
      const handleDragLeave = () => {
        setDragOverSlot(null);
      };
      const handleDrop = (targetSlotIndex) => {
        if (!draggedAgent || !activeWorkspace) return;
        const lockedIds = activeWorkspace.lockedAgentIds || [];
        const nonMinimized = displayAgents;
        // Build a full slot array (length = totalPanels), empty string for empty slots
        const slots = Array.from({ length: totalPanels }, (_, i) => nonMinimized[i] || '');
        const targetAgentId = slots[targetSlotIndex];
        if (targetAgentId && lockedIds.includes(targetAgentId)) return;

        const fromIndex = slots.indexOf(draggedAgent);
        const toIndex = targetSlotIndex;
        if (fromIndex === -1 || fromIndex === toIndex) { setDraggedAgent(null); setDragOverSlot(null); return; }

        // Swap: source gets whatever was in target (agent ID or empty string)
        slots[fromIndex] = slots[toIndex];
        slots[toIndex] = draggedAgent;

        ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: normalizeGridSlots(slots) });
        setDraggedAgent(null);
        setDragOverSlot(null);
      };

      // Lock/unlock toggle
      const toggleLock = (agentId) => {
        if (!activeWorkspace) return;
        const locked = activeWorkspace.lockedAgentIds || [];
        const updated = locked.includes(agentId)
          ? locked.filter(id => id !== agentId)
          : [...locked, agentId];
        ws.updateWorkspace(activeWorkspace.id, { lockedAgentIds: updated });
      };

      // Grid uses user-chosen columns/rows — override when maximized
      const gridStyle = maximizedAgent
        ? { gridTemplateColumns: '1fr', gridTemplateRows: '1fr' }
        : { gridTemplateColumns: 'repeat(' + columns + ', minmax(0, 1fr))', gridTemplateRows: 'repeat(' + rows + ', minmax(0, 1fr))' };

      // Grid column/row changes go through updateWorkspace
      const setColumns = (n) => { if (activeWorkspace) ws.updateWorkspace(activeWorkspace.id, { gridColumns: n }); };
      const setRows = (n) => { if (activeWorkspace) ws.updateWorkspace(activeWorkspace.id, { gridRows: n }); };

      const toggleAgent = (agentId) => {
        if (!activeWorkspace) return;
        const current = (activeWorkspace.selectedAgentIds || []).filter(id => id && id !== agentId);
        const updated = (activeWorkspace.selectedAgentIds || []).includes(agentId)
          ? normalizeGridSlots(current)
          : normalizeGridSlots([...current.slice(0, Math.max(0, totalPanels - 1)), agentId]);
        ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: updated });
      };

      // Activity bar tabs — Workspaces replaces Agents
      const tabs = [
        { id: 'agents', icon: ICONS.agents, label: 'Workspaces' },
        { id: 'atlas', icon: null, emoji: '🗺️', label: 'UI Atlas' },
        { id: 'commands', icon: ICONS.commands, label: 'Slash Commands' },
        { id: 'emulators', icon: ICONS.emulators, label: 'Emulators' },
        { id: 'tokens', icon: null, emoji: '🪙', label: 'Token Usage' },
        { id: 'limits', icon: null, emoji: '⏳', label: 'Limits' },
      ];

      return e('div', { className: 'app' },
        // Activity Bar
        e('div', { className: 'activity-bar' },
          tabs.map(tab =>
            e('button', {
              key: tab.id,
              className: 'activity-bar-btn' + (sidebarTab === tab.id ? ' active' : ''),
              onClick: () => setSidebarTab(tab.id),
              title: tab.label
            }, tab.emoji ? e('span', { style: { fontSize: 18 } }, tab.emoji) : e(Icon, { d: tab.icon, size: 20 }))
          ),
          e('div', { className: 'activity-bar-spacer' }),
          e('button', {
            className: 'activity-bar-btn kill-all',
            onClick: () => {
              if (confirm('Force kill all Claude and Codex processes started on this machine?')) {
                ws.killAll();
              }
            },
            title: 'Force kill all agent CLI processes'
          }, '\u2620'),
          e('button', {
            className: 'activity-bar-btn activity-bar-bottom',
            onClick: () => setShowSharedContext(true),
            title: 'Settings'
          }, e(Icon, { d: ICONS.settings, size: 20 }))
        ),

        // Sidebar Panel
        e('div', { className: 'sidebar-panel', style: { width: sidebarWidth } },
          e('div', { className: 'sidebar-resize-handle' + (isResizing ? ' active' : ''), onMouseDown: (ev) => { ev.preventDefault(); setIsResizing(true); } }),
          sidebarTab === 'agents' && e(WorkspacesSidebar, {
            workspaces,
            agents,
            activeWorkspaceId: activeWorkspace ? activeWorkspace.id : null,
            onSelectWorkspace: (id) => ws.setActiveWorkspace(id),
            onCreateWorkspace: ws.createWorkspace,
            onDeleteWorkspace: ws.deleteWorkspace,
            onRenameWorkspace: (id, name) => ws.updateWorkspace(id, { name }),
            onUpdateWorkspaceTesting: (id, updates) => ws.updateWorkspace(id, updates),
            onProvisionAtlas: (workspaceId, projectCwd) => ws.provisionAtlasAgent(workspaceId, projectCwd),
            onStopAtlas: (agentId) => ws.stopAgent(agentId),
            onRescanAtlas: (workspaceId) => ws.rescanAtlas(workspaceId),
            onOpenAtlasViewer: (workspaceId) => setSidebarTab('atlas'),
            qaLiveShots: ws.qaLiveShots,
            onNewAgent: () => { setEditingAgent(null); setShowModal(true); },
            onEditAgent: (agent) => { setEditingAgent(agent); setShowModal(true); },
            onRemoveAgent: ws.removeAgent,
            statusStartTimes,
          }),
          sidebarTab === 'atlas' && e(AtlasPanel, {
            activeWorkspace,
            agents,
            messages,
            statusStartTimes,
            qaLiveShots: ws.qaLiveShots,
            onRescanAtlas: ws.rescanAtlas,
            onProvisionAtlas: ws.provisionAtlasAgent,
          }),
          sidebarTab === 'commands' && e(CommandsPanel, { commands: SLASH_COMMANDS }),
          sidebarTab === 'emulators' && e(EmulatorsPanel, { settings, onUpdateSettings: ws.updateSettings }),
          sidebarTab === 'tokens' && e(TokensPanel, { report: usageReport }),
          sidebarTab === 'limits' && e(LimitsPanel, { limits: ws.limits, onRefresh: ws.refreshLimits }),
          // Active ports always pinned to bottom of sidebar
          e(SidebarPorts),
        ),

        // Main content
        e('div', { className: 'main-content' },
          !connected && e('div', { className: 'connection-error' }, 'Disconnected. Reconnecting...'),

          // Minimized panels bar (Feature 2)
          !maximizedAgent && minimizedDisplayAgents.length > 0 && e('div', { className: 'minimized-panels-bar' },
            minimizedDisplayAgents.map(agentId => {
              const agent = agents.find(a => a.id === agentId);
              if (!agent) return null;
              return e('div', { key: agentId, className: 'panel-minimized', onClick: () => handleRestore(agentId) },
                e('span', { className: 'status-dot status-' + agent.status }),
                e('span', { className: 'panel-minimized-name' }, agent.name),
                unreadCounts[agentId] > 0 && e('span', { className: 'panel-unread-badge' }, unreadCounts[agentId]),
                e('button', { className: 'panel-btn', onClick: (ev) => { ev.stopPropagation(); handleRestore(agentId); }, title: 'Expand' }, '\u25A1')
              );
            })
          ),

          // Terminal grid — fill all col*row slots, skip minimized agents
          e('div', { className: 'terminal-grid', style: gridStyle },
            (() => {
              // When maximized, only show that agent
              if (maximizedAgent) {
                const agent = agents.find(a => a.id === maximizedAgent);
                if (!agent) return e('div', { key: 'empty-max', className: 'terminal-panel' }, e('div', { className: 'panel-content panel-empty' }, 'Agent not found'));
                return e(TerminalPanel, {
                  key: maximizedAgent,
                  agent,
                  messages: messages[maximizedAgent] || [],
                  liveOutput: liveOutput[maximizedAgent] || '',
                  queuedMessages: queued[maximizedAgent] || [],
                  fileChanges: fileChanges[maximizedAgent] || [],
                  thinkingOutput: thinkingOutput[maximizedAgent] || '',
                  agentActivity: agentActivity[maximizedAgent] || null,
                  statusStartTime: statusStartTimes[maximizedAgent],
                  tokenUsage: tokenUsage[maximizedAgent],
                  terminals,
                  terminalOutput,
                  workspace: activeWorkspace,
                  qaAgent: activeWorkspace && activeWorkspace.qaAgentId ? agents.find(a => a.id === activeWorkspace.qaAgentId) : null,
                  qaMessages: activeWorkspace && activeWorkspace.qaAgentId ? (messages[activeWorkspace.qaAgentId] || []) : [],
                  qaTokenUsage: activeWorkspace && activeWorkspace.qaAgentId ? tokenUsage[activeWorkspace.qaAgentId] : null,
                  qaLiveShots: activeWorkspace ? (ws.qaLiveShots[activeWorkspace.id] || []) : [],
                  qaHasUnread: !!ws.qaUnread[agent.id],
                  onQaSend: ws.sendQaMessage,
                  onQaAbort: ws.abortQaTest,
                  onClearQaUnread: ws.clearQaUnread,
                  onSendMessage: (content) => ws.sendMessage(agent.id, content),
                  onSendImage: ws.sendImage,
                  onSendImages: ws.sendImages,
                  onStop: ws.stopAgent,
                  onClearHistory: ws.clearHistory,
                  onClearFileChanges: ws.clearFileChanges,
                  onMinimize: null,
                  onMaximize: handleToggleMaximize,
                  isMaximized: true,
                  onFocus: setFocusedAgentId,
                  isFocused: focusedAgentId === maximizedAgent,
                  onCreateTerminal: ws.createTerminal,
                  onKillTerminal: ws.killTerminal,
                  onUpdateAgent: ws.updateAgent,
                  onResolveModelMismatch: ws.resolveModelMismatch,
                });
              }
              const nonMinimized = displayAgents;
              const lockedIds = activeWorkspace ? activeWorkspace.lockedAgentIds || [] : [];
              return Array.from({ length: totalPanels }).map((_, i) => {
                const agentId = nonMinimized[i];
                const agent = agentId ? agents.find(a => a.id === agentId) : null;
                if (!agent) return e('div', {
                  key: 'empty-' + i,
                  className: 'terminal-panel slot-empty' + (dragOverSlot === i ? ' drag-over' : ''),
                  onDragOver: (ev) => handleDragOver(i, ev),
                  onDragLeave: handleDragLeave,
                  onDrop: () => handleDrop(i),
                },
                  e('button', { className: 'slot-add-btn', onClick: () => { setEditingAgent(null); setShowModal(true); } }, '+ Add Agent')
                );
                const isLocked = lockedIds.includes(agentId);
                return e(TerminalPanel, {
                  key: agentId,
                  agent,
                  messages: messages[agentId] || [],
                  liveOutput: liveOutput[agentId] || '',
                  queuedMessages: queued[agentId] || [],
                  fileChanges: fileChanges[agentId] || [],
                  thinkingOutput: thinkingOutput[agentId] || '',
                  agentActivity: agentActivity[agentId] || null,
                  statusStartTime: statusStartTimes[agentId],
                  tokenUsage: tokenUsage[agentId],
                  terminals,
                  terminalOutput,
                  workspace: activeWorkspace,
                  qaAgent: activeWorkspace && activeWorkspace.qaAgentId ? agents.find(a => a.id === activeWorkspace.qaAgentId) : null,
                  qaMessages: activeWorkspace && activeWorkspace.qaAgentId ? (messages[activeWorkspace.qaAgentId] || []) : [],
                  qaTokenUsage: activeWorkspace && activeWorkspace.qaAgentId ? tokenUsage[activeWorkspace.qaAgentId] : null,
                  qaLiveShots: activeWorkspace ? (ws.qaLiveShots[activeWorkspace.id] || []) : [],
                  qaHasUnread: !!ws.qaUnread[agent.id],
                  onQaSend: ws.sendQaMessage,
                  onQaAbort: ws.abortQaTest,
                  onClearQaUnread: ws.clearQaUnread,
                  onSendMessage: (content) => ws.sendMessage(agent.id, content),
                  onSendImage: ws.sendImage,
                  onSendImages: ws.sendImages,
                  onStop: ws.stopAgent,
                  onClearHistory: ws.clearHistory,
                  onClearFileChanges: ws.clearFileChanges,
                  onMinimize: handleMinimize,
                  onMaximize: handleToggleMaximize,
                  isMaximized: false,
                  onFocus: setFocusedAgentId,
                  isFocused: focusedAgentId === agentId,
                  onCreateTerminal: ws.createTerminal,
                  onKillTerminal: ws.killTerminal,
                  onUpdateAgent: ws.updateAgent,
                  onResolveModelMismatch: ws.resolveModelMismatch,
                  isLocked,
                  onToggleLock: toggleLock,
                  isDragging: draggedAgent === agentId,
                  isDragOver: dragOverSlot === i,
                  onDragStart: handleDragStart,
                  onDragEnd: handleDragEnd,
                  onDragOver: (ev) => handleDragOver(i, ev),
                  onDragLeave: handleDragLeave,
                  onDrop: () => handleDrop(i),
                });
              });
            })()
          ),

          // Bottom bar (workspace info, grid controls).
          // Token usage now lives in the dedicated Tokens sidebar tab.
          e('div', { className: 'bottom-bar' },
            e('div', { className: 'bottom-bar-left' },
              activeWorkspace && e('span', { style: { fontWeight: 600, fontSize: 13, color: 'var(--text-primary)', marginRight: 8 } }, activeWorkspace.name)
            ),
            e('div', { className: 'bottom-bar-right' },
              e('div', { className: 'grid-controls' },
                e('span', { className: 'grid-label' }, 'Col'),
                e('div', { className: 'grid-buttons' },
                  [1,2,3,4].map(n => e('button', { key: n, className: 'grid-btn' + (columns === n ? ' active' : ''), onClick: () => setColumns(n) }, n))
                )
              ),
              e('div', { className: 'grid-controls' },
                e('span', { className: 'grid-label' }, 'Row'),
                e('div', { className: 'grid-buttons' },
                  [1,2,3].map(n => e('button', { key: n, className: 'grid-btn' + (rows === n ? ' active' : ''), onClick: () => setRows(n) }, n))
                )
              ),
            )
          )
        ),

        // Modals
        e(NewAgentModal, {
          isOpen: showModal,
          onClose: () => { setShowModal(false); setEditingAgent(null); },
          onCreate: ws.createAgent,
          editAgent: editingAgent,
          onUpdate: ws.updateAgent,
          workspaceId: activeWorkspace ? activeWorkspace.id : undefined,
        }),
        e(SharedContextModal, { isOpen: showSharedContext, onClose: () => setShowSharedContext(false), content: sharedContext, onSave: ws.updateSharedContext }),

        // Error toasts
        errorToasts.length > 0 && e('div', { className: 'error-toast-container' },
          errorToasts.map(t => e('div', { key: t.id, className: 'error-toast' }, t.message))
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
