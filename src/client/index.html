    }

    function useElapsed(status, statusStartTime, lastProviderEventAt) {
      const [elapsed, setElapsed] = useState('');
      useEffect(() => {
        if (!statusStartTime || (status !== 'working' && status !== 'thinking')) {
          setElapsed('');
          return;
        }
        const tick = () => {
          const diff = Math.floor((Date.now() - statusStartTime) / 1000);
          setElapsed(formatElapsedDuration(diff));
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, [status, statusStartTime]);
      const isRunning = status === 'working' || status === 'thinking';
      const activityAt = lastProviderEventAt || statusStartTime;
      const isStuck = !!(isRunning && activityAt && (Date.now() - activityAt) > 600000);
      return { elapsed, isStuck, activityAge: isRunning ? formatElapsedShort(activityAt) : '' };
    }

    function useWebSocket() {
      const [connected, setConnected] = useState(false);
      const [agents, setAgents] = useState([]);
      const [messages, setMessages] = useState({});
      const [liveOutput, setLiveOutput] = useState({});
      const [queued, setQueued] = useState({});
      const [sharedContext, setSharedContext] = useState('');
      const [fileChanges, setFileChanges] = useState({});
      const [thinkingOutput, setThinkingOutput] = useState({});
      const [agentActivity, setAgentActivity] = useState({});
      const [liveTurnState, setLiveTurnState] = useState({});
      const [settings, setSettings] = useState({});
      const [workspaces, setWorkspaces] = useState([]);
      const [activeWorkspaceId, setActiveWorkspaceId] = useState(readStoredActiveWorkspaceId);
      const [providerCatalog, setProviderCatalog] = useState(AGENT_PROVIDERS);
      const [statusStartTimes, setStatusStartTimes] = useState({});
      const [tokenUsage, setTokenUsage] = useState({});
      // Full cross-provider token report for the Tokens sidebar tab.
      // Server emits `usage_report` on WS connect and after each turn finalizes.
      // null until the first report lands (the connect handshake fires it).
      const [usageReport, setUsageReport] = useState(null);
      // Provider rate-limit snapshot for the Limits sidebar tab. Server emits
      // `limits_snapshot` on connect, every minute, and on manual refresh.
      const [limits, setLimits] = useState(null);
      const [terminals, setTerminals] = useState([]);
      const [terminalOutput, setTerminalOutput] = useState({});
      const [errorToasts, setErrorToasts] = useState([]);
      const [qaUnread, setQaUnread] = useState({}); // sourceAgentId -> true when QA results arrived for that agent
      const [qaLiveShots, setQaLiveShots] = useState({}); // workspaceId -> [{path, timestamp}]
      const wsRef = useRef(null);
      const agentsRef = useRef([]);
      const workspacesRef = useRef([]);
      const queueRef = useRef({});
      const liveTurnStateRef = useRef({});

      agentsRef.current = agents;
      workspacesRef.current = workspaces;
      queueRef.current = queued;

      useEffect(() => {
        if (workspaces.length === 0 || workspaces.some(workspace => workspace.id === activeWorkspaceId)) return;
        const fallbackId = workspaces.some(workspace => workspace.id === settings.activeWorkspaceId)
          ? settings.activeWorkspaceId
          : workspaces[0].id;
        setActiveWorkspaceId(fallbackId);
        storeActiveWorkspaceId(fallbackId);
      }, [activeWorkspaceId, settings.activeWorkspaceId, workspaces]);

      const selectActiveWorkspace = useCallback((id) => {
        if (!workspacesRef.current.some(workspace => workspace.id === id)) return;
        setActiveWorkspaceId(id);
        storeActiveWorkspaceId(id);
      }, []);

      const isHiddenQaAgent = (agentId) => {
        const agent = agentsRef.current.find(item => item.id === agentId);
        return (agent?.hideFromGrid && agent?.name === 'QA Tester')
          || workspacesRef.current.some(workspace => workspace.qaAgentId === agentId);
      };

      const sendRaw = useCallback((msg) => {
        if (wsRef.current?.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify(msg));
        }
      }, []);

      const drainQueue = useCallback((agentId) => {
        const q = queueRef.current[agentId];
        if (q && q.length > 0) {
          const next = q[0];
          setQueued(prev => {
            const updated = [...(prev[agentId] || [])];
            updated.shift();
            return { ...prev, [agentId]: updated };
          });
          sendRaw({ type: 'send_message', agentId, content: next });
        }
      }, [sendRaw]);

      const reconnectAttempt = useRef(0);

      useEffect(() => {
        // disposed guards against the cleanup race: closing the socket fires
        // onclose, which would otherwise schedule a reconnect for a dead
        // component (leaked timer + setState after unmount).
        let disposed = false;
        let reconnectTimer = null;
        let heartbeatTimer = null;
        let lastServerActivity = Date.now();
        function connect() {
          if (disposed) return;
          const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const ws = new WebSocket(protocol + '//' + location.host);
          ws.onopen = () => {
            setConnected(true);
            reconnectAttempt.current = 0;
            lastServerActivity = Date.now();
            // App-level heartbeat: after Windows sleep/resume the socket can be
            // half-open (looks connected, delivers nothing). Ping every 15s and
            // force-close if the server has been silent for 45s — onclose then
            // drives the normal reconnect path.
            heartbeatTimer = setInterval(() => {
              if (Date.now() - lastServerActivity > 45000) {
                try { ws.close(); } catch {}
                return;
              }
              if (ws.readyState === WebSocket.OPEN) {
                try { ws.send(JSON.stringify({ type: 'ping' })); } catch {}
              }
            }, 15000);
            fetch('/api/models')
              .then(r => r.ok ? r.json() : null)
              .then(data => {
                if (data?.providers) setProviderCatalog(normalizeProviderCatalog(data.providers));
              })
              .catch(() => {});
          };
          ws.onclose = () => {
            setConnected(false);
            if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
            if (disposed) return;
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempt.current), 30000);
            reconnectAttempt.current++;
            reconnectTimer = setTimeout(connect, delay);
          };
          ws.onmessage = (event) => {
            let msg;
            try {
              msg = JSON.parse(event.data);
            } catch (err) {
              console.warn('Dropping malformed WS frame:', err);
              return;
            }
            lastServerActivity = Date.now();
            switch (msg.type) {
              case 'pong':
                break;
              case 'agents_list':
                setAgents(msg.agents);
                msg.agents.forEach(a => {
                  // Structured qaRuns are the QA UI's durable source. Do not
                  // download the hidden QA implementation transcript.
                  if (!(a.hideFromGrid && a.name === 'QA Tester')) sendRaw({ type: 'get_history', agentId: a.id });
                  // Drain messages queued while disconnected once we know the
                  // agent is actually idle (reconnect resync path).
                  if (a.status === 'idle') drainQueue(a.id);
                });
                sendRaw({ type: 'get_shared_context' });
                break;
              case 'agent_created':
                setAgents(prev => [...prev, msg.agent]);
                break;
              case 'agent_updated':
                setAgents(prev => {
                  const old = prev.find(a => a.id === msg.agent.id);
                  if (old && old.status !== msg.agent.status) {
                    setStatusStartTimes(st => ({ ...st, [msg.agent.id]: Date.now() }));
                    const wasRunning = old.status === 'working' || old.status === 'thinking';
                    const isNowRunning = msg.agent.status === 'working' || msg.agent.status === 'thinking';
                    if (!wasRunning && isNowRunning) {
                      setThinkingOutput(prev2 => { const n = {...prev2}; delete n[msg.agent.id]; return n; });
                      setAgentActivity(prev2 => { const n = {...prev2}; delete n[msg.agent.id]; return n; });
                    }
                  }
                  // Toast the moment a model mismatch latches, independent of
                  // status transitions — this is the loud, impossible-to-miss
                  // signal that a turn was served by the wrong model.
                  if (old && !old.modelMismatch && msg.agent.modelMismatch) {
                    const mm = msg.agent.modelMismatch;
                    const toastId = 'model-mismatch-' + msg.agent.id + '-' + mm.at;
                    setErrorToasts(prev2 => {
                      if (prev2.some(t => t.id === toastId)) return prev2;
                      const next = [...prev2, { id: toastId, message: '⛔ ' + msg.agent.name + ': turn ran "' + mm.ran + '" instead of "' + mm.requested + '" — pane blocked until resolved.' }];
                      return next.slice(-5);
                    });
                    setTimeout(() => setErrorToasts(prev2 => prev2.filter(t => t.id !== toastId)), 20000);
                  }
                  return prev.map(a => a.id === msg.agent.id ? msg.agent : a);
                });
                if (msg.agent.status === 'idle') {
                  drainQueue(msg.agent.id);
                  setAgentActivity(prev => { const n = {...prev}; delete n[msg.agent.id]; return n; });
                }
                break;
              case 'agent_removed':
                setAgents(prev => prev.filter(a => a.id !== msg.agentId));
                setMessages(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                setLiveOutput(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                setThinkingOutput(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                setAgentActivity(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                liveTurnStateRef.current = (() => { const n = {...liveTurnStateRef.current}; delete n[msg.agentId]; return n; })();
                setLiveTurnState(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                break;
              case 'message':
                if (isHiddenQaAgent(msg.message.agentId)) break;
                setMessages(prev => ({
                  ...prev,
                  [msg.message.agentId]: [...(prev[msg.message.agentId] || []), msg.message]
                }));
                if (msg.message.role === 'assistant') {
                  setLiveOutput(prev => ({ ...prev, [msg.message.agentId]: '' }));
                }
                break;
              case 'history':
                if (isHiddenQaAgent(msg.agentId)) break;
                setMessages(prev => ({ ...prev, [msg.agentId]: msg.messages }));
                break;
              case 'history_cleared':
                setMessages(prev => ({ ...prev, [msg.agentId]: [] }));
                setLiveOutput(prev => ({ ...prev, [msg.agentId]: '' }));
                setThinkingOutput(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                setAgentActivity(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                liveTurnStateRef.current = (() => { const n = {...liveTurnStateRef.current}; delete n[msg.agentId]; return n; })();
                setLiveTurnState(prev => { const n = {...prev}; delete n[msg.agentId]; return n; });
                break;
              case 'output': {
                if (isHiddenQaAgent(msg.agentId)) break;
                const MAX_LIVE_OUTPUT = 512000; // 500KB cap
                setLiveOutput(prev => {
                  let updated = (prev[msg.agentId] || '') + msg.content;
                  if (updated.length > MAX_LIVE_OUTPUT) {
                    updated = updated.slice(updated.length - MAX_LIVE_OUTPUT);
                  }
                  return { ...prev, [msg.agentId]: updated };
                });
                break;
              }
              case 'agent_activity':
                if (isHiddenQaAgent(msg.agentId)) break;
                if (msg.clear) {
                  setAgentActivity(prev => {
                    const current = prev[msg.agentId];
                    if (!current || (msg.kind && current.kind !== msg.kind)) return prev;
                    const next = { ...prev };
                    delete next[msg.agentId];
                    return next;
                  });
                } else {
                  setAgentActivity(prev => ({
                    ...prev,
                    [msg.agentId]: { label: msg.label, timestamp: msg.timestamp, kind: msg.kind, detail: msg.detail },
                  }));
                }
                break;
              case 'thinking_output': {
                if (isHiddenQaAgent(msg.agentId)) break;
                const MAX_THINKING_OUTPUT = 16000;
                setThinkingOutput(prev => {
                  let updated = (prev[msg.agentId] || '') + msg.content;
                  if (updated.length > MAX_THINKING_OUTPUT) {
                    updated = updated.slice(updated.length - MAX_THINKING_OUTPUT);
                  }
                  return { ...prev, [msg.agentId]: updated };
                });
                break;
              }
              case 'live_turn_state': {
                const state = msg.state;
                if (!state || isHiddenQaAgent(state.agentId)) break;
                const previous = liveTurnStateRef.current[state.agentId];
                const sameTurn = previous && previous.turnId === state.turnId;
                if (sameTurn && Number(previous.revision || 0) >= Number(state.revision || 0)) break;
                liveTurnStateRef.current = { ...liveTurnStateRef.current, [state.agentId]: state };
                setLiveTurnState(prev => ({ ...prev, [state.agentId]: state }));
                if (state.active) {
                  setStatusStartTimes(prev => ({ ...prev, [state.agentId]: state.startedAt }));
                  setThinkingOutput(prev => ({ ...prev, [state.agentId]: state.thought || '' }));
                  setLiveOutput(prev => ({ ...prev, [state.agentId]: state.response || '' }));
                  if (state.activity) {
                    setAgentActivity(prev => ({ ...prev, [state.agentId]: state.activity }));
                  } else {
                    setAgentActivity(prev => { const n = {...prev}; delete n[state.agentId]; return n; });
                  }
                } else {
                  setThinkingOutput(prev => ({ ...prev, [state.agentId]: state.thought || '' }));
                  setLiveOutput(prev => ({ ...prev, [state.agentId]: '' }));
                  setAgentActivity(prev => { const n = {...prev}; delete n[state.agentId]; return n; });
                }
                break;
              }
              case 'shared_context':
                setSharedContext(msg.content);
                break;
              case 'file_changed':
                setFileChanges(prev => ({ ...prev, [msg.agentId]: msg.files }));
                break;
              // Settings
              case 'settings':
                setSettings(msg.settings);
                break;
              // Token usage
              case 'token_usage':
                setTokenUsage(prev => ({ ...prev, [msg.agentId]: { contextTokens: msg.contextTokens, contextLimit: msg.contextLimit, totalInputTokens: msg.totalInputTokens, totalOutputTokens: msg.totalOutputTokens, totalCostUsd: msg.totalCostUsd, numTurns: msg.numTurns, modelRan: msg.modelRan } }));
                break;
              case 'usage_report':
                setUsageReport(msg.report);
                break;
              case 'limits_snapshot':
                setLimits(msg.snapshot);
                break;
              // Workspaces
              case 'workspaces_list':
                setWorkspaces(msg.workspaces);
                break;
              case 'workspace_created':
                setWorkspaces(prev => [...prev, msg.workspace]);
                break;
              case 'workspace_updated':
                setWorkspaces(prev => prev.map(w => w.id === msg.workspace.id ? msg.workspace : w));
                break;
              case 'workspace_deleted':
                setWorkspaces(prev => prev.filter(w => w.id !== msg.id));
                break;
              case 'qa_results_ready':
                setQaUnread(prev => ({ ...prev, [msg.sourceAgentId]: true }));
                // Retire only this completed run's live strip. Atlas and a
                // subsequently queued QA run use separate browser sessions.
                setQaLiveShots(prev => {
                  const kept = (prev[msg.workspaceId] || []).filter(shot => shot.browserSessionId !== 'qa-' + msg.runId);
                  if (kept.length > 0) return { ...prev, [msg.workspaceId]: kept };
                  const { [msg.workspaceId]: _, ...rest } = prev;
                  return rest;
                });
                break;
              case 'qa_screenshot_taken':
                setQaLiveShots(prev => ({
                  ...prev,
                  [msg.workspaceId]: [...(prev[msg.workspaceId] || []), { path: msg.path, timestamp: msg.timestamp, browserSessionId: msg.browserSessionId }].slice(-200),
                }));
                break;
              case 'qa_stuck_warning': {
                const toastId = 'stuck-' + Date.now() + Math.random();
                const text = '⚠️ QA agent looping: /' + msg.endpoint + ' called ' + msg.repeatCount + 'x with same args. Try /evaluate or skip this surface.';
                setErrorToasts(prev => {
                  const next = [...prev, { id: toastId, message: text }];
                  return next.slice(-5);
                });
                setTimeout(() => setErrorToasts(prev => prev.filter(t => t.id !== toastId)), 12000);
                break;
              }
              // Terminals
              case 'terminals_list':
                setTerminals(msg.terminals);
                break;
              case 'terminal_created':
                setTerminals(prev => [...prev, msg.terminal]);
                break;
              case 'terminal_output': {
                const MAX_TERM_OUTPUT = 512000;
                setTerminalOutput(prev => {
                  let updated = (prev[msg.terminalId] || '') + msg.content;
                  if (updated.length > MAX_TERM_OUTPUT) updated = updated.slice(updated.length - MAX_TERM_OUTPUT);
                  return { ...prev, [msg.terminalId]: updated };
                });
                break;
              }
              case 'terminal_exited':
                setTerminals(prev => prev.map(t => t.id === msg.terminalId ? { ...t, status: 'stopped' } : t));
                break;
              case 'error': {
                const toastId = Date.now() + Math.random();
                const sourceAgent = msg.agentId
                  ? agentsRef.current.find(agent => agent.id === msg.agentId)
                  : null;
                const toastMessage = sourceAgent
                  ? sourceAgent.name + ': ' + msg.message
                  : msg.message;
                const toastKey = (msg.agentId || 'global') + '\u0000' + msg.message;
                setErrorToasts(prev => {
                  if (prev.some(toast => toast.key === toastKey)) return prev;
                  const next = [...prev, { id: toastId, key: toastKey, message: toastMessage }];
                  return next.slice(-5); // max 5 visible
                });
                setTimeout(() => setErrorToasts(prev => prev.filter(t => t.id !== toastId)), 5000);
                break;
              }
            }
          };
          wsRef.current = ws;
        }
        connect();
        return () => {
          disposed = true;
          if (reconnectTimer) clearTimeout(reconnectTimer);
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          wsRef.current?.close();
        };
      }, [drainQueue, sendRaw]);

      const uploadAndSendImages = useCallback(async (agentId, images, prompt, onProgress) => {
        if (!Array.isArray(images) || images.length === 0) throw new Error('Choose at least one image');
        if (images.length > MAX_CHAT_IMAGES) throw new Error('A single message can contain at most ' + MAX_CHAT_IMAGES + ' images');
        const totalBytes = images.reduce((sum, image) => sum + (image.file?.size || image.size || 0), 0);
        if (totalBytes > MAX_CHAT_IMAGE_TOTAL_BYTES) throw new Error('The image batch exceeds the 512 MiB model input limit');

        // Retry can reuse already-persisted attachments without uploading the
        // same original files again. The server revalidates every path.
        if (images.every(image => image?.path && !image.file)) {
          if (wsRef.current?.readyState !== WebSocket.OPEN) throw new Error('Agent Forge is disconnected');
          wsRef.current.send(JSON.stringify({ type: 'send_uploaded_images', agentId, images, prompt }));
          return;
        }

        const uploaded = new Array(images.length);
        let nextIndex = 0;
        let completed = 0;
        let uploadFailure = null;
        onProgress?.(completed, images.length);

        const worker = async () => {
          while (!uploadFailure && nextIndex < images.length) {
            const index = nextIndex++;
            const image = images[index];
            try {
              if (!image?.file) throw new Error('Image ' + (index + 1) + ' is no longer available');
              const query = new URLSearchParams({ agentId, name: image.name || image.file.name || ('image-' + (index + 1)) });
              const response = await fetch('/api/chat/image-upload?' + query.toString(), {
                method: 'POST',
                headers: { 'Content-Type': image.mimeType || image.file.type || 'application/octet-stream' },
                body: image.file,
              });
              const result = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(result.error || ('Image ' + (index + 1) + ' upload failed'));
              uploaded[index] = result;
              completed++;
              onProgress?.(completed, images.length);
            } catch (error) {
              uploadFailure = error;
            }
          }
        };

        await Promise.all(Array.from({ length: Math.min(CHAT_IMAGE_UPLOAD_CONCURRENCY, images.length) }, worker));
        if (uploadFailure) throw uploadFailure;
        if (wsRef.current?.readyState !== WebSocket.OPEN) throw new Error('Agent Forge disconnected before the image batch could be sent');
        wsRef.current.send(JSON.stringify({ type: 'send_uploaded_images', agentId, images: uploaded, prompt }));
      }, []);

      return {
        connected, agents, messages, liveOutput, queued, sharedContext, fileChanges, thinkingOutput, agentActivity, liveTurnState, settings, workspaces, activeWorkspaceId, providerCatalog, statusStartTimes, tokenUsage, usageReport, limits, terminals, terminalOutput, errorToasts, qaUnread, qaLiveShots,
        refreshLimits: () => sendRaw({ type: 'refresh_limits' }),
        createAgent: (name, cwd, referencePaths, systemPrompt, workspaceId) => {
          sendRaw({ type: 'create_agent', name, cwd, referencePaths, systemPrompt, workspaceId });
        },
        sendQaMessage: (workspaceId, sourceAgentId, content, rerunOf) => sendRaw({ type: 'send_qa_message', workspaceId, sourceAgentId, content, rerunOf }),
        abortQaTest: (workspaceId) => sendRaw({ type: 'abort_qa_test', workspaceId }),
        handoffQaRun: (workspaceId, runId) => sendRaw({ type: 'handoff_qa_run', workspaceId, runId }),
        provisionAtlasAgent: (workspaceId, projectCwd) => sendRaw({ type: 'provision_atlas_agent', workspaceId, projectCwd }),
        rescanAtlas: (workspaceId) => sendRaw({ type: 'rescan_atlas', workspaceId }),
        resumeAtlas: (workspaceId) => sendRaw({ type: 'resume_atlas', workspaceId }),
        discardAtlasCandidate: (workspaceId) => sendRaw({ type: 'discard_atlas_candidate', workspaceId }),
        clearQaUnread: (sourceAgentId) => setQaUnread(prev => { if (!prev[sourceAgentId]) return prev; const { [sourceAgentId]: _, ...rest } = prev; return rest; }),
        sendMessage: (agentId, content) => {
          const agent = agentsRef.current.find(a => a.id === agentId);
          const socketOpen = wsRef.current?.readyState === WebSocket.OPEN;
          // Queue when the agent is busy OR the socket is down — sendRaw
          // silently drops frames on a closed socket, which used to destroy
          // messages typed while disconnected. Queued messages drain on
          // reconnect (agents_list) / when the agent goes idle.
          if (!socketOpen || (agent && (agent.status === 'working' || agent.status === 'thinking'))) {
            setQueued(prev => ({ ...prev, [agentId]: [...(prev[agentId] || []), content] }));
          } else {
            sendRaw({ type: 'send_message', agentId, content });
          }
        },
        stopAgent: (agentId) => sendRaw({ type: 'stop_agent', agentId }),
        killAgent: (agentId) => sendRaw({ type: 'kill_agent', agentId }),
        removeAgent: (agentId) => sendRaw({ type: 'remove_agent', agentId }),
        clearHistory: (agentId) => sendRaw({ type: 'clear_history', agentId }),
        updateSharedContext: (content) => sendRaw({ type: 'update_shared_context', content }),
        clearFileChanges: (agentId) => setFileChanges(prev => ({ ...prev, [agentId]: [] })),
        // Settings
        updateSettings: (settings) => sendRaw({ type: 'update_settings', settings }),
        // Image
        sendImages: uploadAndSendImages,
        // Update agent
        updateAgent: (id, updates) => sendRaw({ type: 'update_agent', id, ...updates }),
        // Resolve a latched model mismatch ('continue-actual' | 'fresh-requested')
        resolveModelMismatch: (id, action) => sendRaw({ type: 'resolve_model_mismatch', id, action }),
        // Workspaces
        createWorkspace: (name) => sendRaw({ type: 'create_workspace', name }),
        reorderWorkspaces: (orderedIds) => sendRaw({ type: 'reorder_workspaces', orderedIds }),
        updateWorkspace: (id, updates) => sendRaw({ type: 'update_workspace', id, ...updates }),
        deleteWorkspace: (id) => sendRaw({ type: 'delete_workspace', id }),
        setActiveWorkspace: selectActiveWorkspace,
        // Terminals
        createTerminal: (agentId, command) => sendRaw({ type: 'create_terminal', agentId, command }),
        killTerminal: (id) => sendRaw({ type: 'kill_terminal', id }),
        killAll: () => sendRaw({ type: 'kill_all' }),
      };
    }

    // ======================== COMPONENTS ========================

    // Tool message filter (Feature 7)
    const TOOL_ANNOTATION_RE = /\n?\[(?:Using tool|exec|patch|Read|Write|Edit|Bash|Glob|Grep|LS|WebSearch|WebFetch):[^\]]+\]\n?/g;
    const CODEX_ROUTER_NOISE_RE = /\n?\d{4}-\d{2}-\d{2}T[^\n]*ERROR codex_core::tools::router[^\n]*(?:\n(?:Wall time:[^\n]*|Output:|Too many revisions specified:[^\n]*))*\n?/g;
    function filterToolMessages(text, show) {
      if (show) return text;
      return text.replace(TOOL_ANNOTATION_RE, '').replace(CODEX_ROUTER_NOISE_RE, '');
    }
    function countToolMessages(text) {
      const matches = text.match(TOOL_ANNOTATION_RE);
      return matches ? matches.length : 0;
    }

    // Render untrusted markdown (agent output, doc content) to sanitized HTML.
    // Agent responses can contain arbitrary HTML/JS; DOMPurify strips it before
    // it reaches dangerouslySetInnerHTML. If DOMPurify failed to load, fall back
    // to escaped plain text rather than raw HTML so a CDN miss can't reopen XSS.
    function projectFilePathFromHref(href) {
      let value = String(href || '');
      try { value = decodeURIComponent(value); } catch {}
      if (/^file:\/\/\//i.test(value)) {
        try { value = new URL(value).pathname; } catch { return null; }
      }
      if (/^\/[a-zA-Z]:[\\/]/.test(value)) value = value.slice(1);
      return /^[a-zA-Z]:[\\/]/.test(value) ? value : null;
    }

    function rewriteProjectFileLinks(html, agentId) {
      if (!agentId || !html.includes('href=')) return html;
      const documentFragment = new DOMParser().parseFromString(html, 'text/html');
      documentFragment.querySelectorAll('a[href]').forEach(anchor => {
        const projectPath = projectFilePathFromHref(anchor.getAttribute('href'));
        if (!projectPath) return;
        anchor.setAttribute('href', '/api/project-file?agentId=' + encodeURIComponent(agentId) + '&path=' + encodeURIComponent(projectPath));
        anchor.setAttribute('target', '_blank');
        anchor.setAttribute('rel', 'noopener noreferrer');
        anchor.setAttribute('title', 'Open project file in a new tab');
      });
      return documentFragment.body.innerHTML;
    }

    function renderMarkdown(content, agentId) {
      const src = content || '';
      let html;
      try {
        html = marked.parse(src);
      } catch {
        html = src.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        return html;
      }
      if (window.DOMPurify && typeof window.DOMPurify.sanitize === 'function') {
        return rewriteProjectFileLinks(window.DOMPurify.sanitize(html), agentId);
      }
      return src.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Highlight search query in HTML string (outside of tags)
    function highlightInHtml(html, query) {
      if (!query) return html;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // Replace text outside of HTML tags
      return html.replace(/>([^<]+)</g, (match, text) => {
        const highlighted = text.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark class="search-highlight">$1</mark>');
        return '>' + highlighted + '<';
      });
    }

    // Markdown renderer for assistant messages (memoized)
    const MarkdownContent = React.memo(function MarkdownContent({ content, searchQuery, agentId }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.querySelectorAll('pre').forEach(pre => {
            if (pre.querySelector('.copy-code-btn')) return;
            const btn = document.createElement('button');
            btn.className = 'copy-code-btn';
            btn.textContent = 'Copy';
            btn.onclick = () => {
              const code = pre.querySelector('code');
              navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
              btn.textContent = 'Copied!';
              setTimeout(() => btn.textContent = 'Copy', 1500);
            };
            pre.style.position = 'relative';
            pre.appendChild(btn);
          });
        }
      }, [content, searchQuery]);
      const html = useMemo(() => {
        let parsed = renderMarkdown(content, agentId);
        if (searchQuery) parsed = highlightInHtml(parsed, searchQuery);
        return parsed;
      }, [content, searchQuery, agentId]);
      return e('div', { ref, className: 'chat-turn-content', dangerouslySetInnerHTML: { __html: html } });
    });

    // Agents Sidebar - with verbose status (Feature 5)
    function AgentStatusText({ agent, statusStartTimes, liveTurnState }) {
      const live = liveTurnState?.[agent.id];
      const activeLive = live?.active ? live : null;
      const { elapsed, isStuck, activityAge } = useElapsed(
        agent.status,
        activeLive?.startedAt || statusStartTimes[agent.id],
        activeLive?.lastProviderEventAt || null,

    function SidebarPorts() {
      const [ports, setPorts] = useState([]);
      const [killing, setKilling] = useState(null);

        fetch('/api/ports').then(r => r.json()).then(data => setPorts(data.ports || [])).catch(() => {});
      }, []);

      useEffect(() => {
        loadPorts();
        const id = setInterval(loadPorts, 10000);
        return () => clearInterval(id);
      }, [loadPorts]);

      const killPort = (pid) => {
        setKilling(pid);
        fetch('/api/ports/kill', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pid }) })
          .then(() => { setTimeout(loadPorts, 500); setKilling(null); })
          .catch(() => setKilling(null));
      };

      // Filter to only dev-relevant ports
      const devPorts = ports.filter(p => {
        const cmd = p.command.toLowerCase();
        // Known dev runtimes and tools
        if (['node', 'bun', 'deno', 'python', 'python3', 'ruby', 'java', 'go', 'cargo', 'php', 'nginx', 'docker', 'postgres', 'redis', 'mongod', 'mysqld'].some(r => cmd.includes(r))) return true;

        if (p.port >= 3000 && p.port <= 9999) return true;
        return false;
      });

      return e('div', { className: 'sidebar-ports' },

    // Notes Panel
    // Slug-ify heading text the same way Github / common-mark anchor schemes do —
    // lowercase, alphanumerics + dashes only. Used to wire TOC links to anchors.
    function atlasSlug(text) {
      return String(text || '').toLowerCase().trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // Parse atlas.md text for the coverage header + TOC. Pulls YAML frontmatter
    // counts (total_surfaces, total_entities, last_full_scan), counts "Last
    // verified" entries by freshness bucket, and extracts h2/h3 headings.
    function parseAtlasOverview(text) {
      const out = {
        totalSurfaces: null, totalEntities: null, lastFullScan: null,
        verifiedToday: 0, verified7d: 0, verifiedOlder: 0, verifiedUnknown: 0,
        headings: [],
      };
      if (!text) return out;
      const fmMatch = text.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n)?/);
      if (fmMatch) {
        const fm = fmMatch[1];
        const ts = fm.match(/^total_surfaces:\s*(\d+)/m); if (ts) out.totalSurfaces = parseInt(ts[1], 10);
        const te = fm.match(/^total_entities:\s*(\d+)/m); if (te) out.totalEntities = parseInt(te[1], 10);
        const ls = fm.match(/^last_full_scan:\s*(\S+)/m); if (ls) out.lastFullScan = ls[1];
      }
      const now = Date.now();
      const oneDay = 24 * 60 * 60 * 1000;
      const verifyRe = /^[ \t-]*Last verified:\s*([^\n]+)$/gim;
      let vm;
      while ((vm = verifyRe.exec(text))) {
        const raw = (vm[1] || '').trim();
        if (!raw || raw === '?') { out.verifiedUnknown++; continue; }
        const dateMatch = raw.match(/(\d{4}-\d{2}-\d{2})/);
        if (!dateMatch) { out.verifiedUnknown++; continue; }
        const ageMs = now - new Date(dateMatch[1] + 'T00:00:00').getTime();
        if (ageMs < oneDay * 1.5) out.verifiedToday++;
        else if (ageMs < 7 * oneDay) out.verified7d++;
        else out.verifiedOlder++;
      }
      // Skip headings inside frontmatter and code fences.
      const body = fmMatch ? text.slice(fmMatch[0].length) : text;
      const lines = body.split(/\r?\n/);
      let inFence = false;
      const seen = new Map();
      for (const line of lines) {
        if (/^```/.test(line)) { inFence = !inFence; continue; }
        if (inFence) continue;
        const m = line.match(/^(##|###)\s+(.+?)\s*$/);
        if (!m) continue;
        const level = m[1].length;
        const headingText = m[2].replace(/`/g, '').replace(/^\d+\.\s*/, '');
        let slug = atlasSlug(headingText);
        if (!slug) continue;
        const n = (seen.get(slug) || 0) + 1;
        seen.set(slug, n);
        if (n > 1) slug = slug + '-' + n;
        out.headings.push({ level, text: headingText, slug });
      }
      return out;
    }

    const ATLAS_VIEW_TABS = [
      ['overview', 'Overview'],
      ['surfaces', 'Surfaces'],
      ['entities', 'Entities'],
      ['flows', 'Flows'],
      ['findings', 'Findings'],
      ['gallery', 'Gallery'],
      ['document', 'Document'],
      ['ask', 'Ask Atlas'],
    ];

    const ATLAS_SURFACE_FILTERS = [
      ['verified', 'Verified'],
      ['gaps', 'Gaps'],
      ['changed', 'Changed'],
      ['destructive', 'Destructive'],
      ['modal', 'Modal'],
      ['mobile', 'Mobile'],
      ['error', 'Error state'],
    ];

    function atlasFileUrl(workspaceId, relPath) {
      return '/api/atlas/file?workspaceId=' + encodeURIComponent(workspaceId) + '&relPath=' + encodeURIComponent(relPath);
    }

    function atlasArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function atlasSearchText(item) {
      if (!item || typeof item !== 'object') return '';
      return Object.values(item).flatMap(value => Array.isArray(value) ? value : [value])
        .filter(value => typeof value === 'string')
        .join(' ')
        .toLowerCase();
    }

    function atlasSurfaceTraits(surface, changelogText) {
      const text = atlasSearchText(surface);
      const changedHaystack = String(changelogText || '').toLowerCase();
      return {
        verified: surface?.status === 'verified',
        gaps: surface?.status !== 'verified',
        changed: changedHaystack.includes(String(surface?.id || '').toLowerCase())
          || (!!surface?.name && changedHaystack.includes(String(surface.name).toLowerCase())),
        destructive: /\b(delete|remove|erase|destroy|reset|clear all|cleanup|restore|replace workspace|publish|unpublish)\b/.test(text),
        modal: /\b(modal|dialog|drawer|sheet|popover|picker)\b/.test(text),
        mobile: /\b(mobile|narrow|phone|responsive|small viewport)\b/.test(text),
        error: /\b(error|failure|failed|malformed|invalid|empty|offline|missing|unavailable)\b/.test(text),
      };
    }

    function atlasMarkdownSection(markdown, labels) {
      if (!markdown) return '';
      const wanted = labels.map(label => label.toLowerCase());
      const lines = markdown.split(/\r?\n/);
      const out = [];
      let capturing = false;
      for (const line of lines) {
        const heading = line.match(/^##\s+(?:\d+\.\s*)?(.+?)\s*$/);
        if (heading) {
          if (capturing) break;
          const title = heading[1].replace(/`/g, '').toLowerCase();
          capturing = wanted.some(label => title.includes(label));
        }
        if (capturing) out.push(line);
      }
      return out.join('\n').trim();
    }

    function atlasViewForId(id) {
      if (String(id).startsWith('surface.')) return 'surfaces';
      if (String(id).startsWith('entity.')) return 'entities';
      if (String(id).startsWith('flow.')) return 'flows';
      return 'overview';
    }

    function AtlasPanel({ activeWorkspace, agents, messages, qaLiveShots, onRescanAtlas, onResumeAtlas, onDiscardAtlasCandidate }) {
      const [content, setContent] = useState('');
      const [graph, setGraph] = useState(null);
      const [changelog, setChangelog] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [query, setQuery] = useState('');
      const [tocOpen, setTocOpen] = useState(true);
      const [activeView, setActiveView] = useState('overview');
      const [activeFilters, setActiveFilters] = useState([]);
      const [selectedAtlasId, setSelectedAtlasId] = useState(null);
      const [copiedAtlasValue, setCopiedAtlasValue] = useState(null);
      const [lightboxIndex, setLightboxIndex] = useState(null);
      const [askQuestion, setAskQuestion] = useState('');
      const [askBusy, setAskBusy] = useState(false);
      const [askError, setAskError] = useState(null);
      const [askHistory, setAskHistory] = useState([]);
      const [askComposerOpen, setAskComposerOpen] = useState(true);
      const bodyRef = useRef(null);

      const wsId = activeWorkspace?.id;
      const wsHasAtlas = !!(activeWorkspace?.atlasLastScanAt && activeWorkspace?.atlasProjectCwd);
      const atlasRun = activeWorkspace?.atlasRun;
      const atlasAgent = activeWorkspace?.atlasAgentId
        ? agents.find(a => a.id === activeWorkspace.atlasAgentId)
        : null;
      const atlasRunActive = atlasRun && (atlasRun.status === 'running' || atlasRun.status === 'validating');

      useEffect(() => {
        if (!wsId) return;
        try {
          const savedView = localStorage.getItem('atlas-view-' + wsId);
          if (ATLAS_VIEW_TABS.some(([id]) => id === savedView)) setActiveView(savedView);
          const savedToc = localStorage.getItem('atlas-toc-open-' + wsId);
          setTocOpen(savedToc === null ? true : savedToc === 'true');
          const savedAskHistory = JSON.parse(localStorage.getItem('atlas-ask-history-' + wsId) || '[]');
          const history = Array.isArray(savedAskHistory) ? savedAskHistory.slice(0, 8) : [];
          setAskHistory(history);
          setAskComposerOpen(history.length === 0);
        } catch {
          setAskHistory([]);
          setAskComposerOpen(true);
        }
        setAskQuestion('');
        setQuery('');
        setActiveFilters([]);
        setSelectedAtlasId(null);
        setLightboxIndex(null);
        setAskError(null);
      }, [wsId]);

      // Fetch atlas.md whenever the workspace changes or a scan completes.
      useEffect(() => {
        if (!wsId || !wsHasAtlas) { setContent(''); setGraph(null); setChangelog(''); setError(null); return; }
        let cancelled = false;
        setLoading(true);
        setError(null);
        fetch('/api/atlas/file?workspaceId=' + encodeURIComponent(wsId) + '&relPath=atlas.md')
          .then(r => { if (!r.ok) throw new Error('Failed to load atlas.md (' + r.status + ')'); return r.text(); })
          .then(text => { if (!cancelled) setContent(text); })
          .catch(e => { if (!cancelled) setError(e.message || String(e)); })
          .finally(() => { if (!cancelled) setLoading(false); });
        fetch('/api/atlas/file?workspaceId=' + encodeURIComponent(wsId) + '&relPath=atlas.json')
          .then(r => r.ok ? r.json() : null)
          .then(value => { if (!cancelled) setGraph(value); })
          .catch(() => { if (!cancelled) setGraph(null); });
        fetch('/api/atlas/file?workspaceId=' + encodeURIComponent(wsId) + '&relPath=changelog.md')
          .then(r => r.ok ? r.text() : '')
          .then(value => { if (!cancelled) setChangelog(value); })
          .catch(() => { if (!cancelled) setChangelog(''); });
        return () => { cancelled = true; };
      }, [wsId, activeWorkspace?.atlasLastScanAt]);

      // Rewrite `shots/foo.png` (in inline-code) to ![shots/foo.png](URL) so markdown
      // renders them as images via the /api/atlas/file endpoint.
      const rewritten = useMemo(() => {
        if (!content || !wsId) return content;
        return content.replace(/`(shots\/[^`]+\.png)`/g, (_, p) => {
          const url = atlasFileUrl(wsId, p);
          return '![' + p + '](' + url + ')';
        });
      }, [content, wsId]);

      const overview = useMemo(() => parseAtlasOverview(rewritten), [rewritten]);
      // Frontmatter drives the coverage strip but is metadata, not reader
      // content. Keep it out of the rendered document.
      const displayAtlas = useMemo(() => rewritten.replace(/^---\r?\n[\s\S]*?\r?\n---(?:\r?\n)?/, ''), [rewritten]);

      // Inject HTML anchor tags before each ##/### heading so TOC links land
      // precisely. We do this on the markdown text (not the parsed HTML)
      // because marked passes inline HTML through unchanged.
      const anchored = useMemo(() => {
        if (!displayAtlas) return displayAtlas;
        const slugCount = new Map();
        const lines = displayAtlas.split('\n');
        let inFence = false;
        const out = [];
        for (const line of lines) {
          if (/^```/.test(line)) { inFence = !inFence; out.push(line); continue; }
          if (!inFence) {
            const m = line.match(/^(##|###)\s+(.+?)\s*$/);
            if (m) {
              const headingText = m[2].replace(/`/g, '').replace(/^\d+\.\s*/, '');
              let slug = atlasSlug(headingText);
              if (slug) {
                const n = (slugCount.get(slug) || 0) + 1;
                slugCount.set(slug, n);
                if (n > 1) slug = slug + '-' + n;
                out.push('<a id="' + slug + '" class="atlas-anchor"></a>');
              }
            }
          }
          out.push(line);
        }
        return out.join('\n');
      }, [displayAtlas]);

      const filtered = useMemo(() => {
        if (!query.trim()) return anchored;
        // Simple filter: keep only sections (h2/h3 + body) that contain the query.
        const q = query.toLowerCase();
        const sections = anchored.split(/\n(?=##? )/);
        return sections.filter(s => s.toLowerCase().includes(q)).join('\n\n');
      }, [anchored, query]);

      const graphSurfaces = useMemo(() => atlasArray(graph?.surfaces), [graph]);
      const graphEntities = useMemo(() => atlasArray(graph?.entities), [graph]);
      const graphFlows = useMemo(() => atlasArray(graph?.flows), [graph]);
      const atlasIdSet = useMemo(() => new Set([
        ...graphSurfaces.map(item => item.id),
        ...graphEntities.map(item => item.id),
        ...graphFlows.map(item => item.id),
      ].filter(Boolean)), [graphSurfaces, graphEntities, graphFlows]);
      const surfaceMap = useMemo(() => new Map(graphSurfaces.map(item => [item.id, item])), [graphSurfaces]);
      const normalizedQuery = query.trim().toLowerCase();
      const filteredSurfaces = useMemo(() => graphSurfaces.filter(surface => {
        if (normalizedQuery && !atlasSearchText(surface).includes(normalizedQuery)) return false;
        const traits = atlasSurfaceTraits(surface, changelog);
        return activeFilters.every(filter => traits[filter]);
      }), [graphSurfaces, normalizedQuery, activeFilters, changelog]);
      const filteredEntities = useMemo(() => graphEntities.filter(entity =>
        !normalizedQuery || atlasSearchText(entity).includes(normalizedQuery)
      ), [graphEntities, normalizedQuery]);
      const filteredFlows = useMemo(() => graphFlows.filter(flow => {
        if (!normalizedQuery) return true;
        return atlasSearchText(flow).includes(normalizedQuery)
          || atlasSearchText(surfaceMap.get(flow.fromSurfaceId)).includes(normalizedQuery)
          || atlasSearchText(surfaceMap.get(flow.toSurfaceId)).includes(normalizedQuery);
      }), [graphFlows, normalizedQuery, surfaceMap]);
      const screenshotItems = useMemo(() => {
        const byPath = new Map();
        for (const surface of graphSurfaces) {
          for (const relPath of atlasArray(surface.screenshotRefs)) {
            if (typeof relPath !== 'string' || !relPath) continue;
            let item = byPath.get(relPath);
            if (!item) {
              item = { relPath, src: atlasFileUrl(wsId, relPath), surfaceIds: [], surfaceNames: [] };
              byPath.set(relPath, item);
            }
            item.surfaceIds.push(surface.id);
            item.surfaceNames.push(surface.name || surface.id);
          }
        }
        return Array.from(byPath.values());
      }, [graphSurfaces, wsId]);
      const filteredScreenshotItems = useMemo(() => {
        if (!normalizedQuery && activeFilters.length === 0) return screenshotItems;
        const visibleIds = new Set(filteredSurfaces.map(surface => surface.id));
        return screenshotItems.filter(item => item.surfaceIds.some(id => visibleIds.has(id)));
      }, [screenshotItems, filteredSurfaces, normalizedQuery, activeFilters]);
      const observedFindings = useMemo(() => atlasMarkdownSection(displayAtlas, ['observed inconsistencies']), [displayAtlas]);
      const openQuestions = useMemo(() => atlasMarkdownSection(displayAtlas, ['open questions']), [displayAtlas]);
      const changeFindings = useMemo(() => atlasMarkdownSection(displayAtlas, ['changes since last scan']), [displayAtlas]);
      const lightboxItem = lightboxIndex == null ? null : screenshotItems[lightboxIndex] || null;

      const changeView = useCallback((view) => {
        setActiveView(view);
        setQuery('');
        if (wsId) {
          try { localStorage.setItem('atlas-view-' + wsId, view); } catch {}
        }
      }, [wsId]);

      const toggleFilter = useCallback((filter) => {
        setActiveFilters(previous => {
          if (previous.includes(filter)) return previous.filter(item => item !== filter);
          const withoutOpposite = filter === 'verified'
            ? previous.filter(item => item !== 'gaps')
            : filter === 'gaps' ? previous.filter(item => item !== 'verified') : previous;
          return [...withoutOpposite, filter];
        });
      }, []);

      const toggleToc = useCallback(() => {
        setTocOpen(previous => {
          const next = !previous;
          if (wsId) {
            try { localStorage.setItem('atlas-toc-open-' + wsId, String(next)); } catch {}
          }
          return next;
        });
      }, [wsId]);

      const navigateAtlasId = useCallback((id) => {
        if (!id) return;
        changeView(atlasViewForId(id));
        setSelectedAtlasId(id);
        window.history.replaceState(null, '', window.location.pathname + window.location.search + '#atlas-item=' + encodeURIComponent(id));
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.getElementById('atlas-item-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }));
      }, [changeView]);

      const copyAtlasText = useCallback(async (value, stateKey) => {
        const showCopied = () => {
          setCopiedAtlasValue(stateKey);
          setTimeout(() => setCopiedAtlasValue(current => current === stateKey ? null : current), 1400);
        };
        try {
          if (!navigator.clipboard?.writeText) throw new Error('Clipboard API unavailable');
          await navigator.clipboard.writeText(value);
          showCopied();
        } catch {
          const textarea = document.createElement('textarea');
          textarea.value = value;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
          showCopied();
        }
      }, []);

      const copyAtlasLink = useCallback((id) => {
        const link = window.location.origin + window.location.pathname + window.location.search + '#atlas-item=' + encodeURIComponent(id);
        copyAtlasText(link, 'link:' + id);
      }, [copyAtlasText]);

      const openLightbox = useCallback((relPath) => {
        const index = screenshotItems.findIndex(item => item.relPath === relPath);
        if (index >= 0) setLightboxIndex(index);
      }, [screenshotItems]);

      const moveLightbox = useCallback((delta) => {
        setLightboxIndex(current => {
          if (current == null || screenshotItems.length === 0) return current;
          return (current + delta + screenshotItems.length) % screenshotItems.length;
        });
      }, [screenshotItems.length]);

      const askAtlas = useCallback(async (event) => {
        event.preventDefault();
        const question = askQuestion.trim();
        if (!question || !wsId || askBusy) return;
        setAskBusy(true);
        setAskError(null);
        try {
          const response = await fetch('/api/atlas/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ workspaceId: wsId, question }),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || 'Ask Atlas failed (' + response.status + ')');
          const entry = { ...result, question, askedAt: Date.now() };
          setAskHistory(previous => {
            const next = [entry, ...previous].slice(0, 8);
            try { localStorage.setItem('atlas-ask-history-' + wsId, JSON.stringify(next)); } catch {}
            return next;
          });
          setAskQuestion('');
          setAskComposerOpen(false);
        } catch (askFailure) {
          setAskError(askFailure.message || String(askFailure));
        } finally {
          setAskBusy(false);
        }
      }, [askQuestion, wsId, askBusy]);

      useEffect(() => {
        if (!atlasIdSet.size) return;
        const applyHash = () => {
          const match = window.location.hash.match(/^#atlas-item=(.+)$/);
          if (!match) return;
          let id;
          try { id = decodeURIComponent(match[1]); } catch { return; }
          if (!atlasIdSet.has(id)) return;
          setActiveView(atlasViewForId(id));
          setSelectedAtlasId(id);
          requestAnimationFrame(() => requestAnimationFrame(() => {
            document.getElementById('atlas-item-' + id)?.scrollIntoView({ block: 'start' });
          }));
        };
        applyHash();
        window.addEventListener('hashchange', applyHash);
        return () => window.removeEventListener('hashchange', applyHash);
      }, [atlasIdSet]);

      useEffect(() => {
        if (lightboxIndex == null) return;
        const handleKey = (event) => {
          if (event.key === 'Escape') setLightboxIndex(null);
          if (event.key === 'ArrowLeft') moveLightbox(-1);
          if (event.key === 'ArrowRight') moveLightbox(1);
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [lightboxIndex, moveLightbox]);

      const scrollToSlug = useCallback((slug) => {
        const root = bodyRef.current;
        if (!root) return;
        const el = root.querySelector('#' + CSS.escape(slug));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, []);

      const openAtlasImage = useCallback((image) => {
        const src = image && (image.currentSrc || image.getAttribute('src'));
        if (src) window.open(src, '_blank', 'noopener,noreferrer');
      }, []);

      const handleAtlasImageClick = useCallback((ev) => {
        const image = ev.target && ev.target.closest ? ev.target.closest('img') : null;
        if (!image || !ev.currentTarget.contains(image)) return;
        ev.preventDefault();
        openAtlasImage(image);
      }, [openAtlasImage]);

      const handleAtlasImageKeyDown = useCallback((ev) => {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        const image = ev.target && ev.target.closest ? ev.target.closest('img') : null;
        if (!image || !ev.currentTarget.contains(image)) return;
        ev.preventDefault();
        openAtlasImage(image);
      }, [openAtlasImage]);

      useEffect(() => {
        if (activeView !== 'document') return;
        const root = bodyRef.current;
        if (!root) return;
        root.querySelectorAll('img').forEach(image => {
          image.loading = 'lazy';
          image.decoding = 'async';
          image.tabIndex = 0;
          image.setAttribute('role', 'link');
          image.setAttribute('title', 'Open full-size image in a new tab');
          if (!image.getAttribute('aria-label')) {
            image.setAttribute('aria-label', (image.getAttribute('alt') || 'Atlas screenshot') + ' — open full-size image in a new tab');
          }
        });
      }, [filtered, loading, activeView]);

      const fmtAgo = (ms) => {
        if (ms < 60_000) return 'just now';
        if (ms < 60 * 60_000) return Math.round(ms / 60_000) + 'm ago';
        if (ms < 24 * 60 * 60_000) return Math.round(ms / (60 * 60_000)) + 'h ago';
        return Math.round(ms / (24 * 60 * 60_000)) + 'd ago';
      };

      if (!activeWorkspace) {
        return e('div', { className: 'atlas-panel' },
          e('div', { className: 'atlas-empty' }, 'No active workspace.')
        );
      }

      const runShots = atlasRun
        ? ((qaLiveShots && qaLiveShots[wsId]) || []).filter(shot =>
            (!shot.browserSessionId || shot.browserSessionId === atlasRun.browserSessionId)
            && shot.timestamp >= atlasRun.startedAt
          )
        : [];
      const runElapsedMs = atlasRunActive ? Date.now() - atlasRun.startedAt : 0;
      const atlasMsgs = atlasAgent ? ((messages && messages[atlasAgent.id]) || []) : [];
      const recentMsgs = atlasMsgs.slice(-4);
      const showRunBanner = atlasRun && ['running', 'validating', 'paused', 'failed'].includes(atlasRun.status);
      const runBanner = showRunBanner && e('div', { className: 'atlas-run-banner atlas-run-banner-' + atlasRun.status },
        e('div', { className: 'atlas-run-banner-head' },
          e('strong', null,
            atlasRun.status === 'running' ? 'Candidate scan in progress'
              : atlasRun.status === 'validating' ? 'Validating candidate'
                : atlasRun.status === 'paused' ? 'Candidate paused' : 'Candidate needs attention'
          ),
          atlasRunActive && e('span', null, runShots.length + ' shots · ' + Math.max(0, Math.floor(runElapsedMs / 60000)) + 'm'),
          !atlasRunActive && e('div', { className: 'atlas-run-actions' },
            e('button', { className: 'atlas-rescan-btn', onClick: () => onResumeAtlas(wsId) }, 'Resume'),
            e('button', {
              className: 'atlas-rescan-btn atlas-discard-btn',
              onClick: () => { if (confirm('Discard only this partial candidate? The published Atlas stays unchanged.')) onDiscardAtlasCandidate(wsId); },
            }, 'Discard candidate')
          )
        ),
        e('div', { className: 'atlas-run-summary' },
          atlasRunActive
            ? ((atlasRun.phase || 'Scanning') + '. The last published Atlas remains available below until this candidate passes validation.')
            : (atlasRun.error || 'The candidate was not published. Resume it or discard it; the last published Atlas is unchanged.')
        ),
        atlasRun.validationErrors && atlasRun.validationErrors.length > 0 && e('ul', { className: 'atlas-validation-errors' },
          atlasRun.validationErrors.slice(0, 6).map((message, index) => e('li', { key: index }, message)),
          atlasRun.validationErrors.length > 6 && e('li', null, '+' + (atlasRun.validationErrors.length - 6) + ' more validation issues')
        ),
        atlasRunActive && recentMsgs.length > 0 && e('div', { className: 'atlas-activity-feed atlas-activity-compact' },
          recentMsgs.map((m, i) => {
            const text = (m.content || '').replace(/\n?\[Using tool: [^\]]+\]\n?/g, '').trim();
            const preview = text.length > 180 ? text.slice(0, 180) + '...' : text;
            return e('div', { key: m.id || i, className: 'atlas-activity-msg atlas-activity-' + m.role }, preview || '(activity recorded)');
          })
        )
      );

      if (!wsHasAtlas) {
        return e('div', { className: 'atlas-panel' },
          e('div', { className: 'atlas-header' },
            e('div', { className: 'atlas-title' }, '🗺️ UI Atlas'),
            e('div', { className: 'atlas-status' }, atlasRunActive ? 'Building candidate' : 'Not built yet')
          ),
          runBanner,
          e('div', { className: 'atlas-empty' },
            e('div', null, 'No UI Atlas exists for this workspace.'),
            e('div', { style: { marginTop: 8, fontSize: 11, color: 'var(--text-muted)' } },
              activeWorkspace.testUrl
                ? 'Use the "Build UI Atlas" button on the workspace tab to start.'
                : 'Set a Test URL on this workspace first, then build an atlas.'
            )
          )
        );
      }

      const ageMs = Date.now() - (activeWorkspace.atlasLastScanAt || 0);
      const ageBucket = ageMs < 24 * 60 * 60_000 ? 'fresh'
        : ageMs < 7 * 24 * 60 * 60_000 ? 'aging'
        : 'stale';

      const totalVerified = overview.verifiedToday + overview.verified7d + overview.verifiedOlder;
      const totalCounted = totalVerified + overview.verifiedUnknown;
      const qaTouchedCount = activeWorkspace.qaSurfaceVerifications
        ? Object.keys(activeWorkspace.qaSurfaceVerifications).length
        : 0;
      const graphVerified = graphSurfaces.filter(surface => surface.status === 'verified').length;
      const graphPartial = graphSurfaces.filter(surface => surface.status === 'partial' || surface.status === 'unverified').length;
      const graphExcluded = graphSurfaces.filter(surface => surface.status === 'excluded').length;

      const coverageBits = [];
      if (graphSurfaces.length) coverageBits.push(graphSurfaces.length + ' surfaces');
      else if (overview.totalSurfaces != null) coverageBits.push(overview.totalSurfaces + ' surfaces');
      if (graphEntities.length) coverageBits.push(graphEntities.length + ' entities');
      else if (overview.totalEntities != null) coverageBits.push(overview.totalEntities + ' entities');
      if (graphSurfaces.length) {
        coverageBits.push(graphVerified + '/' + graphSurfaces.length + ' verified');
        if (graphPartial > 0) coverageBits.push(graphPartial + ' gaps');
        if (graphExcluded > 0) coverageBits.push(graphExcluded + ' excluded');
      } else if (totalCounted > 0) {
        coverageBits.push(totalVerified + '/' + totalCounted + ' verified');
      }

      } else {

    // Slash Commands Panel — list of pre-made prompts. Click to copy.
    function CommandsPanel({ commands }) {
      const [query, setQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [copiedId, setCopiedId] = useState(null);

      const categories = useMemo(() => {
        const set = new Set(commands.map(c => c.category || 'other'));
        return ['all', ...Array.from(set).sort()];
      }, [commands]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return commands.filter(c => {
          if (activeCategory !== 'all' && (c.category || 'other') !== activeCategory) return false;
          if (!q) return true;
          return (
            c.command.toLowerCase().includes(q) ||
            c.name.toLowerCase().includes(q) ||
            (c.description || '').toLowerCase().includes(q)
          );
        });
      }, [commands, query, activeCategory]);

      const copyToClipboard = (cmd) => {
        const text = expandSlashTemplate(cmd.promptTemplate);
        const showCopied = () => {
          setCopiedId(cmd._id);
          setTimeout(() => setCopiedId(prev => prev === cmd._id ? null : prev), 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            try {
              const ta = document.createElement('textarea');
              ta.value = text;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              showCopied();
            } catch (err) {
              console.error('Copy failed:', err);
            }
          });
        }
      };

      return e('div', { className: 'commands-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Slash Commands'),
          e('span', { className: 'commands-count' }, filtered.length + '/' + commands.length)
        ),
        e('div', { className: 'commands-search-row' },
          e('input', {
            className: 'commands-search',
            value: query,
            onChange: (ev) => setQuery(ev.target.value),
            placeholder: 'Search commands...',
          })
        ),
        e('div', { className: 'commands-categories' },
          categories.map(cat =>
            e('button', {
              key: cat,
              className: 'commands-cat-chip' + (activeCategory === cat ? ' active' : ''),
              onClick: () => setActiveCategory(cat),
              title: cat,
            }, cat)
          )
        ),
        e('div', { className: 'commands-list' },
          filtered.length === 0
            ? e('div', { className: 'commands-empty' }, 'No commands match your search.')
            : filtered.map(cmd =>
                e('div', {
                  key: cmd._id,
                  className: 'command-item',
                  onClick: () => copyToClipboard(cmd),
                  title: 'Click to copy the prompt',
                },
                  e('div', { className: 'command-item-row' },
                    e('span', { className: 'command-slug' }, '/' + cmd.command),
                    e('span', { className: 'command-name' }, cmd.name),
                    e('span', { className: 'command-copy-state' }, copiedId === cmd._id ? 'Copied!' : 'Copy')
                  ),

                )

    // Emulators Panel — with default simulator setting (Feature 9)
    function EmulatorsPanel({ settings, onUpdateSettings }) {
      const [devices, setDevices] = useState({});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [actionMsg, setActionMsg] = useState(null);

      const loadDevices = useCallback(() => {
        setLoading(true);
        setError(null);
        fetch('/api/simulators').then(r => r.json()).then(data => {
          if (data.error) {
            setError(data.error);
            setDevices({});
          } else {
            setDevices(data.devices || {});
          }
          setLoading(false);
        }).catch(err => {
          setError('Failed to fetch simulators');
          setLoading(false);
        });
      }, []);

      useEffect(() => { loadDevices(); }, [loadDevices]);

      const simAction = (endpoint, udid) => {
        setActionMsg('Working...');
        fetch('/api/simulators/' + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ udid })
        }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? 'Done' : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 2000);
          loadDevices();
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      const cleanDerived = () => {
        if (!confirm('Delete all Xcode Derived Data? This is safe but builds will need to recompile.')) return;
        setActionMsg('Cleaning...');
        fetch('/api/simulators/clean-derived-data', { method: 'POST' }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? 'Cleaned!' : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 3000);
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      // Group and filter out empty runtimes
      const runtimes = Object.entries(devices)
        .filter(([_, devs]) => devs.length > 0)
        .sort(([a], [b]) => a.localeCompare(b));

      return e('div', { className: 'emu-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Emulators'),
          e('div', { className: 'sidebar-header-actions' },
            e('button', { className: 'sidebar-btn', onClick: loadDevices, title: 'Refresh' }, '\u21BB')
          )
        ),
        e('div', { className: 'emu-toolbar' },
          e('button', { className: 'btn btn-danger btn-sm', onClick: cleanDerived }, 'Clean Derived Data'),
          actionMsg && e('span', { style: { fontSize: 11, color: 'var(--text-secondary)' } }, actionMsg)
        ),
        e('div', { className: 'emu-list' },
          loading && e('div', { className: 'emu-msg' }, 'Loading simulators...'),
          error && e('div', { className: 'emu-msg' }, error),
          !loading && !error && runtimes.length === 0 && e('div', { className: 'emu-msg' }, 'No simulators found. Is Xcode installed?'),
          runtimes.map(([runtime, devs]) =>
            e('div', { key: runtime, className: 'emu-runtime' },
              e('div', { className: 'emu-runtime-header' }, runtime.replace('com.apple.CoreSimulator.SimRuntime.', '').replace(/-/g, ' ')),
              devs.map(dev =>
                e('div', { key: dev.udid, className: 'emu-device' },
                  e('button', { className: 'emu-default-btn' + (settings?.defaultSimulatorUdid === dev.udid ? ' is-default' : ''), onClick: () => onUpdateSettings({ defaultSimulatorUdid: dev.udid, defaultSimulatorName: dev.name }), title: settings?.defaultSimulatorUdid === dev.udid ? 'Current default' : 'Set as default' }, settings?.defaultSimulatorUdid === dev.udid ? '\u2605' : '\u2606'),
                  e('span', { className: 'emu-device-name' }, dev.name),
                  e('span', { className: 'emu-device-state ' + (dev.state === 'Booted' ? 'emu-state-booted' : 'emu-state-shutdown') }, dev.state),
                  e('div', { className: 'emu-device-actions' },
                    dev.state !== 'Booted'
                      ? e('button', { className: 'btn btn-sm btn-secondary', onClick: () => simAction('boot', dev.udid) }, 'Boot')
                      : e('button', { className: 'btn btn-sm btn-secondary', onClick: () => simAction('shutdown', dev.udid) }, 'Stop'),
                    e('button', { className: 'btn btn-sm btn-secondary', onClick: () => { if (confirm('Erase all data on ' + dev.name + '?')) simAction('erase', dev.udid); } }, 'Erase')
                  )
                )
              )
            )
          )
        )
      );
    }

    // Plans Panel (Feature 1)
    // Token usage panel — dense cross-provider usage dashboard. The server
    // (usage.service) computes the full report (time windows × agent/model
    // breakdowns × daily rows); the client only filters and renders.
    // Tokens-only by design (cost numbers are unreliable since only Claude
    // reports them). Series colors live in --chart-claude/--chart-codex and
    // were validated for CVD separation + contrast on the dark surface.
    const TOKEN_WINDOWS = [
      { key: 'today',   label: 'Today' },
      { key: 'days7',   label: '7d' },
      { key: 'days30',  label: '30d' },
      { key: 'month',   label: 'Month' },
      { key: 'allTime', label: 'All' },
    ];
    const TOKEN_VIEWS = [
      { key: 'overview', label: 'Overview' },
      { key: 'agents',   label: 'Agents' },
      { key: 'models',   label: 'Models' },
      { key: 'daily',    label: 'Daily' },
      { key: 'machines', label: 'Machines' },
    ];
    const PROVIDER_META = {
      claude: { name: 'Claude', icon: '✦', color: 'var(--chart-claude)' },
      codex:  { name: 'Codex',  icon: '⚙', color: 'var(--chart-codex)' },
    };

    function tokensRelTime(ts) {
      if (!ts) return 'never';
      const m = Math.round((Date.now() - ts) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.round(h / 24) + 'd ago';
    }

    function TokensPanel({ report }) {
      const [windowKey, setWindowKey] = useState('today');
      const [view, setView] = useState('overview');
      const [scope, setScope] = useState('current');
      const [expandedProjects, setExpandedProjects] = useState(new Set());

      if (!report || !report.windows) {
        return e('div', { className: 'tokens-panel' },
          e('div', { className: 'tokens-header' }, e('span', null, 'Token usage')),
          e('div', { className: 'tokens-empty' }, 'No usage data yet. Send a turn and this panel will populate.')
        );
      }

      const scopedReport = scope === 'current' ? (report.currentMachine || report) : report;
      const win = scopedReport.windows[windowKey] || scopedReport.windows.today;
      const sum = win.summary;
      const stats = win.stats;
      const fmt = (n) => formatTokens(n || 0);
      const bucketTotal = (b) => (b.inputTokens || 0) + (b.outputTokens || 0);
      const trackingDate = scopedReport.trackingStartedAt
        ? new Date(scopedReport.trackingStartedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
        : null;
      const exportUsage = (format) => {
        const a = document.createElement('a');
        a.href = '/api/usage/export?format=' + format + '&scope=' + encodeURIComponent(scope);
        a.download = '';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      // --- shared sub-renders ---

      const statTile = (value, label, title) =>
        e('div', { className: 'tokens-stat', key: label, title: title || undefined },
          e('div', { className: 'tokens-stat-value' }, value),
          e('div', { className: 'tokens-stat-label' }, label)
        );

      const shareSection = () => {
        const cTok = bucketTotal(sum.claude);
        const xTok = bucketTotal(sum.codex);
        const total = cTok + xTok;
        const legendRow = (kind, tok, turns) => {
          const meta = PROVIDER_META[kind];
          return e('div', { className: 'tokens-legend-row', key: kind },
            e('span', { className: 'tokens-swatch', style: { background: meta.color } }),
            e('span', { className: 'tokens-legend-name' }, meta.icon + ' ' + meta.name),
            e('span', { className: 'tokens-legend-val' }, tok > 0 ? fmt(tok) + ' · ' + turns + ' turns' : '—'),
