    // Emulators Panel — with default simulator setting (Feature 9)
    function EmulatorsPanel({ settings, onUpdateSettings }) {
      const [devices, setDevices] = useState({});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [actionMsg, setActionMsg] = useState(null);

      const loadDevices = useCallback(() => {
        setLoading(true);
        setError(null);
        fetch('/api/simulators').then(r => r.json()).then(data => {
          if (data.error) {
            setError(data.error);
            setDevices({});
          } else {
            setDevices(data.devices || {});
          }
          setLoading(false);
        }).catch(err => {
          setError('Failed to fetch simulators');
          setLoading(false);
        });
      }, []);

      useEffect(() => { loadDevices(); }, [loadDevices]);

      const simAction = (endpoint, udid) => {
        setActionMsg('Working...');
        fetch('/api/simulators/' + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ udid })
        }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? 'Done' : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 2000);
          loadDevices();
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      const cleanDerived = () => {
        if (!confirm('Delete all Xcode Derived Data? This is safe but builds will need to recompile.')) return;
        setActionMsg('Cleaning...');
        fetch('/api/simulators/clean-derived-data', { method: 'POST' }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? 'Cleaned!' : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 3000);
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      // Group and filter out empty runtimes
      const runtimes = Object.entries(devices)
        .filter(([_, devs]) => devs.length > 0)
        .sort(([a], [b]) => a.localeCompare(b));

      return e('div', { className: 'emu-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Emulators'),
          e('div', { className: 'sidebar-header-actions' },
            e('button', { className: 'sidebar-btn', onClick: loadDevices, title: 'Refresh' }, '\u21BB')
          )
        ),
        e('div', { className: 'emu-toolbar' },
          e('button', { className: 'btn btn-danger btn-sm', onClick: cleanDerived }, 'Clean Derived Data'),
          actionMsg && e('span', { style: { fontSize: 11, color: 'var(--text-secondary)' } }, actionMsg)
        ),
        e('div', { className: 'emu-list' },
          loading && e('div', { className: 'emu-msg' }, 'Loading simulators...'),
          error && e('div', { className: 'emu-msg' }, error),
          !loading && !error && runtimes.length === 0 && e('div', { className: 'emu-msg' }, 'No simulators found. Is Xcode installed?'),
          runtimes.map(([runtime, devs]) =>
            e('div', { key: runtime, className: 'emu-runtime' },
              e('div', { className: 'emu-runtime-header' }, runtime.replace('com.apple.CoreSimulator.SimRuntime.', '').replace(/-/g, ' ')),
              devs.map(dev =>
                e('div', { key: dev.udid, className: 'emu-device' },
                  e('button', { className: 'emu-default-btn' + (settings?.defaultSimulatorUdid === dev.udid ? ' is-default' : ''), onClick: () => onUpdateSettings({ defaultSimulatorUdid: dev.udid, defaultSimulatorName: dev.name }), title: settings?.defaultSimulatorUdid === dev.udid ? 'Current default' : 'Set as default' }, settings?.defaultSimulatorUdid === dev.udid ? '\u2605' : '\u2606'),
                  e('span', { className: 'emu-device-name' }, dev.name),
                  e('span', { className: 'emu-device-state ' + (dev.state === 'Booted' ? 'emu-state-booted' : 'emu-state-shutdown') }, dev.state),
                  e('div', { className: 'emu-device-actions' },
                    dev.state !== 'Booted'
                      ? e('button', { className: 'btn btn-sm btn-secondary', onClick: () => simAction('boot', dev.udid) }, 'Boot')
                      : e('button', { className: 'btn btn-sm btn-secondary', onClick: () => simAction('shutdown', dev.udid) }, 'Stop'),
                    e('button', { className: 'btn btn-sm btn-secondary', onClick: () => { if (confirm('Erase all data on ' + dev.name + '?')) simAction('erase', dev.udid); } }, 'Erase')
                  )
                )
              )
            )
          )
        )
      );
    }

    // Documents Panel (Feature 1)
    function DocumentsPanel({ documents, agents, onCreateDocument, onUpdateDocument, onDeleteDocument }) {
      const [activeDocId, setActiveDocId] = useState(null);
      const [creating, setCreating] = useState(false);
      const [editTitle, setEditTitle] = useState('');
      const [editContent, setEditContent] = useState('');
      const [editAgentId, setEditAgentId] = useState('');
      const [showEditor, setShowEditor] = useState(false);
      const saveTimerRef = useRef(null);

      const activeDoc = documents.find(d => d.id === activeDocId);

      useEffect(() => {
        if (activeDoc) {
          setEditTitle(activeDoc.title);
          setEditContent(activeDoc.content);
          setEditAgentId(activeDoc.agentId || '');
        }
      }, [activeDocId]);

      const handleCreate = () => {
        setCreating(true);
        setActiveDocId(null);
        setEditTitle('');
        setEditContent('');
        setEditAgentId('');
        setShowEditor(true);
      };

      const handleSaveNew = () => {
        if (editTitle.trim()) {
          onCreateDocument(editTitle.trim(), editContent, editAgentId || undefined);
          setCreating(false);
          setShowEditor(false);
        }
      };

      // Auto-save on content change (debounced 500ms)
      const handleContentChange = (val) => {
        setEditContent(val);
        if (!creating && activeDoc) {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
          saveTimerRef.current = setTimeout(() => {
            onUpdateDocument(activeDoc.id, { content: val, lastEditedBy: 'user' });
          }, 500);
        }
      };

      const handleTitleBlur = () => {
        if (!creating && activeDoc && editTitle.trim()) {
          onUpdateDocument(activeDoc.id, { title: editTitle.trim(), lastEditedBy: 'user' });
        }
      };

      const handleAgentChange = (val) => {
        setEditAgentId(val);
        if (!creating && activeDoc) {
          onUpdateDocument(activeDoc.id, { agentId: val || null, lastEditedBy: 'user' });
        }
      };

      const handleDelete = (id) => {
        if (confirm('Delete this document?')) {
          onDeleteDocument(id);
          if (activeDocId === id) { setActiveDocId(null); setShowEditor(false); }
        }
      };

      const openDoc = (id) => {
        setActiveDocId(id);
        setCreating(false);
        setShowEditor(true);
      };

      const previewHtml = useMemo(() => {
        try { return marked.parse(editContent || ''); } catch { return editContent; }
      }, [editContent]);

      // List view in sidebar
      const listView = e('div', { className: 'docs-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Documents'),
          e('div', { className: 'sidebar-header-actions' },
            e('button', { className: 'sidebar-btn', onClick: handleCreate, title: 'New document' }, '+')
          )
        ),
        e('div', { className: 'docs-list' },
          documents.length === 0
            ? e('div', { style: { padding: 12, color: 'var(--text-muted)', fontSize: 12, textAlign: 'center' } }, 'No documents yet. Documents tagged to an agent are injected into its prompt.')
            : documents.map(doc =>
                e('div', { key: doc.id, className: 'doc-item' + (activeDocId === doc.id ? ' active' : ''), onClick: () => openDoc(doc.id) },
                  e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                    e('div', { className: 'doc-title' }, doc.title),
                    e('button', { className: 'agent-delete-btn', style: { opacity: 1, fontSize: 11 }, onClick: (ev) => { ev.stopPropagation(); handleDelete(doc.id); } }, '\u00D7')
                  ),
                  e('div', { className: 'doc-meta' },
                    'by ' + doc.lastEditedBy + ' \u2014 ' + new Date(doc.updatedAt).toLocaleDateString(),
                    doc.agentId && ' \u2014 Agent: ' + (agents.find(a => a.id === doc.agentId)?.name || 'Unknown')
                  )
                )
              )
        )
      );

      // Editor modal overlay
      const editorModal = showEditor && e('div', { className: 'doc-editor-modal', onClick: (ev) => { if (ev.target === ev.currentTarget) { setShowEditor(false); setCreating(false); } } },
        e('div', { className: 'doc-editor' },
          e('div', { className: 'doc-editor-header' },
            e('input', { value: editTitle, onChange: (ev) => setEditTitle(ev.target.value), onBlur: handleTitleBlur, placeholder: 'Document title...', autoFocus: creating }),
            e('select', { value: editAgentId, onChange: (ev) => handleAgentChange(ev.target.value), style: { background: 'var(--bg-tertiary)', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text-primary)', fontSize: 12, padding: '4px 8px' } },
              e('option', { value: '' }, 'No agent (global)'),
              agents.map(a => e('option', { key: a.id, value: a.id }, a.name))
            ),
            e('button', { className: 'btn btn-secondary btn-sm', onClick: () => { setShowEditor(false); setCreating(false); } }, 'Close')
          ),
          e('div', { className: 'doc-editor-body' },
            e('textarea', { value: editContent, onChange: (ev) => handleContentChange(ev.target.value), placeholder: 'Write markdown content...' }),
            e('div', { className: 'doc-editor-preview', dangerouslySetInnerHTML: { __html: previewHtml } })
          ),
          e('div', { className: 'doc-editor-footer' },
            creating
              ? e(React.Fragment, null,
                  e('button', { className: 'btn btn-secondary btn-sm', onClick: () => { setShowEditor(false); setCreating(false); } }, 'Cancel'),
                  e('div', { style: { flex: 1 } }),
                  e('button', { className: 'btn btn-primary btn-sm', onClick: handleSaveNew, disabled: !editTitle.trim() }, 'Create')
                )
              : e(React.Fragment, null,
                  e('span', { style: { fontSize: 11, color: 'var(--text-muted)' } }, 'Auto-saved'),
                  e('div', { style: { flex: 1 } }),
                  activeDoc && e('span', { style: { fontSize: 11, color: 'var(--text-muted)' } }, 'Last edited by ' + activeDoc.lastEditedBy)
                )
          )
        )
      );

      return e(React.Fragment, null, listView, editorModal);
    }

    // ======================== MAIN APP ========================

    // Token formatting helper
    function formatTokens(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return Math.round(n / 1000) + 'k';
      return String(n);
    }

    function App() {
      const ws = useWebSocket();
      const { connected, agents, messages, liveOutput, queued, sharedContext, fileChanges, thinkingOutput, notes, kanbanItems, kanbanBoards, documents, settings, workspaces, statusStartTimes, tokenUsage } = ws;
      const [showModal, setShowModal] = useState(false);
      const [showSharedContext, setShowSharedContext] = useState(false);
      const [showBroadcast, setShowBroadcast] = useState(false);
      const [broadcastInput, setBroadcastInput] = useState('');
      const [sidebarTab, setSidebarTab] = useState('agents');
      // Feature 2: Collapsible panels
      const [minimizedAgents, setMinimizedAgents] = useState(new Set());
      const [unreadCounts, setUnreadCounts] = useState({});
      // Feature 2: Escape focused agent
      const [focusedAgentId, setFocusedAgentId] = useState(null);
      // Feature 4: Maximize panel
      const [maximizedAgent, setMaximizedAgent] = useState(null);
      // Feature 6: Edit agent
      const [editingAgent, setEditingAgent] = useState(null);
      // Feature 8: Selective broadcast
      const [broadcastTargets, setBroadcastTargets] = useState(new Set());

      // Derive active workspace and grid settings from server-owned workspace
      const activeWorkspace = workspaces.find(w => w.id === settings.activeWorkspaceId) || workspaces[0];
      const columns = activeWorkspace ? activeWorkspace.gridColumns : 2;
      const rows = activeWorkspace ? activeWorkspace.gridRows : 2;
      const selectedAgents = activeWorkspace ? activeWorkspace.selectedAgentIds.filter(id => agents.some(a => a.id === id)) : [];

      // Agents for the active workspace
      const workspaceAgents = activeWorkspace ? agents.filter(a => a.workspaceId === activeWorkspace.id) : [];

      // Fetch home path for folder browser defaults
      useEffect(() => {
        fetch('/api/directories').then(r => r.json()).then(data => {
          if (data.home) window.__HOME_PATH = data.home;
        }).catch(() => {});
      }, []);

      // Track unread messages for minimized agents (Feature 2)
      const prevMessagesRef = useRef({});
      useEffect(() => {
        for (const [agentId, msgs] of Object.entries(messages)) {
          const prevLen = prevMessagesRef.current[agentId] || 0;
          const newLen = (msgs || []).length;
          if (newLen > prevLen && minimizedAgents.has(agentId)) {
            setUnreadCounts(prev => ({ ...prev, [agentId]: (prev[agentId] || 0) + (newLen - prevLen) }));
          }
          prevMessagesRef.current[agentId] = newLen;
        }
      }, [messages, minimizedAgents]);

      // Feature 8: Auto-sync broadcast targets with agents list
      useEffect(() => {
        setBroadcastTargets(prev => {
          const next = new Set(prev);
          // Add new agents
          agents.forEach(a => { if (!next.has(a.id)) next.add(a.id); });
          // Remove deleted agents
          for (const id of next) {
            if (!agents.some(a => a.id === id)) next.delete(id);
          }
          return next;
        });
      }, [agents]);

      // Global keyboard shortcuts
      useEffect(() => {
        const handler = (ev) => {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'n') {
            ev.preventDefault();
            setEditingAgent(null);
            setShowModal(true);
          }
          if (ev.key === 'Escape') {
            // Priority chain: 1) un-maximize, 2) stop focused agent, 3) do nothing
            if (maximizedAgent) {
              setMaximizedAgent(null);
            } else if (focusedAgentId) {
              const focused = agents.find(a => a.id === focusedAgentId);
              if (focused && (focused.status === 'working' || focused.status === 'thinking')) {
                ws.stopAgent(focusedAgentId);
              }
            }
          }
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'b') {
            ev.preventDefault();
            setShowBroadcast(prev => !prev);
          }
          // Ctrl+M / Cmd+M toggles maximize on focused agent
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'm') {
            ev.preventDefault();
            if (maximizedAgent) {
              setMaximizedAgent(null);
            } else if (focusedAgentId) {
              setMaximizedAgent(focusedAgentId);
            }
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [agents, ws, focusedAgentId, maximizedAgent]);

      const totalPanels = columns * rows;
      const displayAgents = [...selectedAgents];
      // Auto-fill remaining slots with workspace agents not yet selected
      workspaceAgents.forEach(agent => {
        if (!displayAgents.includes(agent.id) && displayAgents.length < totalPanels) {
          displayAgents.push(agent.id);
        }
      });

      // Split into minimized and non-minimized
      const minimizedDisplayAgents = displayAgents.filter(id => minimizedAgents.has(id));

      const handleMinimize = (agentId) => {
        setMinimizedAgents(prev => { const next = new Set(prev); next.add(agentId); return next; });
      };
      const handleRestore = (agentId) => {
        setMinimizedAgents(prev => { const next = new Set(prev); next.delete(agentId); return next; });
        setUnreadCounts(prev => { const n = { ...prev }; delete n[agentId]; return n; });
      };
      // Feature 4: Toggle maximize
      const handleToggleMaximize = (agentId) => {
        setMaximizedAgent(prev => prev === agentId ? null : agentId);
      };

      // Grid uses user-chosen columns/rows — override when maximized
      const gridStyle = maximizedAgent
        ? { gridTemplateColumns: '1fr', gridTemplateRows: '1fr' }
        : { gridTemplateColumns: 'repeat(' + columns + ', 1fr)', gridTemplateRows: 'repeat(' + rows + ', 1fr)' };

      // Feature 3: Cost dashboard — aggregate all token usage
      const costDashboard = useMemo(() => {
        let totalCost = 0, totalTokens = 0, totalTurns = 0;
        for (const usage of Object.values(tokenUsage)) {
          if (usage) {
            totalCost += usage.totalCostUsd || 0;
            totalTokens += (usage.totalInputTokens || 0) + (usage.totalOutputTokens || 0);
            totalTurns += usage.numTurns || 0;
          }
        }
        return { totalCost, totalTokens, totalTurns };
      }, [tokenUsage]);

      const handleBroadcast = () => {
        const targets = Array.from(broadcastTargets);
        if (broadcastInput.trim() && targets.length > 0) {
          ws.broadcastMessage(targets, broadcastInput.trim());
          setBroadcastInput('');
        }
      };

      // Grid column/row changes go through updateWorkspace
      const setColumns = (n) => { if (activeWorkspace) ws.updateWorkspace(activeWorkspace.id, { gridColumns: n }); };
      const setRows = (n) => { if (activeWorkspace) ws.updateWorkspace(activeWorkspace.id, { gridRows: n }); };

      const toggleAgent = (agentId) => {
        if (!activeWorkspace) return;
        const current = activeWorkspace.selectedAgentIds;
        const updated = current.includes(agentId)
          ? current.filter(id => id !== agentId)
          : current.length < totalPanels ? [...current, agentId] : current;
        ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: updated });
      };

      // Activity bar tabs — Workspaces replaces Agents
      const tabs = [
        { id: 'agents', icon: ICONS.agents, label: 'Workspaces' },
        { id: 'notes', icon: ICONS.notes, label: 'Notes' },
        { id: 'documents', icon: ICONS.documents, label: 'Documents' },
        { id: 'emulators', icon: ICONS.emulators, label: 'Emulators' },
        { id: 'kanban', icon: ICONS.kanban, label: 'Kanban' },
      ];

      return e('div', { className: 'app' },
        // Activity Bar
        e('div', { className: 'activity-bar' },
          tabs.map(tab =>
            e('button', {
              key: tab.id,
              className: 'activity-bar-btn' + (sidebarTab === tab.id ? ' active' : ''),
              onClick: () => setSidebarTab(tab.id),
              title: tab.label
            }, e(Icon, { d: tab.icon, size: 20 }))
          ),
          e('div', { className: 'activity-bar-spacer' }),
          e('button', {
            className: 'activity-bar-btn activity-bar-bottom',
            onClick: () => setShowSharedContext(true),
            title: 'Settings'
          }, e(Icon, { d: ICONS.settings, size: 20 }))
        ),

        // Sidebar Panel
        e('div', { className: 'sidebar-panel' },
          sidebarTab === 'agents' && e(WorkspacesSidebar, {
            workspaces,
            agents,
            activeWorkspaceId: activeWorkspace ? activeWorkspace.id : null,
            onSelectWorkspace: (id) => ws.setActiveWorkspace(id),
            onCreateWorkspace: ws.createWorkspace,
            onDeleteWorkspace: ws.deleteWorkspace,
            onRenameWorkspace: (id, name) => ws.updateWorkspace(id, { name }),
            onNewAgent: () => { setEditingAgent(null); setShowModal(true); },
            onEditAgent: (agent) => { setEditingAgent(agent); setShowModal(true); },
            onRemoveAgent: ws.removeAgent,
            statusStartTimes,
          }),
          sidebarTab === 'notes' && e(NotesPanel, {
            notes,
            agents,
            onCreateNote: ws.createNote,
            onUpdateNote: ws.updateNote,
            onDeleteNote: ws.deleteNote,
          }),
          sidebarTab === 'documents' && e(DocumentsPanel, {
            documents,
            agents,
            onCreateDocument: ws.createDocument,
            onUpdateDocument: ws.updateDocument,
            onDeleteDocument: ws.deleteDocument,
          }),
          sidebarTab === 'emulators' && e(EmulatorsPanel, { settings, onUpdateSettings: ws.updateSettings }),
          sidebarTab === 'kanban' && e(KanbanPanel, {
            items: kanbanItems,
            boards: kanbanBoards,
            onCreateItem: ws.createKanbanItem,
            onUpdateItem: ws.updateKanbanItem,
            onDeleteItem: ws.deleteKanbanItem,
            onCreateBoard: ws.createKanbanBoard,
            onDeleteBoard: ws.deleteKanbanBoard,
          })
        ),

        // Main content
        e('div', { className: 'main-content' },
          !connected && e('div', { className: 'connection-error' }, 'Disconnected. Reconnecting...'),

          // Top bar
          e('div', { className: 'top-bar' },
            e('div', { className: 'top-bar-left' },
              activeWorkspace && e('span', { style: { fontWeight: 600, fontSize: 13, color: 'var(--text-primary)', marginRight: 8 } }, activeWorkspace.name),
              // Feature 3: Cost dashboard
              (costDashboard.totalCost > 0 || costDashboard.totalTurns > 0) && e('div', { className: 'cost-dashboard' },
                e('span', { className: 'cost-value' }, '$' + costDashboard.totalCost.toFixed(2) + ' total'),
                e('span', { className: 'cost-sep' }, '\u00B7'),
                e('span', null, formatTokens(costDashboard.totalTokens) + ' tokens'),
                e('span', { className: 'cost-sep' }, '\u00B7'),
                e('span', null, costDashboard.totalTurns + ' turns')
              ),
              // Feature 10: Broadcast toggle
              e('button', {
                className: 'broadcast-toggle' + (showBroadcast ? ' active' : ''),
                onClick: () => setShowBroadcast(prev => !prev),
                title: 'Toggle broadcast bar (Ctrl+B)'
              }, '\uD83D\uDCE2 Broadcast', agents.length > 0 && e('span', { style: { fontSize: 10, opacity: 0.7 } }, ' (' + agents.length + ')'))
            ),
            e('div', { className: 'top-bar-right' },
              e('div', { className: 'grid-controls' },
                e('span', { className: 'grid-label' }, 'Col'),
                e('div', { className: 'grid-buttons' },
                  [1,2,3,4].map(n => e('button', { key: n, className: 'grid-btn' + (columns === n ? ' active' : ''), onClick: () => setColumns(n) }, n))
                )
              ),
              e('div', { className: 'grid-controls' },
                e('span', { className: 'grid-label' }, 'Row'),
                e('div', { className: 'grid-buttons' },
                  [1,2,3].map(n => e('button', { key: n, className: 'grid-btn' + (rows === n ? ' active' : ''), onClick: () => setRows(n) }, n))
                )
              ),
            )
          ),

          // Broadcast bar (enhanced — Feature 10 + Feature 8)
          showBroadcast && e('div', { className: 'broadcast-bar-enhanced' },
            e('label', null, 'Broadcast'),
            // Feature 8: Selective broadcast chips
            e('div', { className: 'broadcast-chips' },
              agents.map(a => e('button', {
                key: a.id,
                className: 'broadcast-chip ' + (broadcastTargets.has(a.id) ? 'selected' : 'unselected'),
                onClick: () => setBroadcastTargets(prev => {
                  const next = new Set(prev);
                  if (next.has(a.id)) next.delete(a.id); else next.add(a.id);
                  return next;
                }),
              }, a.name)),
              e('span', { className: 'broadcast-chip-count' }, broadcastTargets.size + '/' + agents.length)
            ),
            e('input', {
              className: 'broadcast-input',
              value: broadcastInput,
              onChange: (ev) => setBroadcastInput(ev.target.value),
              onKeyDown: (ev) => {
                if (ev.key === 'Enter') handleBroadcast();
                if (ev.key === 'Escape') { ev.stopPropagation(); setShowBroadcast(false); }
              },
              placeholder: 'Send to selected agents... (Enter to send)',
              autoFocus: true
            }),
            e('button', { className: 'broadcast-send', onClick: handleBroadcast }, 'Send (' + broadcastTargets.size + ')')
          ),

          // Minimized panels bar (Feature 2)
          !maximizedAgent && minimizedDisplayAgents.length > 0 && e('div', { style: { flexShrink: 0 } },
            minimizedDisplayAgents.map(agentId => {
              const agent = agents.find(a => a.id === agentId);
              if (!agent) return null;
              return e('div', { key: agentId, className: 'panel-minimized', onClick: () => handleRestore(agentId) },
                e('span', { className: 'status-dot status-' + agent.status }),
                e('span', { className: 'panel-minimized-name' }, agent.name),
                unreadCounts[agentId] > 0 && e('span', { className: 'panel-unread-badge' }, unreadCounts[agentId]),
                e('button', { className: 'panel-btn', onClick: (ev) => { ev.stopPropagation(); handleRestore(agentId); }, title: 'Expand' }, '\u25A1')
              );
            })
          ),

          // Terminal grid — fill all col*row slots, skip minimized agents
          e('div', { className: 'terminal-grid', style: gridStyle },
            (() => {
              // When maximized, only show that agent
              if (maximizedAgent) {
                const agent = agents.find(a => a.id === maximizedAgent);
                if (!agent) return e('div', { key: 'empty-max', className: 'terminal-panel' }, e('div', { className: 'panel-content panel-empty' }, 'Agent not found'));
                return e(TerminalPanel, {
                  key: maximizedAgent,
                  agent,
                  messages: messages[maximizedAgent] || [],
                  liveOutput: liveOutput[maximizedAgent] || '',
                  queuedMessages: queued[maximizedAgent] || [],
                  fileChanges: fileChanges[maximizedAgent] || [],
                  thinkingOutput: thinkingOutput[maximizedAgent] || '',
                  statusStartTime: statusStartTimes[maximizedAgent],
                  tokenUsage: tokenUsage[maximizedAgent],
                  onSendMessage: (content) => ws.sendMessage(agent.id, content),
                  onSendImage: ws.sendImage,
                  onStop: ws.stopAgent,
                  onClearHistory: ws.clearHistory,
                  onClearFileChanges: ws.clearFileChanges,
                  onMinimize: null,
                  onMaximize: handleToggleMaximize,
                  isMaximized: true,
                  onFocus: setFocusedAgentId,
                  isFocused: focusedAgentId === maximizedAgent,
                });
              }
              const nonMinimized = displayAgents.filter(id => !minimizedAgents.has(id));
              return Array.from({ length: totalPanels }).map((_, i) => {
                const agentId = nonMinimized[i];
                const agent = agentId ? agents.find(a => a.id === agentId) : null;
                if (!agent) return e('div', { key: 'empty-' + i, className: 'terminal-panel slot-empty' },
                  e('button', { className: 'slot-add-btn', onClick: () => { setEditingAgent(null); setShowModal(true); } }, '+ Add Agent')
                );
                return e(TerminalPanel, {
                  key: agentId,
                  agent,
                  messages: messages[agentId] || [],
                  liveOutput: liveOutput[agentId] || '',
                  queuedMessages: queued[agentId] || [],
                  fileChanges: fileChanges[agentId] || [],
                  thinkingOutput: thinkingOutput[agentId] || '',
                  statusStartTime: statusStartTimes[agentId],
                  tokenUsage: tokenUsage[agentId],
                  onSendMessage: (content) => ws.sendMessage(agent.id, content),
                  onSendImage: ws.sendImage,
                  onStop: ws.stopAgent,
                  onClearHistory: ws.clearHistory,
                  onClearFileChanges: ws.clearFileChanges,
                  onMinimize: handleMinimize,
                  onMaximize: handleToggleMaximize,
                  isMaximized: false,
                  onFocus: setFocusedAgentId,
                  isFocused: focusedAgentId === agentId,
                });
              });
            })()
          )
        ),

        // Modals
        e(NewAgentModal, {
          isOpen: showModal,
          onClose: () => { setShowModal(false); setEditingAgent(null); },
          onCreate: ws.createAgent,
          editAgent: editingAgent,
          onUpdate: ws.updateAgent,
          workspaceId: activeWorkspace ? activeWorkspace.id : undefined,
        }),
        e(SharedContextModal, { isOpen: showSharedContext, onClose: () => setShowSharedContext(false), content: sharedContext, onSave: ws.updateSharedContext })
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
