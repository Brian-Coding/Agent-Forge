    // Slash Commands Panel — list of pre-made prompts. Click to copy.
    function CommandsPanel({ commands }) {
      const [query, setQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [copiedId, setCopiedId] = useState(null);

      const categories = useMemo(() => {
        const set = new Set(commands.map(c => c.category || 'other'));
        return ['all', ...Array.from(set).sort()];
      }, [commands]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return commands.filter(c => {
          if (activeCategory !== 'all' && (c.category || 'other') !== activeCategory) return false;
          if (!q) return true;
          return (
            c.command.toLowerCase().includes(q) ||
            c.name.toLowerCase().includes(q) ||
            (c.description || '').toLowerCase().includes(q)
          );
        });
      }, [commands, query, activeCategory]);

      const copyToClipboard = (cmd) => {
        const text = expandSlashTemplate(cmd.promptTemplate);
        const showCopied = () => {
          setCopiedId(cmd._id);
          setTimeout(() => setCopiedId(prev => prev === cmd._id ? null : prev), 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            try {
              const ta = document.createElement('textarea');
              ta.value = text;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              showCopied();
            } catch (err) {
              console.error('Copy failed:', err);
            }
          });
        }
      };

      return e('div', { className: 'commands-panel' },
        e('div', { className: 'sidebar-header' },
          e('span', null, 'Slash Commands'),

    // Emulators Panel — with default simulator setting (Feature 9)
    function EmulatorsPanel({ settings, onUpdateSettings }) {
      const [devices, setDevices] = useState({});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [actionMsg, setActionMsg] = useState(null);

      const loadDevices = useCallback(() => {
        setLoading(true);
        setError(null);
        fetch('/api/simulators').then(r => r.json()).then(data => {
          if (data.error) {
            setError(data.error);
            setDevices({});
          } else {
            setDevices(data.devices || {});
          }
          setLoading(false);
        }).catch(err => {
          setError('Failed to fetch simulators');
          setLoading(false);
        });
      }, []);

      useEffect(() => { loadDevices(); }, [loadDevices]);

      const simAction = (endpoint, udid) => {
        setActionMsg('Working...');
        fetch('/api/simulators/' + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ udid })
        }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? 'Done' : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 2000);
          loadDevices();
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      const cleanDerived = () => {
        if (!confirm('Move all Xcode Derived Data to Agent Forge quarantine? Builds will need to recompile, but the prior data remains recoverable.')) return;
        setActionMsg('Checking and quarantining...');
        fetch('/api/simulators/clean-derived-data', { method: 'POST' }).then(r => r.json()).then(data => {
          setActionMsg(data.ok ? (data.message || 'Quarantined') : (data.message || 'Failed'));
          setTimeout(() => setActionMsg(null), 8000);
        }).catch(() => {
          setActionMsg('Request failed');
          setTimeout(() => setActionMsg(null), 2000);
        });
      };

      // Group and filter out empty runtimes
      const runtimes = Object.entries(devices)
        .filter(([_, devs]) => devs.length > 0)
        .sort(([a], [b]) => a.localeCompare(b));

      return e('div', { className: 'emu-panel' },

          e('span', null, 'Emulators'),
          e('div', { className: 'sidebar-header-actions' },
            e('button', { className: 'sidebar-btn', onClick: loadDevices, title: 'Refresh' }, '\u21BB')
          )
        ),

          e('button', { className: 'btn btn-danger btn-sm', onClick: cleanDerived }, 'Quarantine Derived Data'),

    function tokensRelTime(ts) {
      if (!ts) return 'never';
      const m = Math.round((Date.now() - ts) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.round(h / 24) + 'd ago';
    }

    // Limits panel — provider rate-limit dashboard. Data sources (server-side
    // limits.service): Claude via the OAuth usage endpoint (statusline bridge
    // fallback); Codex via app-server account limits (rollout fallback).
    // Auto-refreshes every minute; the button forces a new read, including
    // clearing Claude 429 backoff. Meter color is a status encoding
    // (ok/warning/critical) and is always paired with the numeric %.
    function limitsFmtReset(ts) {
      if (!ts) return null;
      const ms = ts - Date.now();
      if (ms <= 0) return 'resets soon';
      const m = Math.round(ms / 60000);
      if (m < 60) return 'resets in ' + m + 'm';
      const h = Math.floor(m / 60);
      if (h < 48) return 'resets in ' + h + 'h ' + (m % 60) + 'm';
      return 'resets in ' + Math.round(h / 24) + 'd';
    }

    function limitsRelTime(ts) {
      if (!ts) return 'unknown';
      const m = Math.round((Date.now() - ts) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.round(h / 24) + 'd ago';
    }

    function LimitsMeter({ label, window }) {
      const pct = window && typeof window.usedPercent === 'number' ? window.usedPercent : null;
      const level = pct === null ? null : pct >= 85 ? 'crit' : pct >= 60 ? 'warn' : 'ok';
      const reset = window ? limitsFmtReset(window.resetsAt) : null;
      return e('div', { className: 'limits-meter' },
        e('div', { className: 'limits-meter-head' },
          e('span', { className: 'limits-meter-label' }, label),
          e('span', { className: 'limits-meter-pct' }, pct === null ? '—' : Math.round(pct) + '% used')
        ),
        e('div', { className: 'limits-meter-track' },
          pct !== null && e('div', { className: 'limits-meter-fill limits-' + level, style: { width: Math.max(2, Math.min(100, pct)) + '%' } })
        ),
        reset && e('div', { className: 'limits-meter-reset' }, reset)
      );
    }

      const statusMeta = {

      }[snap.status] || { label: snap.status.toUpperCase(), cls: 'limits-status-mut' };
      const hasData = snap.status === 'available' || snap.status === 'stale';
      return e('div', { className: 'limits-card' },
        e('div', { className: 'limits-card-head' },

    function LimitsPanel({ limits, onRefresh }) {
      // Re-render every 30s so "resets in"/"next refresh" countdowns stay honest.
      const [, forceTick] = useState(0);
      const [refreshing, setRefreshing] = useState(false);
      useEffect(() => {
        const id = setInterval(() => forceTick(t => t + 1), 30000);
        return () => clearInterval(id);
      }, []);
      const stamp = limits
        ? String(limits.providers?.claude?.checkedAt) + ':' + String(limits.providers?.codex?.checkedAt)
        : '';
      useEffect(() => { setRefreshing(false); }, [stamp]);
      useEffect(() => {
        if (!refreshing) return;
        const id = setTimeout(() => setRefreshing(false), 20000);
        return () => clearTimeout(id);
      }, [refreshing]);

      const nextIn = limits && limits.nextRefreshAt
        ? Math.max(0, Math.round((limits.nextRefreshAt - Date.now()) / 60000))
        : null;

      return e('div', { className: 'limits-panel' },
        e('div', { className: 'limits-header' },
          e('span', null, 'Limits'),
          e('button', {
            className: 'limits-refresh',
            disabled: refreshing,
            title: 'Re-read both providers now',
            onClick: () => {
              if (refreshing) return;
              setRefreshing(true);
              onRefresh();
            },
          }, refreshing ? 'Refreshing…' : '↻ Refresh')
        ),
        !limits
          ? e('div', { className: 'limits-detail', style: { padding: 12 } }, 'No limits data yet — first read happens at server start.')

            )
      );

      if (!limits?.providers) return null;

    // Token formatting helper
    function formatTokens(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return Math.round(n / 1000) + 'k';
      return String(n);

    function RuntimeTruthPill({ health }) {
      if (!health || !health.runtime) return null;
      const drift = health.runtime.drift || 'unknown';
      const label = drift === 'restart-required' ? 'Restart required'
        : drift === 'current' ? 'Runtime current'
        : 'Runtime unknown';
      const providers = (health.runtime.providers || []).map(provider => (
        provider.cliName + (provider.cliVersion ? ' ' + provider.cliVersion : provider.available ? '' : ' missing')
      )).join(' · ');
      const auth = (health.auth || []).map(snapshot => (
        snapshot.provider + ' ' + snapshot.state + ' (' + snapshot.reasonCode + ')'
      )).join(' · ');
      const title = [
        drift === 'restart-required'
          ? 'This window is talking to an older Agent Forge process than the files on disk.'
          : null,
        'session ' + health.runtime.serverSessionId,
        health.runtime.bunVersion ? 'bun ' + health.runtime.bunVersion : null,
        health.runtime.source && health.runtime.source.commit ? 'commit ' + String(health.runtime.source.commit).slice(0, 12) : null,
        providers || null,
        auth || null,
      ].filter(Boolean).join('\n');
      return e('span', { className: 'runtime-pill runtime-' + drift, title }, label);
    }

    function App() {
      const ws = useWebSocket();
      const { connected, agents, messages, liveOutput, queued, sharedContext, fileChanges, thinkingOutput, agentActivity, liveTurnState, settings, workspaces, activeWorkspaceId, statusStartTimes, tokenUsage, usageReport, terminals, terminalOutput, errorToasts } = ws;
      const [runtimeHealth, setRuntimeHealth] = useState(null);
      useEffect(() => {
        if (!connected) return;
        let cancelled = false;
        const load = () => {
          fetch('/api/health')
            .then(response => response.ok ? response.json() : null)
            .then(data => { if (!cancelled && data) setRuntimeHealth(data); })
            .catch(() => {});
        };
        load();
        const timer = setInterval(load, 30000);
        return () => { cancelled = true; clearInterval(timer); };
      }, [connected]);
      const [showModal, setShowModal] = useState(false);
      const [showSharedContext, setShowSharedContext] = useState(false);
      const [sidebarTab, setSidebarTab] = useState('agents');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [sidebarWidth, setSidebarWidth] = useState(settings.sidebarWidth || 240);
      const [isResizing, setIsResizing] = useState(false);
      const sidebarResizeRef = useRef(null);
      // Feature 2: Collapsible panels
      const [minimizedAgents, setMinimizedAgents] = useState(new Set());
      const [unreadCounts, setUnreadCounts] = useState({});
      // Feature 2: Escape focused agent
      const [focusedAgentId, setFocusedAgentId] = useState(null);
      // Feature 4: Maximize panel
      const [maximizedAgent, setMaximizedAgent] = useState(null);
      // Feature 6: Edit agent
      const [editingAgent, setEditingAgent] = useState(null);
      // Drag-to-rearrange
      const [draggedAgent, setDraggedAgent] = useState(null);
      const [dragOverSlot, setDragOverSlot] = useState(null);

      // Workspace choice is local to this browser, so another tab or automated
      // browser cannot move the viewport. Workspace grid settings remain shared.
      const activeWorkspace = workspaces.find(w => w.id === activeWorkspaceId) || workspaces[0];
      const columns = activeWorkspace ? activeWorkspace.gridColumns : 2;
      const rows = activeWorkspace ? activeWorkspace.gridRows : 2;
      const totalPanels = columns * rows;

      // Agents for the active workspace
      const workspaceAgents = activeWorkspace ? agents.filter(a => a.workspaceId === activeWorkspace.id) : [];
      const workspaceAgentIds = workspaceAgents.map(a => a.id);
      const workspaceAgentIdSet = new Set(workspaceAgentIds);
      const workspaceAgentIdsKey = workspaceAgentIds.join('|');
      const minimizedStorageKey = activeWorkspace ? `agent-forge:minimized-agents:${activeWorkspace.id}` : null;
      const minimizedWorkspaceRef = useRef(null);

      const sameSlots = (a, b) => a.length === b.length && a.every((id, i) => id === b[i]);
      const normalizeGridSlots = (rawIds, excludedIds = minimizedAgents) => {
        const slots = Array.from({ length: totalPanels }, () => '');
        const lockedIds = activeWorkspace ? activeWorkspace.lockedAgentIds || [] : [];
        const seen = new Set();

        (rawIds || []).forEach((id, idx) => {
          if (!id || idx >= totalPanels || !lockedIds.includes(id) || !workspaceAgentIdSet.has(id) || excludedIds.has(id) || seen.has(id)) return;
          slots[idx] = id;
          seen.add(id);
        });

        const candidates = [];
        for (const id of rawIds || []) {
          if (!id || lockedIds.includes(id) || !workspaceAgentIdSet.has(id) || excludedIds.has(id) || seen.has(id)) continue;
          candidates.push(id);
          seen.add(id);
        }
        for (const id of workspaceAgentIds) {
          if (excludedIds.has(id) || seen.has(id)) continue;
          candidates.push(id);
          seen.add(id);
        }

        let nextCandidate = 0;
        for (let i = 0; i < slots.length && nextCandidate < candidates.length; i++) {
          if (!slots[i]) slots[i] = candidates[nextCandidate++];
        }
        return slots;
      };

      // Sync sidebar width from server settings on first load
      const sidebarWidthSynced = useRef(false);
      useEffect(() => {
        if (settings.sidebarWidth && !sidebarWidthSynced.current) {
          setSidebarWidth(settings.sidebarWidth);
          sidebarWidthSynced.current = true;
        }
      }, [settings.sidebarWidth]);

      // Sidebar resize handler
      useEffect(() => {
        if (!isResizing) return;
        const onMouseMove = (ev) => {
          const newWidth = Math.max(180, Math.min(500, ev.clientX - 48)); // 48 = activity bar width
          setSidebarWidth(newWidth);
        };
        const onMouseUp = () => {
          setIsResizing(false);
          // Persist debounced
          clearTimeout(sidebarResizeRef.current);
          sidebarResizeRef.current = setTimeout(() => {
            ws.updateSettings({ sidebarWidth: sidebarWidth });
          }, 300);
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        return () => {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
      }, [isResizing, sidebarWidth, ws]);

      // Fetch home path for folder browser defaults
      useEffect(() => {
        fetch('/api/directories').then(r => r.json()).then(data => {
          if (data.home) window.__HOME_PATH = data.home;
        }).catch(() => {});
      }, []);

      // Persist minimized agents per workspace so refreshes keep the compact bar.
      useEffect(() => {
        if (!activeWorkspace || minimizedWorkspaceRef.current === activeWorkspace.id) return;
        minimizedWorkspaceRef.current = activeWorkspace.id;
        try {
          const raw = localStorage.getItem(`agent-forge:minimized-agents:${activeWorkspace.id}`);
          const ids = raw ? JSON.parse(raw) : [];
          setMinimizedAgents(new Set(Array.isArray(ids) ? ids.filter(id => workspaceAgentIdSet.has(id)) : []));
        } catch {
          setMinimizedAgents(new Set());
        }
      }, [activeWorkspace?.id, workspaceAgentIdsKey]);

      useEffect(() => {
        if (!minimizedStorageKey || minimizedWorkspaceRef.current !== activeWorkspace?.id) return;
        try {
          localStorage.setItem(
            minimizedStorageKey,
            JSON.stringify([...minimizedAgents].filter(id => workspaceAgentIdSet.has(id))),
          );
        } catch {}
      }, [minimizedStorageKey, activeWorkspace?.id, minimizedAgents, workspaceAgentIdsKey]);

      // Track unread messages for minimized agents (Feature 2)
      const prevMessagesRef = useRef({});
      useEffect(() => {
        for (const [agentId, msgs] of Object.entries(messages)) {
          const prevLen = prevMessagesRef.current[agentId] || 0;
          const newLen = (msgs || []).length;
          if (newLen > prevLen && minimizedAgents.has(agentId)) {
            setUnreadCounts(prev => ({ ...prev, [agentId]: (prev[agentId] || 0) + (newLen - prevLen) }));
          }
          prevMessagesRef.current[agentId] = newLen;
        }
      }, [messages, minimizedAgents]);

      // Global keyboard shortcuts
      useEffect(() => {
        const handler = (ev) => {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'n') {
            ev.preventDefault();
            setEditingAgent(null);
            setShowModal(true);
          }
          if (ev.key === 'Escape') {
            // Priority chain: 1) un-maximize, 2) stop focused agent, 3) do nothing
            if (maximizedAgent) {
              setMaximizedAgent(null);
            } else if (focusedAgentId) {
              const focused = agents.find(a => a.id === focusedAgentId);
              if (focused && (focused.status === 'working' || focused.status === 'thinking')) {
                ws.stopAgent(focusedAgentId);
              }
            }
          }
          // Ctrl+M / Cmd+M toggles maximize on focused agent
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'm') {
            ev.preventDefault();
            if (maximizedAgent) {
              setMaximizedAgent(null);
            } else if (focusedAgentId) {
              setMaximizedAgent(focusedAgentId);
            }
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [agents, ws, focusedAgentId, maximizedAgent]);

      // Keep workspace slots canonical: exactly one agent per visible slot,
      // no duplicates, no minimized/stale IDs, and no overflow beyond grid capacity.
      const displayAgents = activeWorkspace ? normalizeGridSlots(activeWorkspace.selectedAgentIds || []) : [];
      useEffect(() => {
        if (!activeWorkspace) return;
        if (!sameSlots(activeWorkspace.selectedAgentIds || [], displayAgents)) {
          ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: displayAgents });
        }
      }, [activeWorkspace?.id, activeWorkspace?.selectedAgentIds, columns, rows, agents.length, minimizedAgents]);

      // Split into minimized and non-minimized (skip empty placeholders for minimized bar)
      const minimizedDisplayAgents = workspaceAgentIds.filter(id => minimizedAgents.has(id));

      const handleMinimize = (agentId) => {
        setMinimizedAgents(prev => { const next = new Set(prev); next.add(agentId); return next; });
        if (activeWorkspace) {
          const excluded = new Set(minimizedAgents);
          excluded.add(agentId);
          ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: normalizeGridSlots(activeWorkspace.selectedAgentIds || [], excluded) });
        }
      };
      const handleRestore = (agentId) => {
        setMinimizedAgents(prev => { const next = new Set(prev); next.delete(agentId); return next; });
        setUnreadCounts(prev => { const n = { ...prev }; delete n[agentId]; return n; });
        if (activeWorkspace) {
          const excluded = new Set(minimizedAgents);
          excluded.delete(agentId);
          const current = (activeWorkspace.selectedAgentIds || []).filter(id => id && id !== agentId);
          const appended = [...current.slice(0, Math.max(0, totalPanels - 1)), agentId];
          ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: normalizeGridSlots(appended, excluded) });
        }
      };
      // Feature 4: Toggle maximize
      const handleToggleMaximize = (agentId) => {
        setMaximizedAgent(prev => prev === agentId ? null : agentId);
      };

      // Drag-to-rearrange handlers
      const handleDragStart = (agentId, ev) => {
        setDraggedAgent(agentId);
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', agentId);
      };
      const handleDragEnd = () => {
        setDraggedAgent(null);
        setDragOverSlot(null);
      };
      const handleDragOver = (slotIndex, ev) => {
        if (!draggedAgent) return;
        const lockedIds = activeWorkspace ? activeWorkspace.lockedAgentIds || [] : [];
        const nonMinimized = displayAgents;
        const targetAgentId = nonMinimized[slotIndex];
        if (targetAgentId && targetAgentId !== '' && lockedIds.includes(targetAgentId)) return;
        ev.preventDefault();
        ev.dataTransfer.dropEffect = 'move';
        setDragOverSlot(slotIndex);
      };
      const handleDragLeave = () => {
        setDragOverSlot(null);
      };
      const handleDrop = (targetSlotIndex) => {
        if (!draggedAgent || !activeWorkspace) return;
        const lockedIds = activeWorkspace.lockedAgentIds || [];
        const nonMinimized = displayAgents;
        // Build a full slot array (length = totalPanels), empty string for empty slots
        const slots = Array.from({ length: totalPanels }, (_, i) => nonMinimized[i] || '');
        const targetAgentId = slots[targetSlotIndex];
        if (targetAgentId && lockedIds.includes(targetAgentId)) return;

        const fromIndex = slots.indexOf(draggedAgent);
        const toIndex = targetSlotIndex;
        if (fromIndex === -1 || fromIndex === toIndex) { setDraggedAgent(null); setDragOverSlot(null); return; }

        // Swap: source gets whatever was in target (agent ID or empty string)
        slots[fromIndex] = slots[toIndex];
        slots[toIndex] = draggedAgent;

        ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: normalizeGridSlots(slots) });
        setDraggedAgent(null);
        setDragOverSlot(null);
      };

      // Lock/unlock toggle
      const toggleLock = (agentId) => {
        if (!activeWorkspace) return;
        const locked = activeWorkspace.lockedAgentIds || [];
        const updated = locked.includes(agentId)
          ? locked.filter(id => id !== agentId)
          : [...locked, agentId];
        ws.updateWorkspace(activeWorkspace.id, { lockedAgentIds: updated });
      };

      // Grid uses user-chosen columns/rows — override when maximized
      const gridStyle = maximizedAgent
        ? { gridTemplateColumns: '1fr', gridTemplateRows: '1fr' }
        : { gridTemplateColumns: 'repeat(' + columns + ', minmax(0, 1fr))', gridTemplateRows: 'repeat(' + rows + ', minmax(0, 1fr))' };

      // Grid column/row changes go through updateWorkspace
      const setColumns = (n) => { if (activeWorkspace) ws.updateWorkspace(activeWorkspace.id, { gridColumns: n }); };
      const setRows = (n) => { if (activeWorkspace) ws.updateWorkspace(activeWorkspace.id, { gridRows: n }); };

      const toggleAgent = (agentId) => {
        if (!activeWorkspace) return;
        const current = (activeWorkspace.selectedAgentIds || []).filter(id => id && id !== agentId);
        const updated = (activeWorkspace.selectedAgentIds || []).includes(agentId)
          ? normalizeGridSlots(current)
          : normalizeGridSlots([...current.slice(0, Math.max(0, totalPanels - 1)), agentId]);
        ws.updateWorkspace(activeWorkspace.id, { selectedAgentIds: updated });
      };

      // Activity bar tabs — Workspaces replaces Agents. Clicking the open tab
      // again collapses the wide panel so agent grids can use the extra width.
      const tabs = [
        { id: 'agents', icon: ICONS.agents, label: 'Workspaces' },
        { id: 'commands', icon: ICONS.commands, label: 'Slash Commands' },
        { id: 'emulators', icon: ICONS.emulators, label: 'Emulators' },
        { id: 'tokens', icon: null, emoji: '🪙', label: 'Token Usage' },
        { id: 'limits', icon: null, emoji: '⏳', label: 'Limits' },
      ];
      const openSidebarTab = (id) => {
        if (!sidebarCollapsed && sidebarTab === id) {
          setSidebarCollapsed(true);
          return;
        }
        setSidebarTab(id);
        setSidebarCollapsed(false);
      };

      return e(ExecutionContext.Provider, { value: { connected, liveTurnState, statusStartTimes } }, e('div', { className: 'app' },
        // Activity Bar
        e('div', { className: 'activity-bar' },
          tabs.map(tab =>
            e('button', {
              key: tab.id,
              className: 'activity-bar-btn' + (!sidebarCollapsed && sidebarTab === tab.id ? ' active' : ''),
              onClick: () => openSidebarTab(tab.id),
              title: !sidebarCollapsed && sidebarTab === tab.id ? tab.label + ' (click to collapse)' : tab.label,
              'aria-label': tab.label,
              'aria-pressed': !sidebarCollapsed && sidebarTab === tab.id,
              'aria-expanded': !sidebarCollapsed && sidebarTab === tab.id,
            }, tab.emoji ? e('span', { style: { fontSize: 18 } }, tab.emoji) : e(Icon, { d: tab.icon, size: 20 }))
          ),
          e('div', { className: 'activity-bar-spacer' }),
          e('button', {
            className: 'activity-bar-btn kill-all',
            onClick: () => {
              if (confirm('Force kill all Claude and Codex processes started on this machine?')) {
                ws.killAll();
              }
            },
            title: 'Force kill all agent CLI processes'
          }, '\u2620'),
          e('button', {
            className: 'activity-bar-btn activity-bar-bottom',
            onClick: () => setShowSharedContext(true),
            title: 'Settings'
          }, e(Icon, { d: ICONS.settings, size: 20 }))
        ),

        // Sidebar Panel
        !sidebarCollapsed && e('div', { className: 'sidebar-panel', style: { width: sidebarWidth } },
          e('div', { className: 'sidebar-resize-handle' + (isResizing ? ' active' : ''), onMouseDown: (ev) => { ev.preventDefault(); setIsResizing(true); } }),
          sidebarTab === 'agents' && e(WorkspacesSidebar, {
            workspaces,
            agents,
            activeWorkspaceId: activeWorkspace ? activeWorkspace.id : null,
            onSelectWorkspace: (id) => ws.setActiveWorkspace(id),
            onCreateWorkspace: ws.createWorkspace,
            onDeleteWorkspace: ws.deleteWorkspace,
            onRenameWorkspace: (id, name) => ws.updateWorkspace(id, { name }),
            onReorderWorkspaces: ws.reorderWorkspaces,
            onUpdateWorkspaceTesting: (id, updates) => ws.updateWorkspace(id, updates),
            onNewAgent: () => { setEditingAgent(null); setShowModal(true); },
            onEditAgent: (agent) => { setEditingAgent(agent); setShowModal(true); },
            onRemoveAgent: ws.removeAgent,
            statusStartTimes,
            liveTurnState,
          }),
          sidebarTab === 'commands' && e(CommandsPanel, { commands: SLASH_COMMANDS }),
          sidebarTab === 'emulators' && e(EmulatorsPanel, { settings, onUpdateSettings: ws.updateSettings }),
          sidebarTab === 'tokens' && e(TokensPanel, { report: usageReport }),
          sidebarTab === 'limits' && e(LimitsPanel, { limits: ws.limits, onRefresh: ws.refreshLimits }),
          // Active ports always pinned to bottom of sidebar
          e(SidebarPorts),
        ),

        // Main content
        e('div', { className: 'main-content' },
          !connected && e('div', { className: 'connection-error' }, 'Disconnected. Reconnecting...'),

          // Minimized panels bar (Feature 2)
          !maximizedAgent && minimizedDisplayAgents.length > 0 && e('div', { className: 'minimized-panels-bar' },
            minimizedDisplayAgents.map(agentId => {
              const agent = agents.find(a => a.id === agentId);
              if (!agent) return null;
              return e('div', {
                key: agentId,
                className: 'panel-minimized',
                onClick: () => handleRestore(agentId),
                role: 'button',
                tabIndex: 0,
                onKeyDown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); handleRestore(agentId); } },
              },
                e(AgentStatusDot, { agent }),
                e('span', { className: 'panel-minimized-name' }, agent.name),
                unreadCounts[agentId] > 0 && e('span', { className: 'panel-unread-badge' }, unreadCounts[agentId]),
                e('button', { className: 'panel-btn', onClick: (ev) => { ev.stopPropagation(); handleRestore(agentId); }, title: 'Expand' }, '\u25A1')
              );
            })
          ),

          // Terminal grid — fill all col*row slots, skip minimized agents
          e('div', { className: 'terminal-grid', style: gridStyle },
            (() => {
              // When maximized, only show that agent
              if (maximizedAgent) {
                const agent = agents.find(a => a.id === maximizedAgent);
                if (!agent) return e('div', { key: 'empty-max', className: 'terminal-panel' }, e('div', { className: 'panel-content panel-empty' }, 'Agent not found'));
                return e(TerminalPanel, {
                  key: maximizedAgent,
                  agent,
                  messages: messages[maximizedAgent] || [],
                  liveOutput: liveOutput[maximizedAgent] || '',
                  queuedMessages: queued[maximizedAgent] || [],
                  fileChanges: fileChanges[maximizedAgent] || [],
                  thinkingOutput: thinkingOutput[maximizedAgent] || '',
                  agentActivity: agentActivity[maximizedAgent] || null,
                  liveTurnState: liveTurnState[maximizedAgent] || null,
                  statusStartTime: statusStartTimes[maximizedAgent],
                  tokenUsage: tokenUsage[maximizedAgent],
                  terminals,
                  terminalOutput,
                  workspace: activeWorkspace,
                  onSendMessage: (content) => ws.sendMessage(agent.id, content),
                  onSendImages: ws.sendImages,
                  authRecoveries: (ws.authRecoveries || []).filter(item => item.agentId === agent.id),
                  onCheckAuth: ws.checkAuth,
                  onRetryAuthPrompt: ws.retryAuthPrompt,
                  onStop: ws.stopAgent,
                  onClearHistory: ws.clearHistory,
                  onClearFileChanges: ws.clearFileChanges,
                  onMinimize: null,
                  onMaximize: handleToggleMaximize,
                  isMaximized: true,
                  onFocus: setFocusedAgentId,
                  isFocused: focusedAgentId === maximizedAgent,
                  onCreateTerminal: ws.createTerminal,
                  onKillTerminal: ws.killTerminal,
                  onUpdateAgent: ws.updateAgent,
                  onResolveModelMismatch: ws.resolveModelMismatch,
                });
              }
              const nonMinimized = displayAgents;
              const lockedIds = activeWorkspace ? activeWorkspace.lockedAgentIds || [] : [];
              return Array.from({ length: totalPanels }).map((_, i) => {
                const agentId = nonMinimized[i];
                const agent = agentId ? agents.find(a => a.id === agentId) : null;
                if (!agent) return e('div', {
                  key: 'empty-' + i,
                  className: 'terminal-panel slot-empty' + (dragOverSlot === i ? ' drag-over' : ''),
                  onDragOver: (ev) => handleDragOver(i, ev),
                  onDragLeave: handleDragLeave,
                  onDrop: () => handleDrop(i),
                },
                  e('button', { className: 'slot-add-btn', onClick: () => { setEditingAgent(null); setShowModal(true); } }, '+ Add Agent')
                );
                const isLocked = lockedIds.includes(agentId);
                return e(TerminalPanel, {
                  key: agentId,
                  agent,
                  messages: messages[agentId] || [],
                  liveOutput: liveOutput[agentId] || '',
                  queuedMessages: queued[agentId] || [],
                  fileChanges: fileChanges[agentId] || [],
                  thinkingOutput: thinkingOutput[agentId] || '',
                  agentActivity: agentActivity[agentId] || null,
                  liveTurnState: liveTurnState[agentId] || null,
                  statusStartTime: statusStartTimes[agentId],
                  tokenUsage: tokenUsage[agentId],
                  terminals,
                  terminalOutput,
                  workspace: activeWorkspace,
                  onSendMessage: (content) => ws.sendMessage(agent.id, content),
                  onSendImages: ws.sendImages,
                  authRecoveries: (ws.authRecoveries || []).filter(item => item.agentId === agent.id),
                  onCheckAuth: ws.checkAuth,
                  onRetryAuthPrompt: ws.retryAuthPrompt,
                  onStop: ws.stopAgent,
                  onClearHistory: ws.clearHistory,
                  onClearFileChanges: ws.clearFileChanges,
                  onMinimize: handleMinimize,
                  onMaximize: handleToggleMaximize,
                  isMaximized: false,
                  onFocus: setFocusedAgentId,
                  isFocused: focusedAgentId === agentId,
                  onCreateTerminal: ws.createTerminal,
                  onKillTerminal: ws.killTerminal,
                  onUpdateAgent: ws.updateAgent,
                  onResolveModelMismatch: ws.resolveModelMismatch,
                  isLocked,
                  onToggleLock: toggleLock,
                  isDragging: draggedAgent === agentId,
                  isDragOver: dragOverSlot === i,
                  onDragStart: handleDragStart,
                  onDragEnd: handleDragEnd,
                  onDragOver: (ev) => handleDragOver(i, ev),
                  onDragLeave: handleDragLeave,
                  onDrop: () => handleDrop(i),
                });
              });
            })()
          ),

          // Bottom bar (workspace info, grid controls).
          // Token usage now lives in the dedicated Tokens sidebar tab.
          e('div', { className: 'bottom-bar' },
            e('div', { className: 'bottom-bar-left' },
              e(RuntimeTruthPill, { health: runtimeHealth }),
              activeWorkspace && e('span', { style: { fontWeight: 600, fontSize: 12, color: 'var(--text-primary)', marginRight: 8 } },
                e('span', { style: { color: 'var(--text-muted)', fontWeight: 500 } }, 'Workspace: '),
                activeWorkspace.name
              )
            ),
            e('div', { className: 'bottom-bar-right' },
              e(BottomLimitsSummary, { limits: ws.limits }),
              e('div', { className: 'grid-controls' },
                e('span', { className: 'grid-label' }, 'Columns'),
                e('div', { className: 'grid-buttons' },
                  [1,2,3,4].map(n => e('button', { key: n, className: 'grid-btn' + (columns === n ? ' active' : ''), onClick: () => setColumns(n), title: n + ' grid column' + (n === 1 ? '' : 's'), 'aria-label': 'Use ' + n + ' grid column' + (n === 1 ? '' : 's') }, n))
                )
              ),
              e('div', { className: 'grid-controls' },
                e('span', { className: 'grid-label' }, 'Rows'),
                e('div', { className: 'grid-buttons' },
                  [1,2,3].map(n => e('button', { key: n, className: 'grid-btn' + (rows === n ? ' active' : ''), onClick: () => setRows(n), title: n + ' grid row' + (n === 1 ? '' : 's'), 'aria-label': 'Use ' + n + ' grid row' + (n === 1 ? '' : 's') }, n))
                )
              ),
            )
          )
        ),

        // Modals
        e(NewAgentModal, {
          isOpen: showModal,
          onClose: () => { setShowModal(false); setEditingAgent(null); },
          onCreate: ws.createAgent,
          editAgent: editingAgent,
          onUpdate: ws.updateAgent,
          workspaceId: activeWorkspace ? activeWorkspace.id : undefined,
          defaultCwd: activeWorkspace ? activeWorkspace.cwd : '',
        }),
        e(SharedContextModal, { isOpen: showSharedContext, onClose: () => setShowSharedContext(false), content: sharedContext, onSave: ws.updateSharedContext }),

        // Error toasts
        errorToasts.length > 0 && e('div', { className: 'error-toast-container' },
          errorToasts.map(t => e('div', { key: t.id, className: 'error-toast' }, t.message))
        )
      ));
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
